.foe { position: absolute; width: 218px; height: 218px; cursor: pointer; }
.foe img { width: 100%; height: 100%; object-fit: cover; display: block;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%);
  transition: opacity .45s ease, transform .25s ease, filter .35s ease; }
.foe.is-new img { opacity: 0; transform: scale(.85); }
/* Actuel (v3.443.1) : fondu gris de 0,6 s */
.foe.dead-actuel img { opacity: 0; filter: grayscale(1); transition-duration: .6s; }
/* Arrêt sur image : l'ennemi blanchit et se fige un instant */

.stage.quake { animation: quake .28s ease; }
@keyframes quake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, 0); } 80% { transform: translate(2px, 1px); } }
/* Variante A : éclats */
.shard { position: absolute; background-size: 218px 218px; pointer-events: none; animation: shard .6s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes shard { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } }
.ring { position: absolute; border-radius: 50%; border: 3px solid rgba(255, 244, 214, .95); pointer-events: none; animation: ring .45s ease-out forwards; }
.ring.gold { border-color: #f0c64a; box-shadow: 0 0 18px rgba(240, 198, 74, .8); }
@keyframes ring { 0% { opacity: .95; transform: scale(.2); } 100% { opacity: 0; transform: scale(1.25); } }
/* Variante B : fondu lumineux */
.foe.dead-b img { opacity: 0; transform: scale(1.18) translateY(-6%); filter: brightness(2) blur(6px); transition: opacity .5s ease, transform .5s ease, filter .5s ease; }
.mote { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff4d6; box-shadow: 0 0 6px #fff4d6; pointer-events: none; animation: mote .9s ease-out forwards; }
@keyframes mote { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(var(--dx), -110px); } }
/* L'or s'envole vers la pastille du butin */
.coin { position: absolute; z-index: 30; display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 18px; color: #ffe08a; text-shadow: 0 2px 4px #000, 0 0 8px rgba(0, 0, 0, .8); pointer-events: none; transform: translate(-50%, -50%); }
.coin img { width: 22px; height: 22px; }
.coin.fly { transition: left .7s cubic-bezier(.5, -0.3, .7, .4), top .7s cubic-bezier(.5, -0.3, .7, .4), opacity .7s ease, transform .7s ease; }
.pill { position: absolute; z-index: 20; left: 203px; top: 7px; min-width: 54px; height: 30px; border-radius: 15px; display: flex; align-items: center; gap: 5px; padding: 0 10px; font-weight: 800; font-size: 13px; background: #1d150c; border: 1px solid rgba(232, 191, 90, .5); }
.pill img { width: 17px; height: 17px; }
.pill.pop { animation: pop .35s ease; }
@keyframes pop { 40% { transform: scale(1.25); border-color: #f0c64a; box-shadow: 0 0 12px rgba(240, 198, 74, .9); } }
/* Panneau de l'atelier, posé sur la zone des commandes */
.panel { position: absolute; left: 0; right: 0; bottom: 0; height: 236px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(10, 7, 4, .94); border-top: 2px solid #c27f1f; z-index: 40; }
.panel b { display: block; margin: 6px 0 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #f0aa3e; }
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: rgba(255, 255, 255, .08); }
.seg button { flex: 1 1 0; min-height: 40px; border: 0; border-radius: 9px; background: none; color: #f4e9d0; font: inherit; font-weight: 700; font-size: 13px; }
.seg button[aria-pressed="true"] { background: linear-gradient(#f0c64a, #c27f1f); color: #2e2214; }
.panel p { margin: 8px 0 0; font-size: 12.5px; color: rgba(244, 233, 208, .75); }
@media (prefers-reduced-motion: reduce) { .shard, .ring, .mote { display: none; } .stage.quake { animation: none; } }
</style>

var POS = [{ x: -35, y: 352 }, { x: 207, y: 352 }];   // mesurées dans le jeu (cbx-foe-img, 218 × 218)
var V = "a", K = "normal", total = 0;
var screen = document.getElementById("screen"), stage = document.getElementById("stage");

function seg(id, key) {
  Array.prototype.forEach.call(document.querySelectorAll("#" + id + " button"), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll("#" + id + " button"), function (x) { x.setAttribute("aria-pressed", x === b); });
      if (key === "v") V = b.getAttribute("data-v"); else { K = b.getAttribute("data-k"); respawnAll(); }
    };
  });
}
seg("seg-v", "v"); seg("seg-k", "k");

function spawn(i) {
  var f = document.createElement("div");
  f.className = "foe is-new"; f.style.left = POS[i].x + "px"; f.style.top = POS[i].y + "px";
  f.innerHTML = '<img src="' + (K === "elite" ? IMG.elite : IMG.wolf) + '" alt="">';
  f.onclick = function () { kill(f, i); };
  stage.appendChild(f);
  requestAnimationFrame(function () { requestAnimationFrame(function () { f.classList.remove("is-new"); }); });
}
function respawnAll() { Array.prototype.forEach.call(document.querySelectorAll(".foe"), function (f) { f.remove(); }); spawn(0); spawn(1); }

function kill(f, i) {
  if (f._dead) return;
  f._dead = true;
  var cx = POS[i].x + 109, cy = POS[i].y + 109;
  var gold = K === "elite" ? 40 : 6;
  if (V === "actuel") {
    f.classList.add("dead-actuel");
    flyGold(cx, cy - 20, gold, false);
    return done(f, i, 650);
  }
  var stop = K === "elite" ? 160 : (K === "crit" ? 120 : 90);   // arrêt sur image
  f.classList.add("is-stop");
  if (K !== "normal") { stage.classList.remove("quake"); void stage.offsetWidth; stage.classList.add("quake"); }
  setTimeout(function () {
    f.classList.remove("is-stop");
    ring(cx, cy, K === "elite");
    if (V === "a") { shards(f, i, K === "normal" ? 8 : 12); f.style.visibility = "hidden"; }
    else { f.classList.add("dead-b"); motes(cx, cy, K === "normal" ? 6 : 10); }
    flyGold(cx, cy - 20, gold, true);
    done(f, i, 700);
  }, stop);
}
function done(f, i, ms) { setTimeout(function () { f.remove(); spawn(i); }, ms + 500); }

function ring(cx, cy, gold) {
  var r = document.createElement("div"), s = gold ? 200 : 150;
  r.className = "ring" + (gold ? " gold" : "");
  r.style.left = (cx - s / 2) + "px"; r.style.top = (cy - s / 2) + "px"; r.style.width = r.style.height = s + "px";
  stage.appendChild(r); setTimeout(function () { r.remove(); }, 500);
}
/* Éclats : des morceaux de la même image, découpés en triangles autour du centre, projetés vers l'extérieur. */
function shards(f, i, n) {
  var src = f.querySelector("img").src;
  for (var k = 0; k < n; k++) {
    var a0 = (k / n) * Math.PI * 2, a1 = ((k + 1) / n) * Math.PI * 2, am = (a0 + a1) / 2;
    var p = function (a) { return (50 + 70 * Math.cos(a)).toFixed(1) + "% " + (50 + 70 * Math.sin(a)).toFixed(1) + "%"; };
    var d = document.createElement("div");
    d.className = "shard";
    d.style.left = POS[i].x + "px"; d.style.top = POS[i].y + "px"; d.style.width = d.style.height = "218px";
    d.style.backgroundImage = "url(" + src + ")";
    d.style.clipPath = "polygon(50% 50%, " + p(a0) + ", " + p(a1) + ")";
    d.style.webkitMaskImage = "radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%)";
    d.style.setProperty("--dx", (Math.cos(am) * (60 + Math.random() * 50)).toFixed(0) + "px");
    d.style.setProperty("--dy", (Math.sin(am) * (60 + Math.random() * 50) + 30).toFixed(0) + "px");
    d.style.setProperty("--rot", ((Math.random() - .5) * 90).toFixed(0) + "deg");
    stage.appendChild(d);
    (function (el) { setTimeout(function () { el.remove(); }, 650); })(d);
  }
}
function motes(cx, cy, n) {
  for (var k = 0; k < n; k++) {
    var m = document.createElement("div");
    m.className = "mote";
    m.style.left = (cx - 60 + Math.random() * 120) + "px"; m.style.top = (cy - 20 + Math.random() * 60) + "px";
    m.style.setProperty("--dx", ((Math.random() - .5) * 40).toFixed(0) + "px");
    m.style.animationDelay = (Math.random() * .15).toFixed(2) + "s";
    stage.appendChild(m);
    (function (el) { setTimeout(function () { el.remove(); }, 1100); })(m);
  }
}
/* L'or apparaît sur l'ennemi puis file vers la pastille (variantes A et B) ; « Actuel » le fait seulement monter. */
function flyGold(x, y, n, toPill) {
  var c = document.createElement("div");
  c.className = "coin"; c.innerHTML = '<img src="' + IMG.gold + '" alt="">+' + n;
  c.style.left = x + "px"; c.style.top = y + "px";
  screen.appendChild(c);
  setTimeout(function () {
    c.classList.add("fly");
    if (toPill) { c.style.left = "230px"; c.style.top = "22px"; c.style.transform = "translate(-50%, -50%) scale(.6)"; }
    else { c.style.top = (y - 60) + "px"; c.style.opacity = "0"; }
  }, toPill ? 260 : 60);
  setTimeout(function () {
    c.remove(); total += n;
    var p = document.querySelector(".pill"); document.getElementById("pill-n").textContent = total;
    if (toPill) { p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop"); }
  }, toPill ? 960 : 760);
}
/* Petit écran : la maquette garde 390 px de large, mise à l'échelle si besoin. */
function fit() { var s = Math.min(1, window.innerWidth / 390, window.innerHeight / 844); screen.style.transform = s < 1 ? "scale(" + s + ")" : ""; }
window.addEventListener("resize", fit); fit();
respawnAll();
</script>
