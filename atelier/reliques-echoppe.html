<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reliques à l'échoppe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Atelier « Reliques à l'échoppe » (option A de Seb du 27/10 : une relique parmi les 6 places de la vitrine,
   famille au hasard, rang du monde le plus loin, prix 2 500 × multiplicateur du monde).
   Variante A : carte au format des autres. Variante B : carte marquée « Relique » avec les emplacements du groupe. */
:root {
  --page: #1c140c; --parch: #e9d7b0; --bronze: #b98a4a;
  --nb-cream: #f6ecd9; --nb-cream-alt: #efe0c2; --nb-cream-deep: #e4cfa0; --nb-frame: #c27f1f; --nb-frame-light: #dcc79c;
  --nb-ink: #3a2c1a; --nb-ink-dim: #6b5d45; --nb-gold-deep: #7c5114; --nb-green-text: #1e7236; --nb-red: #c0392b;
  --relic: #6a3d9a; --relic-soft: #efe4f6;
  --cream-text: #f3e6c4; --gold-a: #f0c64a; --gold-b: #c27f1f;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--nb-ink); font: 14px/1.35 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; gap: 6px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--page); color: var(--cream-text); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > b { font-size: 12px; letter-spacing: .4px; text-transform: uppercase; color: var(--bronze); min-width: 64px; }
.bar button { min-height: 36px; padding: 4px 10px; border-radius: 10px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream-text); font: 700 13px var(--f-ui); cursor: pointer; }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: var(--nb-ink); border-color: var(--gold-a); }
button:focus-visible { outline: 2px solid var(--gold-a); outline-offset: 2px; }
main { display: grid; justify-items: center; padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone { width: 100%; max-width: var(--w, 390px); background: var(--parch); border-radius: 18px; padding: 14px 14px 18px; display: grid; gap: 12px; }
.timer { text-align: center; font-size: 13px; color: var(--nb-ink-dim); }
.note { font-size: 12.5px; color: var(--nb-ink-dim); text-align: center; }
.grid { display: grid; gap: 12px; }

/* Carte de la vitrine : reprise de .nb-purchase-card (capture du jeu, 390 px) */
.card { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 8px 12px; border-radius: 12px; border: 1px solid var(--bronze); background: var(--nb-cream); }
.ico { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #6d6150; background: #3b3530; display: block; object-fit: cover; }
.ico.rel { border-color: var(--relic); background: var(--relic-soft); border-radius: 12px; }
.icw { position: relative; width: 48px; height: 48px; }
.rk { position: absolute; left: -6px; top: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--relic); color: #fff; font: 800 11px/20px var(--f-ui); text-align: center; }
.info { min-width: 0; display: grid; gap: 2px; }
.nm { font-weight: 800; font-size: 14px; }
.nm.c { color: #9a9a9a; } .nm.r { color: #3f78c9; } .nm.rel { color: var(--relic); }
.meta { font-weight: 700; font-size: 13px; color: var(--nb-gold-deep); }
.ln { font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 6px; }
.ln b { font-weight: 800; }
.dn { color: var(--nb-red); font-weight: 800; white-space: nowrap; } .up { color: var(--nb-green-text); font-weight: 800; white-space: nowrap; }
.dim { color: var(--nb-ink-dim); font-size: 12.5px; }
.for { font-size: 12.5px; }
.for.ok { color: var(--nb-green-text); font-weight: 700; } .for.no { color: var(--nb-ink-dim); }
.buy { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--nb-frame);
  background: linear-gradient(#f6d27a, #e7b04a); color: var(--nb-ink); font: 800 14px var(--f-ui); white-space: nowrap; }
.buy img { width: 18px; height: 18px; }
.buy.poor { opacity: .55; } .buy.done { background: var(--nb-cream-deep); opacity: .8; }

/* Variante B : carte marquée, emplacements du groupe en pastilles */
.card.b { border: 1.5px solid var(--relic); background: linear-gradient(var(--relic-soft), var(--nb-cream) 46%); padding-top: 22px; }
.ribbon { position: absolute; top: -1px; left: 12px; padding: 2px 9px; border-radius: 0 0 8px 8px; background: var(--relic); color: #fff; font: 800 10.5px var(--f-ui); letter-spacing: .6px; text-transform: uppercase; }
.party { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.pc { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 2px; border-radius: 999px; border: 1px solid var(--nb-frame-light); background: var(--nb-cream); font-size: 12px; font-weight: 700; }
.pc img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
.pc.ok { border-color: var(--nb-green-text); color: var(--nb-green-text); } .pc.no { color: var(--nb-ink-dim); }
</style>
</head>
<body>
<div class="bar">
  <div class="row"><b>Variante</b><button data-k="v" data-v="A">A · carte simple</button><button data-k="v" data-v="B">B · carte marquée</button></div>
  <div class="row"><b>Monde</b><button data-k="w" data-v="0">Forêt</button><button data-k="w" data-v="1">Désert</button><button data-k="w" data-v="2">Ruines</button><button data-k="w" data-v="3">Crypte</button><button data-k="w" data-v="4">Montagne</button></div>
  <div class="row"><b>Famille</b><button data-k="f" data-v="croc">Croc</button><button data-k="f" data-v="ecorce">Écorce</button><button data-k="f" data-v="sceau">Sceau</button><button data-k="f" data-v="sablier">Sablier</button><button data-k="f" data-v="talisman">Talisman</button><button data-k="f" data-v="besace">Besace</button></div>
  <div class="row"><b>Cas</b><button data-k="c" data-v="libre">Emplacement libre</button><button data-k="c" data-v="mieux">Remplace plus faible</button><button data-k="c" data-v="rien">Rien à améliorer</button><button data-k="c" data-v="cher">Trop cher</button><button data-k="c" data-v="achete">Achetée</button></div>
  <div class="row"><b>Largeur</b><button data-k="px" data-v="320">320 px</button><button data-k="px" data-v="390">390 px</button></div>
</div>
<main><div class="phone" id="phone"></div></main>
<script>
"use strict";
var IMG = "../game/images/";
function src(p) { return IMG + p; }
/* Icône absente : le carré neutre du jeu (utils.js), jamais une autre image. */
var MISSING = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="10" fill="#efe0c2" stroke="#8a7a5c" stroke-width="3" stroke-dasharray="7 5"/><text x="32" y="43" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#8a7a5c">?</text></svg>');
window.addEventListener("error", function (e) { var t = e.target; if (t && t.tagName === "IMG" && !t.dataset.miss) { t.dataset.miss = 1; t.src = MISSING; } }, true);

var MONDES = [["de la Forêt", "Forêt enchantée"], ["du Désert", "Désert oublié"], ["des Ruines", "Ruines anciennes"], ["de la Crypte", "Crypte des dormeurs"], ["de la Montagne", "Montagne brûlante"]];
var MULT = [1, 4, 10, 25, 90], OR = [4000, 12000, 30000, 140000, 400000];
var FAM = {
  croc: ["Croc", function (r) { return "+" + 3 * r + " % dégâts"; }],
  ecorce: ["Écorce", function (r) { return "+" + 3 * r + " % PV"; }],
  sceau: ["Sceau", function (r) { return "+" + 6 * r + " % menace"; }],
  sablier: ["Sablier", function (r) { return "Recharge −" + (r >= 5 ? 2 : 1); }],
  talisman: ["Talisman", function (r) { return "Héros +" + r + " % dégâts"; }],
  besace: ["Besace", function (r) { return "+" + 5 * r + " % butin de patrouille"; }]
};
var S = { v: "A", w: 4, f: "croc", c: "libre", px: 390 };
function fmt(n) { return n >= 1e5 ? Math.round(n / 1000) + " k" : n >= 1e4 ? (Math.round(n / 100) / 10).toString().replace(".", ",") + " k" : n.toLocaleString("fr-FR"); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function equipCard(nm, cls, meta, lines, prix, ic) {
  return '<div class="card"><img class="ico" src="' + src("Icons/equipment_icon/" + ic + ".webp") + '" alt=""><div class="info"><div class="nm ' + cls + '">' + nm + '</div><div class="meta">' + meta + '</div>'
    + lines.map(function (l) { return '<div class="ln"><span>' + l[0] + '</span><span class="' + (l[1][0] === "+" ? "up" : "dn") + '">' + (l[1][0] === "+" ? "▲ " : "▼ ") + l[1] + '</span></div>'; }).join("")
    + '</div><span class="buy"><img src="' + src("Icons/gold_icon.webp") + '" alt="">' + fmt(prix) + '</span></div>';
}

function relicCard() {
  var r = S.w + 1, F = FAM[S.f], nom = F[0] + " " + MONDES[S.w][0], prix = 2500 * MULT[S.w];
  var poor = S.c === "cher", done = S.c === "achete";
  var effet = F[1](r) + (S.f === "talisman" ? "" : " au compagnon");
  var pour = {
    libre: ["ok", "Emplacement libre : Wenna, Edda"],
    mieux: ["ok", "Remplace " + F[0] + " " + MONDES[Math.max(0, S.w - 1)][0] + " chez Maddoc"],
    rien: ["no", "Tes compagnons portent déjà mieux"],
    cher: ["ok", "Emplacement libre : Wenna"],
    achete: ["no", "Dans tes reliques"]
  }[S.c];
  var btn = done ? '<span class="buy done">Acheté</span>' : '<span class="buy' + (poor ? " poor" : "") + '"><img src="' + src("Icons/gold_icon.webp") + '" alt="">' + fmt(prix) + '</span>';
  var ico = '<span class="icw"><img class="ico rel" src="' + src("Icons/companions/relics/relic_" + S.f + ".webp") + '" alt=""><span class="rk">' + r + '</span></span>';
  if (S.v === "A") {
    return '<div class="card">' + ico + '<div class="info"><div class="nm rel">' + esc(nom) + '</div><div class="meta">Relique · rang ' + r + ' · ' + MONDES[S.w][1] + '</div>'
      + '<div class="ln"><b>' + esc(effet) + '</b></div><div class="dim">Une par famille sur un même compagnon</div><div class="for ' + pour[0] + '">' + esc(pour[1]) + '</div></div>' + btn + '</div>';
  }
  var party = [["wenna", "Wenna"], ["maddoc", "Maddoc"], ["edda", "Edda"]].map(function (c, i) {
    var st = S.c === "rien" || S.c === "achete" ? ["no", "—"] : S.c === "mieux" ? (i === 1 ? ["ok", "↑ mieux"] : ["no", "—"]) : (i === 1 ? ["no", "—"] : ["ok", "libre"]);
    if (S.c === "cher" && i === 2) st = ["no", "—"];
    return '<span class="pc ' + st[0] + '"><img src="' + src("Companions/" + c[0] + ".webp") + '" alt="">' + c[1] + ' ' + st[1] + '</span>';
  }).join("");
  return '<div class="card b"><span class="ribbon">Relique</span>' + ico + '<div class="info"><div class="nm rel">' + esc(nom) + '</div><div class="meta">Rang ' + r + ' · ' + MONDES[S.w][1] + '</div>'
    + '<div class="ln"><b>' + esc(effet) + '</b></div><div class="dim">Une par famille sur un même compagnon</div></div>' + btn + '<div class="party">' + party + '</div></div>';
}

function render() {
  document.documentElement.style.setProperty("--w", S.px + "px");
  document.querySelectorAll(".bar button").forEach(function (b) { b.setAttribute("aria-pressed", String(S[b.dataset.k]) === b.dataset.v); });
  var m = MULT[S.w];
  var h = '<div class="timer">↻ Renouvellement gratuit dans 3h 12m</div>';
  h += '<div class="note">Bourse : ' + fmt(S.c === "cher" ? Math.round(2500 * m * 0.6) : OR[S.w]) + ' or · une relique par vitrine, au rang du monde le plus loin</div>';
  h += '<div class="grid">';
  h += equipCard("Talisman", "c", "Commun · " + MONDES[S.w][1], [["+2,2 % critique", "-8,8 %"], ["+13 % PV max (équipé)", "-13 %"]], 300 * m, "amulet_common");
  h += relicCard();
  h += equipCard("Hache", "r", "Rare · " + MONDES[S.w][1], [["+304 dégâts par coup", "-91"], ["+6 % expérience", "+6 %"]], 2500 * m, "axe_rare");
  h += '</div>';
  document.getElementById("phone").innerHTML = h;
}
document.querySelector(".bar").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  S[b.dataset.k] = /^\d+$/.test(b.dataset.v) ? Number(b.dataset.v) : b.dataset.v; render();
});
render();
</script>
</body>
</html>
