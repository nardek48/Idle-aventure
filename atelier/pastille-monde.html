<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pastille de monde</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Atelier v3.492.13 (L2) : pastille de monde sur l'icône des objets ; variante D (icône + aura) proposée par Seb. Disposition : barre de choix collante, puis les
   quatre endroits où l'objet se montre (Sac, Équipé, échoppe, fiche), à la taille du jeu. Couleurs = jetons du jeu. */
:root {
  --page: #1c140c; --parch: #e9d7b0; --frame: #6b4a22; --ink: #2e2214; --brown: #8a5c14; --bronze: #b98a4a;
  --cream: #f3e6c4; --white: #fffaf0; --gold-a: #f0c64a; --gold-b: #c27f1f; --tile-a: #5a4128; --tile-b: #2a1c10;
  --up: #3f8f3a; --down: #c0392b; --mix: #8a6a3a; --epic: #8b4fc4; --epic-name: #d2a6ff; --rare: #3a78c2; --rare-name: #8fc0ff;
  --w-forest: #4f9a45; --w-desert: #d9a441; --w-ruins: #8193a8; --w-crypt: #9a64d6; --w-mountain: #e8622a;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.35 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; gap: 6px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--page); color: var(--cream); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > b { font-size: 12px; letter-spacing: .4px; text-transform: uppercase; color: var(--bronze); min-width: 64px; }
.bar button { min-height: 36px; padding: 4px 11px; border-radius: 10px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream); font: 700 13px var(--f-ui); }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: var(--ink); border-color: var(--gold-a); }
.bar button:focus-visible { outline: 2px solid var(--gold-a); outline-offset: 2px; }
main { display: grid; gap: 14px; padding-block: 12px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--parch); border-top: 3px solid var(--frame); }
.intro { margin: 0; font-size: 13px; color: var(--brown); max-width: 62ch; }
.intro b { color: var(--ink); }
h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .5px; text-transform: uppercase; color: var(--frame); text-wrap: balance; }
section { min-width: 0; }
.note { margin: 6px 0 0; font-size: 12px; color: var(--brown); }
/* Légende des mondes */
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
/* Sac : tuiles du jeu (wh-tile / hs-btile) */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tile { position: relative; aspect-ratio: 1; max-width: 100%; border: 1px solid #3a2410; border-radius: 12px; overflow: hidden; background: radial-gradient(var(--tile-a), var(--tile-b)); }
.tile.epic { border-color: var(--epic); box-shadow: inset 0 0 14px rgba(160, 90, 230, .55); }
.tile.rare { border-color: var(--rare); box-shadow: inset 0 0 14px rgba(70, 140, 230, .5); }
.tile > img.it { position: absolute; top: 6%; left: 14%; width: 72%; height: 72%; object-fit: contain; }
.band { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 4px 6px; text-align: center; background: linear-gradient(rgba(10, 6, 2, 0), rgba(10, 6, 2, .92) 40%); }
.band span { display: block; font-size: 12px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.epic .band span, .name.epic { color: var(--epic-name); }
.rare .band span, .name.rare { color: var(--rare-name); }
.cmp { position: absolute; top: 4px; right: 4px; display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 3px;
  border-radius: 10px; font: 900 12px/1 var(--f-ui); color: var(--white); border: 1px solid rgba(0, 0, 0, .35); }
.cmp.up { background: var(--up); } .cmp.down { background: var(--down); } .cmp.mix { background: var(--mix); }
/* Équipé : emplacements du jeu (hs-eslot, 70 px) */
.eq { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px 6px; padding: 12px 6px; border-radius: 16px; border: 2px solid var(--bronze);
  background: linear-gradient(#f6ead0, #e9d7b0); justify-items: center; }
.slot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.slot .ico { position: relative; width: 70px; height: 70px; border-radius: 12px; background: rgba(36, 23, 11, .85); border: 2px solid #6b5a40; box-shadow: 0 2px 6px rgba(40, 20, 0, .35); }
.slot .ico > img.it { width: 100%; height: 100%; object-fit: contain; }
.slot small { padding: 0 6px; border-radius: 6px; background: rgba(255, 248, 234, .85); font-size: 12px; font-weight: 700; color: var(--ink); }
.slot .cmp { top: -6px; right: -6px; }
/* Échoppe : carte d'achat */
.card { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; border: 2px solid var(--epic); background: #f6ecd8; }
.card + .card { margin-top: 8px; }
.card .ico { position: relative; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(var(--tile-a), var(--tile-b)); }
.card .ico > img.it { width: 100%; height: 100%; object-fit: contain; }
.card .meta { font-size: 13px; font-weight: 700; color: var(--brown); }
.card .lines { font-size: 13px; color: var(--ink); }
.price { min-height: 40px; padding: 4px 14px; border-radius: 20px; border: 2px solid var(--gold-b); background: linear-gradient(var(--gold-a), #e0a83a); font-weight: 900; color: var(--ink); display: inline-flex; align-items: center; }
.name { font-weight: 800; font-size: 15px; }
/* Fiche : tête de la feuille de comparaison */
.sheet { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: #2a1d12; color: var(--cream); }
.sheet .ico { position: relative; width: 44px; height: 44px; flex: none; border-radius: 50%; background: radial-gradient(var(--tile-a), var(--tile-b)); }
.sheet .ico > img.it { width: 100%; height: 100%; object-fit: contain; }
.sheet b { display: block; font-size: 17px; }
.sheet small { font-size: 13px; color: #d9c9a8; }
/* LA PASTILLE — trois variantes */
.pw { position: absolute; z-index: 2; pointer-events: none; }
.pw.v-icone { top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #1d140b; border: 1.5px solid var(--bronze); box-shadow: 0 1px 3px rgba(0, 0, 0, .55); }
.pw.v-icone img { position: absolute; inset: 1px; width: calc(100% - 2px); height: calc(100% - 2px); object-fit: contain; }
.pw.v-point { top: 5px; left: 5px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--white); box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .5); }
.pw.v-ici { top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #1d140b; border: 1.5px solid var(--gold-a); box-shadow: 0 0 0 2px rgba(240, 198, 74, .35), 0 0 8px rgba(240, 198, 74, .8); }
.pw.v-ici img { position: absolute; inset: 1px; width: calc(100% - 2px); height: calc(100% - 2px); object-fit: contain; }
.slot .pw { top: -6px; left: -6px; }
.sheet .pw, .card .pw { top: -4px; left: -4px; }
.sheet .pw.v-icone, .sheet .pw.v-ici { width: 18px; height: 18px; }
.sheet .pw.v-point { width: 10px; height: 10px; }
/* D : l'objet du monde où se tient le héros a une aura d'or autour de son cadre (affinité +10 %) */
.tile.aura { border-color: var(--gold-a); box-shadow: inset 0 0 14px rgba(160, 90, 230, .55), 0 0 0 2px var(--gold-a), 0 0 10px 2px rgba(240, 198, 74, .85); }
.slot .ico.aura, .card .ico.aura, .sheet .ico.aura { border-color: var(--gold-a); box-shadow: 0 0 0 2px var(--gold-a), 0 0 12px 3px rgba(240, 198, 74, .85); }
.aura-ex { display: inline-block; width: 22px; height: 22px; border-radius: 6px; background: radial-gradient(var(--tile-a), var(--tile-b)); box-shadow: 0 0 0 2px var(--gold-a), 0 0 8px 2px rgba(240, 198, 74, .85); }
.legend .pw { position: relative; top: 0; left: 0; display: inline-block; flex: none; }
.verdict { margin: 0; padding: 10px 12px; border-radius: 12px; background: #f6ecd8; border: 1.5px dashed var(--bronze); font-size: 13px; }
.verdict b { color: var(--frame); }
@media (prefers-reduced-motion: no-preference) { .pw { transition: opacity .15s; } }
</style>
</head>
<body>
<div class="bar">
  <div class="row" role="group" aria-label="Variante"><b>Pastille</b>
    <button type="button" id="v-aura" data-v="aura">D · Icône + aura</button>
    <button type="button" id="v-icone" data-v="icone">A · Icône</button>
    <button type="button" id="v-point" data-v="point">B · Couleur</button>
    <button type="button" id="v-ici" data-v="ici">C · Ton monde</button>
    <button type="button" id="v-aucune" data-v="aucune">Sans</button>
  </div>
  <div class="row" role="group" aria-label="Monde du héros"><b>Tu es en</b>
    <button type="button" id="m-4" data-m="4">Montagne</button>
    <button type="button" id="m-3" data-m="3">Crypte</button>
  </div>
</div>
<main>
  <p class="intro" id="intro"></p>
  <div class="legend" id="legend"></div>
  <section><h2>Sac</h2><div class="grid" id="sac"></div></section>
  <section><h2>Équipé</h2><div class="eq" id="eq"></div><p class="note">Le badge de comparaison reste en haut à droite ; la pastille prend le coin opposé.</p></section>
  <section><h2>Échoppe de la Halle</h2><div id="shop"></div></section>
  <section><h2>Fiche de comparaison</h2><div id="sheet"></div></section>
  <p class="verdict" id="verdict"></p>
</main>

// Mondes du jeu (index = worldIndex des objets) ; couleurs = jetons --w-*
var MONDES = [
  { id: "forest", nom: "Forêt enchantée", c: "var(--w-forest)" }, { id: "desert", nom: "Désert", c: "var(--w-desert)" },
  { id: "ruins", nom: "Ruines", c: "var(--w-ruins)" }, { id: "crypt", nom: "Crypte des dormeurs", c: "var(--w-crypt)" },
  { id: "mountain", nom: "Montagne brûlante", c: "var(--w-mountain)" }
];
// Exemples d'objets (noms et raretés du jeu)
var SAC = [
  { i: "casque_epic", n: "Heaume", r: "epic", w: 4, cmp: "up" }, { i: "armor_epic", n: "Cuirasse", r: "epic", w: 3, cmp: "down" },
  { i: "ring_epic", n: "Bague", r: "epic", w: 4, cmp: "up" }, { i: "amulet_epic", n: "Pendentif", r: "epic", w: 3, cmp: "mix" },
  { i: "gants_rare", n: "Gantelets", r: "rare", w: 2, cmp: "down" }, { i: "sword_epic", n: "Épée", r: "epic", w: 4, cmp: "up" },
  { i: "bottes_epic", n: "Bottes", r: "epic", w: 3, cmp: "down" }, { i: "casque_rare", n: "Casque", r: "rare", w: 1, cmp: "down" }
];
var EQ = [
  { s: "Arme", i: "sword_epic", w: 4 }, { s: "Armure", i: "armor_epic", w: 3, cmp: "up" }, { s: "Casque", i: "casque_epic", w: 4 }, { s: "Gants", i: "gants_epic", w: 4 },
  { s: "Bottes", i: "bottes_epic", w: 4 }, { s: "Anneau", i: "ring_epic", w: 3, cmp: "up" }, { s: "Amulette", i: "amulet_epic", w: 3, cmp: "mix" }
];
var SHOP = [
  { i: "ring_epic", n: "Bague", w: 4, l: "+7 % critique · +98 dégâts par coup", p: "12 k" },
  { i: "armor_epic", n: "Cuirasse", w: 3, l: "+10 % défense · +20 célérité", p: "9 000" }
];
var TEXTES = {
  icone: "<b>A · Icône du monde</b> sur chaque objet, quel que soit son monde. Toujours lisible, mais six petits dessins de plus dans un sac plein.",
  point: "<b>B · Point de couleur</b> sur chaque objet : une couleur par monde. Très discret ; il faut apprendre les couleurs (légende ci-dessous).",
  aura: "<b>D · Icône + aura</b> (idée de Seb) : l'icône du monde sur chaque objet, et une aura d'or autour des pièces du monde où tu te tiens, celles qui ont l'affinité (+10 %).",
  ici: "<b>C · Ton monde seulement</b> : seule la pièce du monde où tu te tiens porte la pastille, cerclée d'or. C'est aussi celle qui a l'affinité (+10 %). Les autres restent nues.",
  aucune: "<b>Sans pastille</b> : le jeu aujourd'hui. Heaume, Cuirasse, Bague… rien ne dit d'où ils viennent."
};
var etat = { v: "aura", m: 4 };
try { var s = JSON.parse(localStorage.getItem("pastille-monde-d") || "{}"); if (s.v) etat.v = s.v; if (s.m) etat.m = s.m; } catch (e) {}

function pastille(w) {
  var M = MONDES[w];
  if (etat.v === "icone" || etat.v === "aura") return '<span class="pw v-icone" title="' + M.nom + '"><img src="' + WORLD_IMG[M.id] + '" alt=""></span>';
  if (etat.v === "point") return '<span class="pw v-point" style="background:' + M.c + '" title="' + M.nom + '"></span>';
  if (etat.v === "ici" && w === etat.m && w >= 4) return '<span class="pw v-ici" title="' + M.nom + ' · +10 % ici"><img src="' + WORLD_IMG[M.id] + '" alt=""></span>';
  return "";
}
// D : aura sur le cadre de l'objet du monde courant (Montagne et après, comme l'affinité)
function aura(w) { return etat.v === "aura" && w === etat.m && w >= 4 ? " aura" : ""; }
function rendre() {
  document.getElementById("intro").innerHTML = TEXTES[etat.v];
  var leg = "";
  if (etat.v === "icone" || etat.v === "point" || etat.v === "aura") MONDES.forEach(function (M, w) { leg += "<span>" + pastille(w) + M.nom + "</span>"; });
  if (etat.v === "ici") leg = "<span>" + (etat.m >= 4 ? pastille(etat.m) + "De ton monde : +10 % ici" : "En Crypte, aucune pièce n'a d'affinité : rien n'est marqué") + "</span>";
  if (etat.v === "aura") leg += "<span>" + (etat.m >= 4 ? '<i class="aura-ex"></i>Aura : de ton monde, +10 % ici' : "En Crypte, aucune aura : pas d'affinité") + "</span>";
  document.getElementById("legend").innerHTML = leg;
  document.getElementById("sac").innerHTML = SAC.map(function (o) {
    return '<div class="tile ' + o.r + aura(o.w) + '"><img class="it" src="' + ICO[o.i] + '" alt="">' + pastille(o.w) + '<i class="cmp ' + o.cmp + '">' + (o.cmp === "up" ? "▲" : o.cmp === "down" ? "▼" : "≈") + '</i><div class="band"><span>' + o.n + '</span></div></div>';
  }).join("");
  document.getElementById("eq").innerHTML = EQ.map(function (o) {
    return '<div class="slot"><div class="ico' + aura(o.w) + '"><img class="it" src="' + ICO[o.i] + '" alt="">' + pastille(o.w) + (o.cmp ? '<i class="cmp ' + o.cmp + '">' + (o.cmp === "up" ? "▲" : "≈") + '</i>' : "") + '</div><small>' + o.s + '</small></div>';
  }).join("");
  document.getElementById("shop").innerHTML = SHOP.map(function (o) {
    return '<div class="card"><div class="ico' + aura(o.w) + '"><img class="it" src="' + ICO[o.i] + '" alt="">' + pastille(o.w) + '</div><div><div class="name epic">' + o.n + '</div><div class="meta">Épique · ' + MONDES[o.w].nom + '</div><div class="lines">' + o.l + '</div></div><span class="price">' + o.p + '</span></div>';
  }).join("");
  document.getElementById("sheet").innerHTML = '<div class="sheet"><div class="ico' + aura(4) + '"><img class="it" src="' + ICO.casque_epic + '" alt="">' + pastille(4) + '</div><div><b>Heaume</b><small>Casque · comparé à Heaume (Crypte)</small></div></div>';
  document.getElementById("verdict").innerHTML = "<b>Retenue : D.</b> Chaque objet dit d'où il vient (icône du monde, coin haut gauche) ; les pièces de ton monde, celles qui ont l'affinité (+10 %), brillent en plus d'une aura d'or. Bascule « Crypte » : l'aura disparaît, les icônes restent.";
  document.querySelectorAll("[data-v]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === etat.v)); });
  document.querySelectorAll("[data-m]").forEach(function (b) { b.setAttribute("aria-pressed", String(Number(b.getAttribute("data-m")) === etat.m)); });
  try { localStorage.setItem("pastille-monde-d", JSON.stringify(etat)); } catch (e) {}
}
document.querySelectorAll("[data-v]").forEach(function (b) { b.onclick = function () { etat.v = b.getAttribute("data-v"); rendre(); }; });
document.querySelectorAll("[data-m]").forEach(function (b) { b.onclick = function () { etat.m = Number(b.getAttribute("data-m")); rendre(); }; });
rendre();
</script>
