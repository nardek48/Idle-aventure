<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PV bas au départ</title>
<style>
/* Atelier v3.509.0 : avertissement « PV bas » avant une sortie contre une élite ou un boss (décision Seb, option A).
   Couleurs = jetons du jeu (css/00-tokens.css). Chiffres repris du code : feu 5 % PV max/min, petite ration 35 %. */
:root {
  --gold: #f0aa3e; --gold-a: #f0c64a; --gold-b: #c27f1f; --gold-deep: #8a5c14; --ink: #f4e9d0; --ink-dim: rgba(244, 233, 208, .72);
  --page: #120e0a; --panel: rgba(42, 31, 20, .92); --panel-2: rgba(28, 20, 12, .9); --line: rgba(240, 170, 62, .35);
  --green: #8fbf5a; --red: #ff8a7a; --red-deep: #c4483a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
img { display: block; }

/* Barre de l'atelier (hors jeu) */
.bar { position: sticky; top: 0; z-index: 30; padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: #000; }
.bar-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bar-row + .bar-row { margin-top: 6px; }
.bar b { font-size: 12px; color: var(--ink-dim); margin-right: 2px; }
.bar button { min-height: 34px; padding: 4px 9px; border-radius: 10px; border: 1.5px solid var(--gold-b); background: transparent; font-weight: 700; font-size: 12.5px; }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: #2e2214; }
.bar input[type=range] { flex: 1 1 120px; accent-color: var(--gold); }
.bar output { min-width: 42px; font-weight: 800; font-size: 13px; text-align: right; }

/* Fond : l'écran Quêtes, flouté derrière la feuille */
.scene { max-width: 430px; margin: 0 auto; padding: 16px; opacity: .35; }
.scene .card { height: 84px; margin-bottom: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }

/* ---------- Feuille de préparation (ksheet) ---------- */
.backdrop { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .55); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 430px; max-height: calc(100vh - var(--bar-h, 170px) - 8px); margin: 0 auto; display: flex; flex-direction: column;
  border-radius: 18px 18px 0 0; background: #1b140d; border: 1px solid var(--line); border-bottom: 0; box-shadow: 0 -8px 24px rgba(0, 0, 0, .6); }
.sheet-head { display: flex; gap: 10px; align-items: center; padding: 12px 16px 8px; }
.sheet-head img { width: 40px; height: 40px; }
.sheet-head h2 { margin: 0; font-size: 18px; }
.sheet-head small { display: block; color: var(--ink-dim); font-size: 12.5px; }
.sheet-head .x { margin-left: auto; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .35); font-size: 18px; }
.sheet-body { overflow-y: auto; padding: 0 16px 12px; }
.sheet-foot { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.kbtn { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--gold-b); background: var(--panel-2); font-weight: 800; font-size: 15px; }
.kbtn.primary { border: 0; background: linear-gradient(var(--gold-a), var(--gold-b)); color: #2e2214; }
/* Partir quand même : le bouton reste là, mais il ne brille plus */
.kbtn.risk { border: 1.5px solid var(--red-deep); background: rgba(196, 72, 58, .16); color: var(--red); }

.sec { margin-top: 10px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.sec-t { font-weight: 800; font-size: 14px; margin-bottom: 6px; }
.dim { color: var(--ink-dim); font-size: 12.5px; }
.ghost { height: 44px; margin-top: 8px; border-radius: 10px; background: rgba(0, 0, 0, .25); }

/* ---------- L'encart « PV bas » ---------- */
.lowhp { margin-top: 4px; padding: 12px; border-radius: 14px; background: rgba(196, 72, 58, .14); border: 1.5px solid var(--red-deep); }
.lowhp-t { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; color: var(--red); }
.lowhp-t img { width: 22px; height: 22px; }
.gauge { position: relative; height: 22px; margin: 10px 0 6px; border-radius: 11px; background: rgba(0, 0, 0, .45); overflow: hidden; }
.gauge i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #a8322a, #e0574a); }
.gauge i.ok { background: linear-gradient(90deg, #5d8a35, var(--green)); }
.gauge span { position: relative; display: block; line-height: 22px; text-align: center; font-weight: 800; font-size: 12.5px; text-shadow: 0 1px 2px #000; }
.gauge u { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(244, 233, 208, .55); text-decoration: none; }
.lowhp p { margin: 4px 0 0; font-size: 13px; }
.lowhp p b { color: var(--ink); }
.lowhp-acts { display: grid; gap: 6px; margin-top: 10px; }
.act { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border-radius: 12px; border: 1.5px solid var(--gold-b); background: var(--panel-2); text-align: left; }
.act img { width: 30px; height: 30px; flex: none; }
.act span { flex: 1; font-weight: 800; font-size: 14px; }
.act small { display: block; font-weight: 600; font-size: 12px; color: var(--ink-dim); }
.act em { font-style: normal; font-weight: 800; font-size: 12px; color: var(--green); }
.act[disabled] { opacity: .45; }

/* ---------- Repli : modale de confirmation (feuille absente en début de partie) ---------- */
.modal { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .6); }
.kwin { width: 100%; max-width: 360px; border-radius: 16px; background: #1b140d; border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0, 0, 0, .7); }
.kwin-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
.kwin-head img { width: 34px; height: 34px; }
.kwin-head h2 { margin: 0; font-size: 18px; color: var(--red); }
.kwin-body { padding: 0 16px 6px; }
.kwin-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 16px 14px; }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 40; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: #000; border: 1px solid var(--gold-b); font-size: 13px; font-weight: 700; display: none; }
.toast.on { display: block; }
.note { max-width: 430px; margin: 0 auto; padding: 10px 16px 0; font-size: 12.5px; color: var(--ink-dim); }
</style>
</head>
<body>
<div class="bar">
  <div class="bar-row">
    <b>Atelier · PV bas</b>
    <button type="button" data-v="sheet" aria-pressed="true">Feuille de sortie</button>
    <button type="button" data-v="modal" aria-pressed="false">Sans feuille</button>
  </div>
  <div class="bar-row">
    <b>Sortie</b>
    <button type="button" data-q="elite" aria-pressed="true">Élite</button>
    <button type="button" data-q="boss" aria-pressed="false">Boss d'histoire</button>
    <button type="button" data-q="farm" aria-pressed="false">Chasse</button>
  </div>
  <div class="bar-row">
    <b>PV</b><input type="range" id="hp" min="1" max="100" value="4"><output id="hp-out">4 %</output>
    <b>Rations</b>
    <button type="button" data-r="0" aria-pressed="false">0</button>
    <button type="button" data-r="2" aria-pressed="true">2</button>
  </div>
  <div class="bar-row">
    <b>Seuil</b>
    <button type="button" data-s="30" aria-pressed="false">30 %</button>
    <button type="button" data-s="50" aria-pressed="true">50 %</button>
    <button type="button" data-s="70" aria-pressed="false">70 %</button>
  </div>
</div>
<p class="note" id="note"></p>
<div class="scene"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div>
<div id="root"></div>
<div class="toast" id="toast"></div>

var S = { view: "sheet", quest: "elite", hpPct: 4, rations: 2, seuil: 50, maxHp: 400, open: true };
var REGEN = 0.05, RATION = 0.35, POTIONS = 2;   // CAMP_REGEN_PCT_PER_MIN, petite_ration.healPct, SORTIE_POTION_CAP
var QUESTS = {
  elite: { title: "Les yeux blancs", sub: "Élite · Fileuse aux yeux blancs", icon: "elite", strong: true },
  boss: { title: "Le cœur de la forêt", sub: "Histoire · boss", icon: "combat", strong: true },
  farm: { title: "Battue en forêt", sub: "Chasse", icon: "combat", strong: false }
};

/* L'avertissement ne vise que les élites et boss, sous le seuil (farm jamais gêné). */
function warns() { return QUESTS[S.quest].strong && S.hpPct < S.seuil; }
function hp() { return Math.max(1, Math.round(S.maxHp * S.hpPct / 100)); }
function minToFull() { return Math.ceil((100 - S.hpPct) / 100 / REGEN); }

function lowHpHTML(noTitle) {
  var h = '<div class="lowhp">';
  if (!noTitle) h += '<div class="lowhp-t"><img src="' + ICO.warn + '" alt="">PV bas pour une ' + (S.quest === "boss" ? "quête de boss" : "élite") + '</div>';
  h += '<div class="gauge"><i style="width:' + S.hpPct + '%"></i><u style="left:' + S.seuil + '%"></u><span>' + hp() + ' / ' + S.maxHp + ' PV · ' + S.hpPct + ' %</span></div>';
  h += '<p>Tu pars avec <b>' + S.hpPct + ' % de tes PV</b>. Les PV ne remontent pas pendant la sortie : seules tes <b>' + POTIONS + ' potions</b> te soigneront.</p>';
  h += '<div class="lowhp-acts">';
  var gain = Math.min(100 - S.hpPct, Math.round(RATION * 100));
  h += '<button type="button" class="act" onclick="eat()"' + (S.rations ? '' : ' disabled') + '><img src="' + ICO.ration + '" alt="">'
    + '<span>Manger une petite ration<small>' + (S.rations ? 'En stock : ' + S.rations : 'Aucune en stock · Cuisine de camp') + '</small></span>'
    + (S.rations ? '<em>+' + gain + ' %</em>' : '') + '</button>';
  h += '<button type="button" class="act" onclick="rest()"><img src="' + ICO.fire + '" alt="">'
    + '<span>Se reposer au Feu de camp<small>PV au maximum dans ' + minToFull() + ' min</small></span></button>';
  h += '</div></div>';
  return h;
}

function sheetHTML() {
  var q = QUESTS[S.quest], w = warns();
  var h = '<div class="backdrop" onclick="closeAll()"></div><div class="sheet">';
  h += '<div class="sheet-head"><img src="' + ICO[q.icon] + '" alt=""><div><h2>' + q.title + '</h2><small>' + q.sub + '</small></div>'
    + '<button type="button" class="x" onclick="closeAll()">✕</button></div>';
  h += '<div class="sheet-body">';
  if (w) h += lowHpHTML();   // en tête : avant « Ce que tu vas affronter »
  h += '<div class="sec"><div class="sec-t">Ce que tu vas affronter</div><div class="dim">Toile collante · Venin</div><div class="ghost"></div></div>';
  h += '<div class="sec"><div class="sec-t">Mode de combat</div><div class="ghost"></div></div>';
  h += '<div class="sec"><div class="sec-t">Équipe</div><div class="ghost"></div></div>';
  h += '</div><div class="sheet-foot">';
  h += '<button type="button" class="kbtn" onclick="closeAll()">Renoncer</button>';
  h += w ? '<button type="button" class="kbtn risk" onclick="go()">Partir à ' + S.hpPct + ' %</button>'
         : '<button type="button" class="kbtn primary" onclick="go()">Partir</button>';
  return h + '</div></div>';
}

/* Repli : début de partie, la feuille est sautée (sortiePrepHasChoice faux) -> petite modale. */
function modalHTML() {
  if (!warns()) return '<div class="modal" onclick="closeAll()"><div class="kwin"><div class="kwin-body" style="padding:16px">'
    + 'PV suffisants (' + S.hpPct + ' %) ou sortie sans élite : départ direct, aucune modale.</div></div></div>';
  var h = '<div class="modal"><div class="kwin">';
  h += '<div class="kwin-head"><img src="' + ICO.warn + '" alt=""><h2>PV bas pour une ' + (S.quest === "boss" ? "quête de boss" : "élite") + '</h2></div><div class="kwin-body">' + lowHpHTML(true) + '</div>';
  h += '<div class="kwin-foot"><button type="button" class="kbtn" onclick="closeAll()">Renoncer</button>'
    + '<button type="button" class="kbtn risk" onclick="go()">Partir à ' + S.hpPct + ' %</button></div>';
  return h + '</div></div>';
}

function render() {
  document.getElementById("hp").value = S.hpPct;
  document.getElementById("hp-out").textContent = S.hpPct + " %";
  document.getElementById("note").textContent = S.open ? "" : "Feuille fermée. Touche un réglage de la barre pour la rouvrir.";
  document.getElementById("root").innerHTML = !S.open ? "" : (S.view === "sheet" ? sheetHTML() : modalHTML());
  [["v", "view"], ["q", "quest"], ["r", "rations"], ["s", "seuil"]].forEach(function (k) {
    document.querySelectorAll("[data-" + k[0] + "]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset[k[0]]) === String(S[k[1]])); });
  });
}

function toast(t) {
  var el = document.getElementById("toast");
  el.textContent = t; el.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("on"); }, 1800);
}
/* La ration se mange depuis la feuille : la jauge et l'encart se mettent à jour sans fermer. */
function eat() {
  if (!S.rations) return;
  S.rations--; S.hpPct = Math.min(100, S.hpPct + Math.round(RATION * 100));
  toast("Petite ration : +35 % PV"); render();
}
function rest() { S.open = false; toast("→ Campement : Feu de camp, " + minToFull() + " min"); render(); }
function go() { S.open = false; toast("Départ en quête à " + S.hpPct + " % PV"); render(); }
function closeAll() { S.open = false; render(); }

document.querySelector(".bar").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v) S.view = b.dataset.v;
  if (b.dataset.q) S.quest = b.dataset.q;
  if (b.dataset.r) S.rations = Number(b.dataset.r);
  if (b.dataset.s) S.seuil = Number(b.dataset.s);
  S.open = true; render();
});
document.getElementById("hp").addEventListener("input", function (e) { S.hpPct = Number(e.target.value); S.open = true; render(); });
/* La feuille s'arrête sous la barre de l'atelier (hors jeu). */
function barH() { document.documentElement.style.setProperty("--bar-h", document.querySelector(".bar").offsetHeight + "px"); }
window.addEventListener("resize", barH); barH();
render();
</script>
</body>
</html>
