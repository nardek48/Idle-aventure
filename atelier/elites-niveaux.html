<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Élites à niveaux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Atelier « Élites à niveaux » (idée de Seb, proposition validée le 04/11) : niveau par élite rejouable (meilleur + 1),
   PV ×1,15 et puissance ×1,10 par niveau (comme les donjons), matériau ×niveau, or +10 %/niveau, frein du jour gardé. */
:root {
  --page: #1c140c; --bronze: #b98a4a; --cream-text: #f3e6c4; --gold-a: #f0c64a; --gold-b: #c27f1f;
  --card: #f6ecd9; --card-alt: #efe0c2; --ink: #3a2c1a; --ink-dim: #635640; --frame: #c27f1f; --frame-light: #dcc79c;
  --green: #1a642f; --amber: #8a5c14; --red: #a3322a;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--cream-text); font: 15px/1.35 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--page); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; gap: 6px; padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--page); border-bottom: 1px solid #3a2a18; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > b { font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--bronze); min-width: 58px; }
.bar button { min-height: 34px; padding: 4px 10px; border-radius: 10px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream-text); font: 600 13px var(--f-ui); }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: var(--ink); border-color: var(--gold-a); }
.note { font-size: 12px; color: #c9b48a; margin: 0; }
main { max-width: 430px; margin: 0 auto; padding: 12px 12px 80px; }

/* Feuille de préparation (copie simplifiée de .ksheet) */
.sheet { border-radius: 18px; overflow: hidden; border: 2px solid var(--frame); background: var(--card); color: var(--ink); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #2a1d10; color: var(--cream-text); }
.sheet-head img { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--frame); background: #120d08; object-fit: cover; }
.sheet-head b { display: block; font: 700 17px Georgia, serif; }
.sheet-head small { display: block; font-size: 12px; color: #d8c49a; }
.sheet-body { padding: 12px; display: grid; gap: 10px; }
.sec { display: grid; gap: 6px; }
.sec-t { font-size: 12px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--amber); }
.verdict { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: 14px; }
.verdict.ok { background: rgba(47, 158, 90, .14); border: 1.5px solid rgba(47, 158, 90, .5); color: var(--green); }
.verdict.mid { background: rgba(217, 154, 52, .16); border: 1.5px solid rgba(217, 154, 52, .6); color: var(--amber); }
.verdict.bad { background: rgba(200, 60, 60, .12); border: 1.5px solid rgba(200, 60, 60, .5); color: var(--red); }
/* Sélecteur de niveau : copie de .dlvl (css/04-panel-dungeon.css) */
.dlvl-row { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.dlvl-step { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #8a5c14; background: linear-gradient(#f6d27a, #d99a34); color: #2a1a08;
  font: 800 22px/1 var(--f-ui); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 2px 4px rgba(0,0,0,.3); }
.dlvl-step:disabled { opacity: .4; }
.dlvl-num { text-align: center; line-height: 1.1; }
.dlvl-num small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-dim); letter-spacing: .06em; text-transform: uppercase; }
.dlvl-num strong { font-size: 26px; font-weight: 800; }
.dgain { padding: 8px 10px; border-radius: 12px; background: var(--card-alt); border: 1px solid var(--frame-light); font-size: 13px; display: grid; gap: 4px; }
.dgain-row { display: flex; align-items: center; gap: 8px; }
.dgain-row img { width: 22px; height: 22px; flex: 0 0 auto; }
.dot { width: 22px; flex: 0 0 auto; text-align: center; color: var(--amber); }
.is-dim { color: var(--ink-dim); }
.go { min-height: 48px; border-radius: 12px; border: 2px solid #12355a; background: linear-gradient(#3a7bc0, #1d4f86); color: #fff; font: 800 16px var(--f-ui); }
/* Panneau du secteur (carte vivante), variante B */
.panel { margin-top: 12px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--frame); background: var(--card); color: var(--ink); display: grid; gap: 6px; }
.panel h3 { margin: 0; font: 700 17px Georgia, serif; }
.panel p { margin: 0; font-size: 14px; }
.panel p b { font-weight: 800; }
</style>
</head>
<body>
<div class="bar">
  <div class="row"><b>Placement</b><button data-v="A">A · Feuille de préparation</button><button data-v="B">B · Panneau du secteur</button></div>
  <div class="row"><b>Meilleur</b><button data-best="0">jamais battue</button><button data-best="3">niveau 3</button><button data-best="9">niveau 9</button></div>
  <div class="row"><b>Aujourd'hui</b><button data-w="0">0 victoire</button><button data-w="2">2 victoires</button></div>
  <p class="note" id="note"></p>
</div>
<main id="app"></main>

/* Le Vieux Golem (Montagne) : Cendre vive, 2 par victoire au niveau 1 ; pièce Épique 35 %, garantie à la 3e. */
var BASE = 2, GOLD = 2400;
var NOTES = {
  A: "A (recommandée) : le niveau se choisit à la préparation, comme la feuille de lancement des donjons. Le pronostic, « À gagner » et « Ce qui t'attend » suivent le niveau.",
  B: "B : le niveau se choisit sur la carte, dans le panneau du secteur, avant d'ouvrir la préparation. La préparation reste comme aujourd'hui."
};
var st = { v: "A", best: 3, w: 0, L: 4 };
function pct(x) { return Math.round(x * 100); }
function mult(L) { return { hp: Math.pow(1.15, L - 1), pw: Math.pow(1.10, L - 1) }; }
function brake() { return 1 + .25 * st.w; }
function maxL() { return st.best + 1; }
/* Pronostic simulé pour l'atelier : le héros tient à l'aise jusqu'au niveau 4, risqué ensuite. */
function verdict(L) { var f = mult(L).pw * brake(); return f < 1.35 ? ["ok", "Sans danger"] : f < 1.8 ? ["mid", "Risqué"] : ["bad", "Dangereux"]; }
function stepperHTML() {
  var L = st.L;
  return '<div class="dlvl-row"><button class="dlvl-step" data-step="-1"' + (L <= 1 ? " disabled" : "") + '>‹</button>'
    + '<div class="dlvl-num"><small>Niveau</small><strong>' + L + '</strong><small>' + (st.best ? "meilleur : " + st.best : "jamais battue") + '</small></div>'
    + '<button class="dlvl-step" data-step="1"' + (L >= maxL() ? " disabled" : "") + '>›</button></div>';
}
function gainHTML() {
  var L = st.L, g = Math.round(GOLD * Math.pow(1.1, L - 1));
  return '<div class="dgain"><div class="sec-t">À gagner</div>'
    + '<div class="dgain-row"><img src="' + I.cendre + '" alt=""><span>Cendre vive <b>+' + BASE * L + '</b>' + (L > 1 ? ' <span class="is-dim">(×' + L + ')</span>' : '') + '</span></div>'
    + '<div class="dgain-row"><img src="' + I.or + '" alt=""><span>Or <b>~' + g.toLocaleString("fr-FR") + '</b>' + (L > 1 ? ' <span class="is-dim">(+' + pct(Math.pow(1.1, L - 1) - 1) + ' %)</span>' : '') + '</span></div>'
    + '<div class="dgain-row"><span class="dot">◆</span><span>Pièce <b style="color:#6a3d9a">Épique</b> : 35 % par victoire, la 3e sans pièce en donne une</span></div></div>';
}
function aheadHTML() {
  var m = mult(st.L), b = brake();
  return '<div class="dgain"><div class="sec-t">Ce qui t\'attend</div>'
    + (st.L > 1 ? '<div class="dgain-row"><span class="dot">•</span><span>Niveau ' + st.L + ' : PV +' + pct(m.hp - 1) + ' %, dégâts +' + pct(m.pw - 1) + ' %</span></div>' : '<div class="dgain-row"><span class="dot">•</span><span>Niveau 1 : l\'élite à sa force de base</span></div>')
    + (st.w ? '<div class="dgain-row"><span class="dot">•</span><span>Aujourd\'hui, ' + st.w + ' victoires : encore +' + pct(b - 1) + ' % (le frein retombe à la nuit)</span></div>' : '')
    + '</div>';
}
function render() {
  document.querySelectorAll("[data-v]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.v === st.v); });
  document.querySelectorAll("[data-best]").forEach(function (b) { b.setAttribute("aria-pressed", +b.dataset.best === st.best); });
  document.querySelectorAll("[data-w]").forEach(function (b) { b.setAttribute("aria-pressed", +b.dataset.w === st.w); });
  document.getElementById("note").textContent = NOTES[st.v];
  st.L = Math.max(1, Math.min(maxL(), st.L));
  var v = verdict(st.L), h = "";
  var head = '<div class="sheet-head"><img src="' + I.golem + '" alt=""><span><b>Le Vieux Golem</b><small>Élite de la carte · La forge froide</small></span></div>';
  if (st.v === "A") {
    h += '<div class="sheet">' + head + '<div class="sheet-body">'
      + '<div class="sec">' + stepperHTML() + '</div>'
      + '<div class="verdict ' + v[0] + '">Pronostic : ' + v[1] + '</div>'
      + gainHTML() + aheadHTML()
      + '<div class="dgain is-dim" style="font-size:12px">(Mode de combat, compagnons, potions et objets : inchangés)</div>'
      + '<button class="go" type="button">Partir</button></div></div>';
  } else {
    h += '<div class="panel"><h3>La forge froide</h3><p><b>Le Vieux Golem</b>, élite de la carte, rejouable.</p>'
      + stepperHTML()
      + '<p><b>Chaque victoire :</b> +' + BASE * st.L + ' Cendre vive, or +' + pct(Math.pow(1.1, st.L - 1) - 1) + ' %. Pièce Épique 35 %.</p>'
      + '<p><b>Niveau ' + st.L + ' :</b> PV +' + pct(mult(st.L).hp - 1) + ' %, dégâts +' + pct(mult(st.L).pw - 1) + ' %' + (st.w ? ', et +' + pct(brake() - 1) + ' % aujourd\'hui (' + st.w + ' victoires)' : '') + '.</p>'
      + '<button class="go" type="button">Combattre</button></div>';
    h += '<p class="note" style="margin-top:10px">La préparation qui suit reste celle d\'aujourd\'hui (pronostic au niveau choisi).</p>';
  }
  document.getElementById("app").innerHTML = h;
}
document.addEventListener("click", function (e) {
  var t = e.target.closest("button"); if (!t) return;
  if (t.dataset.v) st.v = t.dataset.v; else if (t.dataset.best != null) { st.best = +t.dataset.best; st.L = st.best + 1; }
  else if (t.dataset.w != null) st.w = +t.dataset.w; else if (t.dataset.step) st.L += +t.dataset.step; else return;
  render();
});
render();
</script>
</body>
</html>
