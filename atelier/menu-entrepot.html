<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu de l'Entrepôt</title>
<style>
/* Atelier : menu « Afficher » de l'Entrepôt (Village) — actuel contre proposition compacte. Couleurs = jetons du jeu. */
:root {
  --bronze: #b98a4a; --white: #fffaf0; --cream: #f3e6c4; --ink: #2e2214; --brown: #8a5c14; --menu-bg: #fbf3e4;
  --gold-a: #f0c64a; --gold-b: #c27f1f; --chip: #e2d1ae; --chip-ink: #4f3d26; --green: #2f8a46; --red: #c0392b; --link: #7a4e12;
  --page: #1c140c; --parch: #e9d7b0; --frame: #6b4a22; --nav: #2a1f14; --nav-h: 86px;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.bar { position: sticky; top: 0; z-index: 30; display: flex; gap: 8px; align-items: center; padding: 8px 16px; background: var(--page); color: var(--cream); }
.bar b { font-size: 13px; letter-spacing: .3px; margin-right: auto; }
.bar button { min-height: 36px; padding: 4px 12px; border-radius: 10px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream); font: inherit; font-weight: 700; }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: var(--ink); }
.zone { position: fixed; left: 0; right: 0; top: calc(52px + env(safe-area-inset-top, 0px)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); overflow-y: auto; padding: 10px 16px 24px; background: var(--parch); border-top: 3px solid var(--frame); border-bottom: 3px solid var(--frame); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; height: var(--nav-h); padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: repeat(5, 1fr); background: var(--nav); color: var(--cream); font-weight: 700; font-size: 12px; text-align: center; align-items: center; }
h1 { margin: 0 0 8px; font-size: 18px; text-align: center; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(107, 74, 34, .18); margin-bottom: 10px; }
.seg span { padding: 9px 2px; border-radius: 10px; text-align: center; font-weight: 800; font-size: 13px; color: var(--brown); }
.seg .on { background: linear-gradient(var(--gold-a), var(--gold-b)); color: var(--ink); }
.filter { position: relative; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.dd { position: relative; flex: 1 1 auto; min-width: 0; z-index: 4; }
.veil { position: fixed; inset: 0; z-index: 3; }
.dd-btn { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 5px 12px; border: 1.5px solid var(--bronze); border-radius: 12px; background: linear-gradient(var(--white), var(--cream)); color: var(--ink); font: inherit; font-size: 14px; font-weight: 800; line-height: 1.15; text-align: left; }
.dd-btn img, .menu img { width: 24px; height: 24px; object-fit: contain; flex: none; }
.dd-btn small { display: block; font-size: 12px; font-weight: 700; color: var(--brown); }
.car { margin-left: auto; font-size: 13px; color: var(--brown); }
.menu { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); padding: 4px; border: 1.5px solid var(--brown); border-radius: 12px; background: var(--menu-bg); box-shadow: 0 8px 20px rgba(0, 0, 0, .45); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 6px 10px; border: 0; border-radius: 9px; background: none; color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; text-align: left; }
.menu button.on { background: linear-gradient(var(--gold-a), var(--gold-b)); }
.menu hr { border: 0; border-top: 1px dashed rgba(138, 92, 20, .4); margin: 4px 6px; }
.lbl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n { flex: none; margin-left: auto; min-width: 24px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--chip); color: var(--chip-ink); font-size: 12px; font-weight: 800; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.n.red { background: var(--red); color: #fff; }
.pick { color: var(--link) !important; text-decoration: underline; }
.zeros { flex: none; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--chip-ink); }
.sw { width: 40px; height: 24px; border-radius: 12px; background: var(--chip); border: 1.5px solid var(--bronze); position: relative; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: var(--white); }
/* Proposition : le menu prend toute la ligne, catégories et états en grille 2 colonnes */
.v-new .dd { position: static; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 2px 0; }
.grid2 button { width: auto; min-width: 0; min-height: 40px; padding: 4px 6px; gap: 5px; font-size: 13px; border: 1px solid rgba(185, 138, 74, .45); }
.grid2 button img { width: 20px; height: 20px; }
.grid2 .n { min-width: 20px; height: 18px; padding: 0 4px; line-height: 18px; }
.grid2 .lbl { white-space: normal; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cap { margin: 2px 6px 0; font-size: 12px; font-weight: 700; color: var(--brown); letter-spacing: .3px; }
.res { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { aspect-ratio: 1; max-width: 100%; border-radius: 14px; background: #2a1f14; border: 2px solid var(--frame); display: grid; place-items: center; position: relative; }
.tile img { width: 56%; }
.tile i { position: absolute; left: 4px; right: 4px; bottom: 3px; font-style: normal; font-size: 12px; font-weight: 800; color: var(--cream); text-align: center; }
.mesure { margin: 14px 0 0; padding: 8px 10px; border-radius: 10px; background: rgba(255, 250, 240, .7); font-size: 12.5px; color: var(--chip-ink); font-variant-numeric: tabular-nums; }
.mesure b { color: var(--ink); } .mesure .ko { color: var(--red); } .mesure .ok { color: var(--green); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--white); font-weight: 700; font-size: 13px; }
button:focus-visible { outline: 3px solid var(--gold-a); outline-offset: 2px; }
</style>

<div class="bar"><b>Menu de l'Entrepôt</b><button id="v-old" type="button" aria-pressed="false">Actuel</button><button id="v-new" type="button" aria-pressed="true">Proposition</button></div>
<div class="zone" id="zone"></div>
<div class="nav"><span>Camp</span><span>Quêtes</span><span>Village</span><span>Héros</span><span>Menu</span></div>
<div class="toast" id="toast" hidden></div>

var ICON = { all: "w_all", raw: "raw", crafted: "crafted", special: "special", full: "full", run: "run", mine: "mine" };

function menuOld() {
  return '<div class="menu" id="menu">' + row("all") + row("raw") + row("crafted") + row("special") + '<hr>' + row("full") + row("run") + '<hr>' + row("mine") + pick + '</div>';
}
function menuNew() {
  return '<div class="menu" id="menu">' + row("all")
    + '<div class="grid2">' + row("raw") + row("crafted") + row("special") + row("mine") + '</div>'
    + '<div class="cap">ÉTAT</div><div class="grid2">' + row("full") + row("run") + '</div><hr>' + pick + '</div>';
}
function render() {
  var h = '<h1>Village</h1><div class="seg"><span>Bâtiments</span><span>Production</span><span>Ateliers</span><span class="on">Entrepôt</span></div>';
  h += '<div class="filter">' + (state.open ? '<div class="veil" data-close="1"></div>' : '');
  h += '<div class="dd"><button type="button" class="dd-btn" id="dd-btn"><img src="' + I[ICON[state.f]] + '" alt=""><span><small>Afficher</small>' + N[state.f] + '</span><span class="car">' + (state.open ? '▲' : '▼') + '</span></button>';
  if (state.open) h += state.v === "old" ? menuOld() : menuNew();
  h += '</div><span class="zeros"><span class="sw"></span>Zéros</span></div>';
  h += '<div class="res">' + [["raw", "Bois"], ["crafted", "Planche"], ["special", "Sève"], ["raw", "Pierre"]].map(function (r) { return '<div class="tile"><img src="' + I[r[0]] + '" alt=""><i>' + r[1] + '</i></div>'; }).join("") + '</div>';
  h += '<p class="mesure" id="mesure"></p>';

function measure() {
  var m = document.getElementById("menu"), z = document.getElementById("zone"), out = document.getElementById("mesure");

  var mr = m.getBoundingClientRect(), zr = z.getBoundingClientRect(), marge = Math.round(zr.bottom - mr.bottom);

}
document.addEventListener("click", function (e) {

});
