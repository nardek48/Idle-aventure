<!doctype html>

<body>
<title>Or à investir</title>
<style>
/* Atelier v3.429.24 : bulle « or à investir » (option A). Couleurs = jetons du jeu (css/00-tokens.css). */
:root {
  --bronze: #b98a4a; --white: #fffaf0; --cream: #f3e6c4; --ink: #2e2214; --dim: #6b5236; --brown: #8a5c14;
  --gold: #d4a017; --gold-a: #f0c64a; --gold-b: #c27f1f; --parch: #efe0c2; --page: #1c140c; --nav: #2a1f14;
  --bub-a: #3d3226; --bub-b: #1b1510; --red: #b3261e; --green: #2f8a46; --blue-a: #3c6fb0; --blue-b: #234a80; --nav-h: 86px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--cream); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 6px; background: rgba(12, 9, 6, .94); display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.row b { flex: none; font-size: 12px; color: var(--bronze); width: 62px; }
.row button { flex: none; min-height: 32px; padding: 3px 10px; border-radius: 9px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream); font: inherit; font-size: 12px; font-weight: 700; }
.row button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: var(--ink); }
/* Écran de Camp simulé */
.scene { position: fixed; left: 0; right: 0; top: calc(86px + env(safe-area-inset-top, 0px)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); background: radial-gradient(ellipse at 50% 70%, #4a3016 0%, #22170c 55%, #120c06 100%); }
.res { display: flex; justify-content: center; gap: 14px; padding: 8px 16px; background: rgba(0, 0, 0, .45); font-weight: 800; font-variant-numeric: tabular-nums; }
.res span { display: flex; align-items: center; gap: 4px; }
.res img { width: 20px; height: 20px; }
.camp-ttl { text-align: center; margin-top: 30%; color: rgba(243, 230, 196, .35); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; height: var(--nav-h); padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: repeat(5, 1fr); background: var(--nav); color: var(--cream); font-weight: 700; font-size: 12px; text-align: center; align-items: center; }
/* Dock : copie de .hud-dock / .hud-bub (css/02-layout.css) */
.dock { position: fixed; right: max(10px, calc(50% - 185px)); bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.bub { position: relative; width: 48px; height: 48px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--gold); background: radial-gradient(circle at 35% 30%, var(--bub-a), var(--bub-b)); box-shadow: 0 3px 10px rgba(0, 0, 0, .65); cursor: pointer; }
.bub:active { transform: scale(.94); }
.bub img { width: 30px; height: 30px; object-fit: contain; pointer-events: none; }
.bub.quiet { width: 36px; height: 36px; border-width: 1.5px; border-color: var(--brown); opacity: .8; }
.bub.quiet img { width: 22px; height: 22px; }
.tip { position: absolute; right: 56px; top: 50%; transform: translateY(-50%); white-space: nowrap; padding: 5px 9px; border-radius: 9px; background: rgba(12, 9, 6, .92); border: 1px solid var(--brown); color: #ffe9b0; font-size: 12px; font-weight: 700; line-height: 1; pointer-events: none; }
.quiet .tip { right: 44px; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--red); border: 1.5px solid #fff3d6; color: #fff; font-size: 11px; font-weight: 800; line-height: 16px; text-align: center; }
.bub.new { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
/* Fenêtre : copie de .kwin (css/00-components.css) */
.veil { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: rgba(12, 8, 5, .62); }
.kwin { position: relative; width: min(344px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 16px; border-radius: 18px; background: var(--parch); color: var(--ink); box-shadow: 0 14px 40px rgba(0, 0, 0, .6); animation: kpop .22s ease-out; }
@keyframes kpop { from { transform: scale(.94); opacity: 0; } }
.khead { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 48px 6px; text-align: center; }
.khead img { width: 48px; height: 48px; object-fit: contain; }
.kttl { font-size: 18px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.ksub { font-size: 13px; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; }
.kx { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--brown); background: rgba(255, 248, 232, .5); color: var(--ink); font-size: 18px; font-weight: 800; }
.kbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 16px 0; }
/* Carte de la meilleure dépense */
.best { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 10px; padding: 10px; border-radius: 12px; border: 2px solid var(--gold); background: rgba(255, 248, 232, .55); }
.best > img { grid-row: span 2; width: 44px; height: 44px; object-fit: contain; }
.best h3 { margin: 0; font-size: 15px; line-height: 1.2; }
.best p { margin: 0; font-size: 13px; line-height: 1.35; color: var(--dim); }
.cost { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 9px; background: rgba(107, 74, 34, .14); font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.chip img { width: 18px; height: 18px; }
.chip.ok { color: var(--green); } .chip.ko { color: var(--red); background: rgba(179, 38, 30, .1); }
.hint { grid-column: 1 / -1; margin-top: 2px; font-size: 13px; color: var(--ink); }
/* Autres dépenses ouvertes */
.also { margin: 12px 0 0; font-size: 12px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--dim); }
.alt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; margin-top: 6px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid rgba(138, 92, 20, .45); background: rgba(255, 248, 232, .35); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; text-align: left; }
.alt img { width: 30px; height: 30px; object-fit: contain; flex: none; }
.alt .lbl { flex: 1 1 auto; min-width: 0; }
.alt small { display: block; font-size: 12px; font-weight: 600; color: var(--dim); }
.alt .px { flex: none; display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-variant-numeric: tabular-nums; }
.alt .px img { width: 16px; height: 16px; }
.kfoot { display: flex; gap: 10px; padding: 14px 16px 0; }
.go { flex: 1 1 0; min-height: 48px; border: 0; border-radius: 12px; background: linear-gradient(var(--blue-a), var(--blue-b)); box-shadow: inset 0 0 0 2px var(--gold); color: #ffe9b0; font: inherit; font-size: 15px; font-weight: 800; text-shadow: 0 1px 2px rgba(30, 15, 0, .85); }
.reason { margin: 4px 0 0; font-size: 14px; line-height: 1.4; text-align: center; }
.fr-also { margin-top: 12px; font-size: 13px; text-align: center; color: var(--dim); }
.fr-also button { margin: 4px 2px 0; padding: 6px 10px; min-height: 36px; border-radius: 9px; border: 1.5px solid var(--brown); background: rgba(255, 248, 232, .45); color: var(--ink); font: inherit; font-weight: 700; }
.fr-also button.or { border-color: var(--gold); background: rgba(240, 198, 74, .3); }
.note { position: fixed; left: 16px; right: 16px; top: calc(140px + env(safe-area-inset-top, 0px)); z-index: 10; padding: 10px 12px; border-radius: 12px; background: rgba(12, 9, 6, .82); border: 1px solid var(--brown); font-size: 13px; line-height: 1.45; color: var(--cream); }
.note b { color: var(--gold-a); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 4000; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--white); font-weight: 700; font-size: 13px; white-space: nowrap; }
button:focus-visible { outline: 3px solid var(--gold-a); outline-offset: 2px; }
</style>

  if (!st.open) { w.innerHTML = ""; return; }
  var h = '<div class="veil" id="veil"><div class="kwin" role="dialog" aria-modal="true"><button type="button" class="kx" id="kx" aria-label="Fermer">✕</button>';
  if (st.open === "fil") {
    h += '<div class="khead"><img src="' + I.story + '" alt=""><div class="kttl">Suite de l\'Histoire</div></div>';
    h += '<div class="kbody"><p class="reason">La prochaine quête d\'Histoire t\'attend au Désert.</p><div class="fr-also">Aussi : <button type="button">Rentrer au village</button>';
    if (st.pl === "fil" && shown(s)) h += '<button type="button" class="or" id="to-or">Investir ' + fmt(s.gold) + ' or</button>';
    h += '</div></div><div class="kfoot"><button type="button" class="go">Voir la quête</button></div>';
  } else {
    var b = s.best;
    h += '<div class="khead"><img src="' + I.gold + '" alt=""><div class="kttl">Ton or peut servir</div><div class="ksub">' + fmt(s.gold) + ' or en poche</div></div><div class="kbody">';
    h += '<div class="best"><img src="' + I[b.ico] + '" alt=""><h3>' + esc(b.ttl) + '</h3><p>' + esc(b.txt) + '</p><div class="cost">';
    b.cost.forEach(function (c) { h += '<span class="chip ' + (c[2] ? "ok" : "ko") + '">' + (c[0] ? '<img src="' + I[c[0]] + '" alt="">' : "") + esc(c[1]) + '</span>'; });
    h += '</div>' + (b.hint ? '<div class="hint">' + esc(b.hint) + '</div>' : "") + '</div>';
    if (s.alt.length) {
      h += '<div class="also">Aussi ouvert</div>';
      s.alt.forEach(function (a) { h += '<button type="button" class="alt"><img src="' + I[a[0]] + '" alt=""><span class="lbl">' + esc(a[1]) + '<small>' + esc(a[2]) + '</small></span><span class="px">' + a[3] + '<img src="' + I.gold + '" alt="or"></span></button>'; });
    }
    h += '</div><div class="kfoot"><button type="button" class="go">' + esc(b.go) + '</button></div>';
  }
  w.innerHTML = h + '</div></div>';
  document.getElementById("kx").onclick = function () { st.open = false; renderWin(); };
  document.getElementById("veil").onclick = function (e) { if (e.target.id === "veil") { st.open = false; renderWin(); } };
  var t = document.getElementById("to-or"); if (t) t.onclick = function () { st.open = "or"; renderWin(); };
  w.querySelectorAll(".go, .alt, .fr-also button:not(.or)").forEach(function (b) { b.addEventListener("click", function () { toast("→ " + (b.textContent.trim().split("\n")[0])); }); });
}
render(true);
</script>

</body>
</html>
