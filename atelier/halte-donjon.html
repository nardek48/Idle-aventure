<title>Halte de donjon</title>
<style>
/* Atelier v3.471.1 : halte de donjon (format A, décisions Seb) — 3 cartes, une à prendre ou passer, aucun soin. Couleurs = jetons du jeu. */
:root {
  --bronze: #b98a4a; --cream: #f3e6c4; --ink: #3a2c1a; --ink-dim: #6b5a40; --brown: #8a5c14; --accent: #c27f1f;
  --gold-a: #f0c64a; --gold-b: #c27f1f; --card: rgba(251, 245, 232, .92); --card-bd: #dcc79c; --head-ink: #f4e9d0;
  --gain: #2f7a3f; --cost: #a2401a; --page: #1c140c; --nav: #2a1f14; --nav-h: 86px; --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
/* Barre de l'atelier (hors jeu) */
.bar { position: sticky; top: 0; z-index: 950; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px; background: #000; color: var(--cream); }
.bar b { font-size: 12px; margin-right: auto; }
.bar button { min-height: 32px; padding: 3px 10px; border-radius: 9px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream); font: inherit; font-size: 12px; font-weight: 700; }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: #2e2214; }

.scene .hud { position: absolute; left: 16px; right: 16px; top: calc(60px + env(safe-area-inset-top, 0px)); padding: 8px 12px; border-radius: 12px; background: rgba(16, 12, 8, .82); color: var(--head-ink); font-weight: 800; text-align: center; }
.scene .hud small { display: block; font-weight: 600; opacity: .8; }
.chips { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.chips span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; background: rgba(240, 198, 74, .18); border: 1px solid rgba(240, 198, 74, .5); font-size: 11.5px; font-weight: 700; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: var(--nav); color: var(--cream); font-size: 12px; font-weight: 700; text-align: center; }
/* Feuille basse (.ksheet du jeu) */
.veil { position: fixed; inset: 0; z-index: 900; background: rgba(12, 8, 5, .62); }
.ksheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 901; max-height: 86vh; display: flex; flex-direction: column; padding-bottom: calc(14px + var(--safe-b)); border-radius: 18px 18px 0 0; background: linear-gradient(#f6ecd9, #efe0c2); box-shadow: 0 -10px 30px rgba(0, 0, 0, .55); }
.khead { position: relative; flex: none; padding: 8px 16px 12px; border-bottom: 2px solid var(--accent); border-radius: 18px 18px 0 0; background: linear-gradient(rgba(16, 12, 8, .86), rgba(16, 12, 8, .94)), #1b1510; color: var(--head-ink); }
.khead::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg); background: linear-gradient(135deg, #ffe08a, #c27f1f 60%, #8a5c14); border: 1px solid #5a3a0c; }
.handle { width: 44px; height: 5px; margin: 0 auto 8px; border-radius: 99px; background: currentColor; opacity: .28; }
.ktitle { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; }
.ktitle .ico { width: 32px; height: 32px; }
.ksub { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 600; opacity: .8; }
.ksub .prev { display: none; }
.kbody { flex: 1 1 auto; overflow-y: auto; padding: 16px 16px 6px; }
.kfoot { flex: none; display: grid; gap: 6px; padding: 8px 16px 0; }
.quote { margin: 0 0 10px; font-style: italic; color: var(--ink-dim); line-height: 1.35; }
.lbl { margin: 12px 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--brown); }
.rule { display: flex; gap: 6px; align-items: center; margin: 0 0 10px; padding: 6px 10px; border-radius: 10px; background: rgba(162, 64, 26, .08); color: var(--cost); font-size: 12.5px; font-weight: 700; }
/* Les trois cartes : une seule */
.opt { cursor: pointer; position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 2px 10px; width: 100%; margin-bottom: 8px; padding: 10px 12px; border: 2px solid var(--card-bd); border-radius: 14px; background: var(--card); color: var(--ink); font: inherit; text-align: left; }
.opt .ico { grid-row: 1 / 4; width: 44px; height: 44px; align-self: center; }
.opt b { font-size: 15px; padding-right: 74px; }
.opt .tag { position: absolute; top: 9px; right: 10px; padding: 1px 7px; border-radius: 99px; font-size: 10.5px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; background: #ead9b4; color: var(--brown); }
.opt .tag.echange { background: rgba(162, 64, 26, .13); color: var(--cost); }
.opt .l { font-size: 13px; line-height: 1.3; }
.opt .l.g { color: var(--gain); font-weight: 700; }
.opt .l.c { color: var(--cost); font-weight: 700; }
.opt .l.n { color: var(--ink-dim); }
.opt[aria-checked="true"] { border-color: var(--accent); background: linear-gradient(#fff6dc, #f7e6b8); box-shadow: 0 0 0 2px rgba(240, 198, 74, .45); }
/* Icône absente : générique, avec son vrai chemin noté (règle du jeu) */
.gen { display: grid; place-items: center; border-radius: 50%; border: 2px dashed var(--bronze); color: var(--bronze); font-weight: 800; font-size: 18px; background: rgba(185, 138, 74, .08); }
.taken { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1.5px solid var(--card-bd); border-radius: 12px; background: var(--card); font-size: 13px; }
.taken .ico { width: 26px; height: 26px; flex: none; font-size: 12px; }
.go { width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: linear-gradient(var(--gold-a), var(--gold-b)); color: #2e2214; font: inherit; font-size: 16px; font-weight: 800; box-shadow: 0 3px 0 #8a5c14; }
.go:disabled { opacity: .45; box-shadow: none; }
.pass { width: 100%; min-height: 44px; border: 1.5px solid var(--card-bd); border-radius: 14px; background: transparent; color: var(--ink-dim); font: inherit; font-size: 14px; font-weight: 700; }
/* Petits écrans (iPhone SE) : sans la phrase d'ambiance, cartes resserrées, pour voir les 3 sans défiler */
@media (max-height: 640px) {
  .quote { display: none; }
  .kbody { padding-top: 12px; }
  .rule { margin-bottom: 6px; padding: 4px 8px; font-size: 12px; }
  .lbl { margin: 8px 0 4px; }
  .opt { margin-bottom: 6px; padding: 7px 10px; grid-template-columns: 36px 1fr; }
  .opt .ico { width: 36px; height: 36px; }
  .opt .l.n { display: none; }
  .taken, .lbl.prev { display: none; }
  .ksub .prev { display: inline; }
  .pass { min-height: 38px; }
}
/* Résultat (simulation) */
.done { position: fixed; inset: 0; z-index: 960; display: none; place-items: center; padding: 16px; background: rgba(12, 8, 5, .75); }
.done.on { display: grid; }
.done .box { max-width: 380px; padding: 16px; border-radius: 16px; background: #f6ecd9; text-align: center; }
.done p { margin: 6px 0 12px; line-height: 1.4; }
.todo { margin-top: 10px; font-size: 11.5px; color: var(--ink-dim); text-align: left; }
.todo code { font-size: 11px; }
</style>
</head>

var QUOTES = [

var state = { halte: 1, draw: [], pick: null, taken: null };

function ico(c, cls) {
  return c.img ? '<img class="' + cls + '" src="' + c.img + '" alt="">'

function finish(card) {
  document.getElementById("d-t").textContent = card ? card.name : "Tu passes";
  var p = card ? card.lines.map(function (l) { return l[1]; }).join(" · ") : "Rien de pris. Le run continue tel quel.";
  var todo = CARDS.filter(function (c) { return !c.img; }).map(function (c) { return "<code>" + c.todo + "</code> (" + c.name + ")"; });
  document.getElementById("d-p").innerHTML = p + '<div class="todo">Images à faire (icône générique en attendant) :<br>' + todo.join("<br>") + '</div>';
  document.getElementById("done").classList.add("on");
  if (card && state.halte === 1) state.taken = card;
}
document.getElementById("go").onclick = function () { finish(state.draw.filter(function (c) { return c.id === state.pick; })[0]); };
document.getElementById("pass").onclick = function () { finish(null); };
document.getElementById("d-ok").onclick = function () { document.getElementById("done").classList.remove("on"); drawCards(); render(); };
document.getElementById("b-draw").onclick = function () { drawCards(); render(); };
function setHalte(n) {
  state.halte = n;
  if (n === 1) state.taken = null;
  else if (!state.taken) state.taken = CARDS[0];
  document.getElementById("b-h1").setAttribute("aria-pressed", n === 1);
  document.getElementById("b-h2").setAttribute("aria-pressed", n === 2);
  drawCards(); render();
}
document.getElementById("b-h1").onclick = function () { setHalte(1); };
document.getElementById("b-h2").onclick = function () { setHalte(2); };
setHalte(1);
</script>
</body>
</html>
