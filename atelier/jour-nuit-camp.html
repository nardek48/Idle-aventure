<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le jour et la nuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Atelier « Camp qui évolue, C3 : le jour et la nuit » (Seb, 04/11). Vrais bandeaux des 6 camps (v3.654.0).
   Le moment suit les sorties du jour : 0 = matin, 1 = jour, 2 = soir, puis la nuit (WorldDays.isDark). Aucune image neuve. */
:root {
  --page: #1c140c; --bronze: #b98a4a; --cream-text: #f3e6c4; --gold-a: #f0c64a; --gold-b: #c27f1f;
  --card: #f6ecd9; --ink: #3a2c1a; --ink-dim: #6b5d45; --frame: #c27f1f;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--cream-text); font: 15px/1.35 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--page); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; gap: 6px; padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--page); border-bottom: 1px solid #3a2a18; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > b { font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--bronze); min-width: 58px; }
.bar button { min-height: 34px; padding: 4px 10px; border-radius: 10px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream-text); font: 600 13px var(--f-ui); }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: var(--ink); border-color: var(--gold-a); }
.note { font-size: 12px; color: #c9b48a; margin: 0; }
main { max-width: 430px; margin: 0 auto; padding: 12px 0 80px; }
.moment { margin-bottom: 18px; }
.mk { margin: 0 13px 6px; font: 800 12px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--bronze); }

/* Bandeau du camp : copie de .kfb (css/00-kbtn.css), 150 px sur téléphone */
.kfb { position: relative; height: 150px; margin: 0 13px 8px; overflow: hidden; border-radius: 6px; background: #120d08;
  box-shadow: 0 0 0 1px rgba(194, 127, 31, 0.75), 0 4px 12px rgba(0, 0, 0, 0.45); }
.kfb-img { position: absolute; inset: 0; background: center 58% / cover no-repeat; transition: filter .6s; }
.kfb-tint { position: absolute; inset: 0; pointer-events: none; transition: background .6s, opacity .6s; }
.kfb::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(10, 7, 4, 0) 38%, rgba(10, 7, 4, 0.55) 72%, rgba(10, 7, 4, 0.88)); }
.kfb-tx { position: absolute; left: 14px; right: 14px; bottom: 10px; z-index: 2; display: grid; gap: 1px; }
.kfb-t { font: 700 19px/1.15 Georgia, "Times New Roman", serif; letter-spacing: .03em; color: #e0b46a; text-shadow: 0 2px 6px rgba(0, 0, 0, .9); }
.kfb-s { font: italic 400 14px/1.25 Georgia, serif; color: #f6ecd9; text-shadow: 0 1px 4px rgba(0, 0, 0, .9); max-width: 62%; }
.kfb-day { position: absolute; right: 10px; bottom: 9px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  background: rgba(18, 14, 9, .72); border: 1px solid rgba(226, 177, 74, .4); }
.kfb-day b { font: 700 12px/1.2 var(--f-ui); color: #f6ecd9; white-space: nowrap; }
.kfb-moons { display: inline-flex; gap: 3px; }
.kfb-moons i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgb(205, 214, 240); }
.kfb-moons i.is-on { background: rgb(205, 214, 240); }
.glow { position: absolute; left: 50%; bottom: 18%; width: 46%; height: 60%; transform: translateX(-50%); border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, rgba(255, 170, 70, .55), rgba(255, 140, 40, 0)); mix-blend-mode: screen; transition: opacity .6s; }

/* Carte « Ce soir au camp » : copie de .camp-soir (css/04-panel-camp.css) */
.card { margin: 0 13px; padding: 10px 14px; border: 2px solid var(--frame); border-radius: 14px; background: var(--card); color: var(--ink); display: grid; gap: 6px; }
.card.is-night { box-shadow: inset 4px 0 0 rgba(42, 53, 80, .55); }
.k { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #8a6a3a; }
.t { margin: 0; font: italic 400 15px/1.45 Georgia, serif; color: #3a2c1a; }

/* Teintes : A douce, B marquée */
.A .matin .kfb-img { filter: saturate(.88) hue-rotate(-8deg) brightness(1.04); }
.A .matin .kfb-tint { background: linear-gradient(180deg, rgba(190, 215, 255, .22), rgba(255, 220, 200, .08)); mix-blend-mode: soft-light; }
.A .jour .kfb-img { filter: brightness(1.08) saturate(.96); }
.A .jour .kfb-tint { background: rgba(255, 250, 235, .10); mix-blend-mode: soft-light; }
.A .nuit .kfb-img { filter: brightness(.62) saturate(.7); }
.A .nuit .kfb-tint { background: linear-gradient(180deg, rgba(20, 30, 70, .45), rgba(10, 14, 28, .35)); }
.A .nuit .glow { opacity: .55; }
.B .matin .kfb-img { filter: saturate(.62) hue-rotate(-22deg) brightness(1.1) contrast(.92); }
.B .matin .kfb-tint { background: linear-gradient(180deg, rgba(150, 195, 255, .5), rgba(255, 205, 190, .18)); mix-blend-mode: soft-light; }
.B .jour .kfb-img { filter: brightness(1.2) saturate(.8) hue-rotate(-6deg) contrast(1.04); }
.B .jour .kfb-tint { background: rgba(245, 250, 255, .28); mix-blend-mode: soft-light; }
.B .soir .kfb-img { filter: saturate(1.12) brightness(.97); }
.B .soir .kfb-tint { background: linear-gradient(180deg, rgba(255, 140, 60, .18), rgba(120, 40, 20, .12)); mix-blend-mode: soft-light; }
.B .nuit .kfb-img { filter: brightness(.45) saturate(.55) hue-rotate(8deg); }
.B .nuit .kfb-tint { background: linear-gradient(180deg, rgba(15, 25, 70, .55), rgba(5, 10, 25, .4)); }
.B .nuit .glow { opacity: .8; }
</style>
</head>
<body>
<div class="bar">
  <div class="row"><b>Teinte</b><button data-v="A">A · Douce</button><button data-v="B">B · Marquée</button></div>
  <div class="row"><b>Camp</b><button data-w="forest">Forêt</button><button data-w="desert">Désert</button><button data-w="ruins">Ruines</button><button data-w="crypt">Crypte</button><button data-w="mountain">Montagne</button><button data-w="tower">Tour</button></div>
  <p class="note" id="note"></p>
</div>
<main id="app"></main>
