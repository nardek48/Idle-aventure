<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le festin du camp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Atelier « Le festin » (Seb, 04/11) : blé, viande et eau du village contre +10 % de dégâts et de PV pour le groupe,
   3 sorties. Prix par monde (25 % / 25 % / 10 % de l'Entrepôt max). Deux placements à comparer, quatre états. */
:root {
  --page: #1c140c; --bronze: #b98a4a; --cream-text: #f3e6c4; --gold-a: #f0c64a; --gold-b: #c27f1f;
  --card: #f6ecd9; --card-alt: #efe0c2; --ink: #3a2c1a; --ink-dim: #635640; --frame: #c27f1f; --frame-light: #dcc79c;
  --green: #1a642f; --red: #a3322a; --feast: #b5621e;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--cream-text); font: 15px/1.35 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--page); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; gap: 6px; padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--page); border-bottom: 1px solid #3a2a18; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > b { font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--bronze); min-width: 58px; }
.bar button { min-height: 34px; padding: 4px 10px; border-radius: 10px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream-text); font: 600 13px var(--f-ui); }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: var(--ink); border-color: var(--gold-a); }
.note { font-size: 12px; color: #c9b48a; margin: 0; }
main { max-width: 430px; margin: 0 auto; padding: 12px 0 80px; }

/* Bandeau du Camp (simplifié) et sa pastille */
.kfb { position: relative; height: 150px; margin: 0 13px 10px; overflow: hidden; border-radius: 6px; background: #3a2a18 center 58% / cover no-repeat;
  box-shadow: 0 0 0 1px rgba(194, 127, 31, .75), 0 4px 12px rgba(0, 0, 0, .45); }
.kfb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,7,4,0) 38%, rgba(10,7,4,.55) 72%, rgba(10,7,4,.88)); }
.kfb-tx { position: absolute; left: 14px; bottom: 10px; z-index: 2; display: grid; }
.kfb-t { font: 700 19px/1.15 Georgia, serif; color: #e0b46a; text-shadow: 0 2px 6px rgba(0,0,0,.9); }
.kfb-s { font: italic 14px/1.25 Georgia, serif; color: #f6ecd9; }
.kfb-day { position: absolute; right: 10px; bottom: 9px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  background: rgba(18, 14, 9, .72); border: 1px solid rgba(226, 177, 74, .4); font: 700 12px var(--f-ui); color: #f6ecd9; }
.kfb-feast { position: absolute; right: 10px; top: 9px; z-index: 2; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 4px; border-radius: 999px;
  background: rgba(18, 14, 9, .78); border: 1px solid rgba(240, 160, 80, .7); font: 700 12px var(--f-ui); color: #ffd9a8; }
.kfb-feast img { width: 20px; height: 20px; }

/* Cartes du camp */
.card { margin: 0 13px 10px; padding: 10px 14px; border: 2px solid var(--frame); border-radius: 14px; background: var(--card); color: var(--ink); display: grid; gap: 8px; }
.k { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #8a6a3a; }
.t { margin: 0; font: italic 15px/1.45 Georgia, serif; }
.head { display: flex; align-items: center; gap: 10px; }
.head img { width: 40px; height: 40px; flex: 0 0 auto; }
.head b { display: block; font-size: 16px; }
.head span { display: block; font-size: 13px; color: var(--ink-dim); }
.costs { display: flex; flex-wrap: wrap; gap: 6px; }
.cost { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 4px; border-radius: 999px; background: var(--card-alt); border: 1px solid var(--frame-light); font: 700 13px var(--f-ui); }
.cost img { width: 22px; height: 22px; }
.cost.is-short { color: var(--red); border-color: #d9a39d; background: #f6dfdb; }
.cost small { font-weight: 600; color: var(--ink-dim); }
.go { min-height: 46px; border-radius: 12px; border: 2px solid #8a4a14; background: linear-gradient(#e08a3c, #b5621e); color: #fff8ee; font: 800 15px var(--f-ui); }
.go:disabled { opacity: .5; }
.hint { margin: 0; font-size: 13px; color: var(--ink-dim); }
.on { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: #fbe6cf; border: 1.5px solid #e2a56a; }
.on img { width: 34px; height: 34px; }
.on b { display: block; color: var(--feast); }
.pips { display: inline-flex; gap: 4px; margin-left: auto; }
.pips i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--feast); }
.pips i.is-on { background: var(--feast); }
/* Variante B : dans la carte du soir, une ligne repliée */
.feastline { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--frame-light); }
.feastline img { width: 26px; height: 26px; }
.feastline span { flex: 1; font-size: 13px; color: var(--ink-dim); }
.mini { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 2px solid #8a4a14; background: linear-gradient(#e08a3c, #b5621e); color: #fff8ee; font: 800 13px var(--f-ui); }
</style>
</head>
<body>
<div class="bar">
  <div class="row"><b>Placement</b><button data-v="A">A · Sa carte au feu</button><button data-v="B">B · Dans la carte du soir</button></div>
  <div class="row"><b>État</b><button data-s="pret">Prêt</button><button data-s="court">Il manque</button><button data-s="cours">En cours</button><button data-s="fin">Dernière sortie</button></div>
  <div class="row"><b>Monde</b><button data-w="0">Forêt</button><button data-w="3">Crypte</button><button data-w="5">Tour</button></div>
  <p class="note" id="note"></p>
</div>
<main id="app"></main>

  { id: "forest", nom: "Campement d'Aeswyn", sous: "Un refuge au cœur de la forêt", prix: { ble: 300, viande: 300, eau: 125 }, stock: { ble: 412, viande: 380, eau: 60 } },

];
var NOMS = { ble: "Blé", viande: "Viande", eau: "Eau" };
var NOTES = {
  A: "A : une carte « Le festin » au feu, sous la phrase du jour. Le prix et ce qu'on a en stock sont visibles d'un coup d'œil ; en cours, la carte montre les sorties restantes.",
  B: "B : une ligne repliée au bas de la carte du jour (« Ce matin au camp »). Plus discret : la page s'allonge moins, le prix reste juste sous la ligne."
};
var st = { v: "A", s: "pret", w: 0 };
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function costsHTML(m) {
  return '<div class="costs">' + ["ble", "viande", "eau"].map(function (k) {
    var have = st.s === "court" && k === "eau" ? Math.floor(m.prix.eau * .4) : m.stock[k], short = have < m.prix[k];
    return '<span class="cost' + (short ? ' is-short' : '') + '"><img src="' + ICO[k] + '" alt="">' + fmt(m.prix[k]) + ' ' + NOMS[k] + ' <small>(' + fmt(have) + ')</small></span>';
  }).join("") + '</div>';
}
function left() { return st.s === "cours" ? 2 : st.s === "fin" ? 1 : 3; }
function pips(n) { var h = '<span class="pips">'; for (var i = 0; i < 3; i++) h += '<i class="' + (i < n ? "is-on" : "") + '"></i>'; return h + '</span>'; }
function onHTML() {
  var n = left();
  return '<div class="on"><img src="' + ICO.feu + '" alt=""><span><b>Festin en cours</b>+10 % de dégâts et de PV pour tout le groupe, encore ' + n + ' sortie' + (n > 1 ? "s" : "") + '.</span>' + pips(n) + '</div>';
}
function render() {
  document.querySelectorAll("[data-v]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.v === st.v); });
  document.querySelectorAll("[data-s]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.s === st.s); });
  document.querySelectorAll("[data-w]").forEach(function (b) { b.setAttribute("aria-pressed", +b.dataset.w === st.w); });
  document.getElementById("note").textContent = NOTES[st.v];
  var m = MONDES[st.w], encours = st.s === "cours" || st.s === "fin", court = st.s === "court";
  var h = '<div class="kfb" style="background-image:url(' + BAN[m.id] + ')"><div class="kfb-tx"><span class="kfb-t">' + m.nom + '</span><span class="kfb-s">' + m.sous + '</span></div>'
    + (encours ? '<div class="kfb-feast"><img src="' + ICO.feu + '" alt="">Festin · ' + left() + '</div>' : '')
    + '<div class="kfb-day">☀ Jour 4</div></div>';
  var soir = '<div class="k">Ce matin au camp</div><p class="t">La brume traîne entre les troncs. Le feu de la veille fume encore.</p>';
  if (st.v === "A") {
    h += '<div class="card">' + soir + '</div>';
    h += '<div class="card"><div class="k">Le festin</div>';
    if (encours) h += onHTML() + '<p class="hint">Le prochain se prépare quand celui-ci est fini.</p>';
    else h += '<div class="head"><img src="' + ICO.feu + '" alt=""><span><b>Préparer un festin</b><span>+10 % de dégâts et de PV pour tout le groupe, pendant 3 sorties.</span></span></div>'
      + costsHTML(m) + '<button class="go" type="button"' + (court ? ' disabled' : '') + '>' + (court ? "Il manque de l'eau" : "Préparer le festin") + '</button>';
    h += '</div>';
  } else {
    h += '<div class="card">' + soir;
    if (encours) h += onHTML();
    else h += '<div class="feastline"><img src="' + ICO.feu + '" alt=""><span>Festin : +10 % de dégâts et de PV, 3 sorties</span><button class="mini" type="button"' + (court ? ' disabled' : '') + '>' + (court ? "Il manque" : "Préparer") + '</button></div>'
      + costsHTML(m);
    h += '</div>';
  }
  h += '<div class="card"><div class="k">Au coin du feu</div><p class="hint">(les compagnons, inchangé)</p></div>';
  document.getElementById("app").innerHTML = h;
}
document.addEventListener("click", function (e) {
  var t = e.target.closest("button"); if (!t) return;
  if (t.dataset.v) st.v = t.dataset.v; else if (t.dataset.s) st.s = t.dataset.s; else if (t.dataset.w) st.w = +t.dataset.w;
  else if (t.classList.contains("go") || t.classList.contains("mini")) st.s = "cours";
  else return;
  render();
});
