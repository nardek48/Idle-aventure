/* Bandeau : sous la barre du haut, 44 px */
.ini { position: absolute; left: 0; top: 44px; width: 390px; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px;
  background: linear-gradient(180deg, rgba(14, 9, 4, .92), rgba(14, 9, 4, .72)); border-bottom: 1px solid rgba(232, 176, 74, .45); }
.ini-round { flex: none; display: flex; flex-direction: column; align-items: center; width: 40px; font-size: 12px; line-height: 1.1; color: var(--dim); }
.ini-round b { font-size: 15px; color: var(--gold); }
.ini-row { position: relative; flex: 1 1 auto; height: 40px; }
.ini-p { position: absolute; top: 3px; width: 34px; height: 34px; transition: left .35s cubic-bezier(.3, .8, .3, 1), transform .2s, opacity .25s, filter .25s; }
.ini-p img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--gold); background: #2a2116; }
.ini-p.is-foe img { border-color: var(--red); }
.ini-p.is-now { transform: scale(1.18); z-index: 2; }
.ini-p.is-now img { box-shadow: 0 0 0 2px rgba(255, 236, 170, .95), 0 0 12px 3px rgba(240, 190, 80, .8); }
.ini-p.is-foe.is-now img { box-shadow: 0 0 0 2px rgba(255, 200, 190, .95), 0 0 12px 3px rgba(230, 80, 60, .8); }
.ini-p.is-done { opacity: .45; filter: grayscale(.8); }
.ini-p.is-dead { opacity: 0; }
.ini-d { position: absolute; right: -6px; bottom: -4px; min-width: 20px; height: 18px; padding: 0 4px; border-radius: 9px; background: #1b130a; border: 1px solid var(--gold);
  color: #fff3d6; font-size: 12px; font-weight: 800; line-height: 16px; text-align: center; font-variant-numeric: tabular-nums; }
.ini-p.is-foe .ini-d { border-color: var(--red); }
.ini-d.is-rolling { color: var(--gold); }
.ini-d.is-adv { right: -14px; }

/* Qui joue, sur la scène et sur les cartes */
.glow-foe { position: absolute; width: 190px; height: 70px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .2s;
  background: radial-gradient(ellipse at 50% 50%, rgba(230, 80, 60, .55), transparent 70%); }
.glow-foe.on { opacity: 1; }
.glow-card { position: absolute; border-radius: 14px; pointer-events: none; opacity: 0; transition: opacity .2s; box-shadow: 0 0 0 2px #ffe7a6, 0 0 14px 4px rgba(240, 190, 80, .75); }
.glow-card.on { opacity: 1; }
.hit { position: absolute; font-size: 22px; font-weight: 900; color: #ff6b57; text-shadow: 0 2px 0 #000; pointer-events: none; animation: hit .7s ease-out forwards; }
@keyframes hit { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-26px); } }
.tap { position: absolute; left: 73px; top: 783px; width: 245px; height: 52px; border-radius: 14px; cursor: pointer; }
.tap.wait { box-shadow: 0 0 0 3px rgba(255, 231, 166, .9); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(255, 231, 166, .25); } }

.ctl { width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; gap: 6px; }
.seg button, .act { flex: 1 1 0; min-height: 40px; border: 1px solid #5a4630; border-radius: 10px; background: #2a2116; color: var(--fg); font: inherit; font-size: 13px; font-weight: 700; }
.seg button[aria-pressed=true] { border-color: var(--gold); color: var(--gold); }
.log { min-height: 64px; padding: 8px 10px; border-radius: 10px; background: #1d160e; font-size: 12.5px; line-height: 1.45; color: var(--dim); }
.log b { color: var(--fg); }
.note { font-size: 12.5px; line-height: 1.45; color: var(--dim); }
</style>
</head>

/* Bonus d'initiative : 10 × c / (c + 60), arrondi. Héros et compagnons : célérité ÷ multiplicateur du monde (Forêt ×1). */
function bonus(c) { return Math.round(10 * c / (c + 60)); }
var HEROES = { knight: { name: "Aube", img: "knight", cel: 20, adv: false }, ranger: { name: "Aube", img: "ranger", cel: 40, adv: true } };
var heroKind = "knight", actors = [], order = [], round = 1, step = -1, timer = null, waiting = false;

function d20() { return 1 + Math.floor(Math.random() * 20); }
function build() {
  var h = HEROES[heroKind];
  actors = [
    { id: "hero", name: h.name, img: h.img, cel: h.cel, adv: h.adv, foe: false, glow: "gc0" },
    { id: "wenna", name: "Wenna", img: "wenna", cel: 44, foe: false, glow: "gc1" },
    { id: "maddoc", name: "Maddoc", img: "maddoc", cel: 30, foe: false, glow: "gc2" },
    { id: "w1", name: "Loup sauvage", img: "wolf", cel: 52, foe: true, glow: "gf0" },
    { id: "w2", name: "Loup sauvage", img: "wolf", cel: 52, foe: true, glow: "gf1" }
  ];
  document.getElementById("row").innerHTML = actors.map(function (a, i) {
    return '<div class="ini-p' + (a.foe ? ' is-foe' : '') + '" id="p-' + a.id + '" style="left:' + (i * 44 + 2) + 'px"><img src="' + IMG[a.img] + '" alt=""><span class="ini-d is-rolling' + (a.adv ? ' is-adv' : '') + '" id="d-' + a.id + '">?</span></div>';
  }).join("");
}
function place() { order.forEach(function (a, i) { document.getElementById("p-" + a.id).style.left = (i * 44 + 2) + "px"; }); }
function setNow(a) {
  actors.forEach(function (x) { document.getElementById("p-" + x.id).classList.toggle("is-now", x === a); document.getElementById(x.glow).classList.toggle("on", x === a); });
}
function newFight() {
  clearTimeout(timer); waiting = false; document.getElementById("tap").classList.remove("wait");
  round = 1; step = -1; document.getElementById("rnd").textContent = "1";
  build(); setNow(null);
  // le dé défile 600 ms, puis le total s'affiche et les portraits se rangent
  var t0 = Date.now();
  (function spin() {
    actors.forEach(function (a) { document.getElementById("d-" + a.id).textContent = a.adv ? d20() + "·" + d20() : d20(); });
    if (Date.now() - t0 < 600) { timer = setTimeout(spin, 60); return; }
    var lines = [];
    actors.forEach(function (a) {
      var r1 = d20(), r2 = a.adv ? d20() : 0, r = Math.max(r1, r2), b = bonus(a.cel);
      a.total = r + b; a.tie = a.foe ? 0 : 1;
      var d = document.getElementById("d-" + a.id); d.classList.remove("is-rolling", "is-adv"); d.textContent = a.total;
      lines.push("<b>" + a.name + "</b> " + (a.adv ? "2d20 (" + r1 + ", " + r2 + ") → " + r : "d20 " + r) + " + " + b + " = <b>" + a.total + "</b>");
    });
    order = actors.slice().sort(function (x, y) { return (y.total - x.total) || (y.tie - x.tie); });
    timer = setTimeout(function () { place(); log("🎲 Initiative<br>" + lines.join("<br>")); timer = setTimeout(next, 700); }, 350);
  })();
}
function log(h) { document.getElementById("log").innerHTML = h; }
function next() {
  step++;
  if (step >= order.length) {   // fin du round : tout le monde reprend des couleurs
    round++; step = -1; document.getElementById("rnd").textContent = round;
    actors.forEach(function (a) { document.getElementById("p-" + a.id).classList.remove("is-done"); });
    setNow(null); timer = setTimeout(next, 450); return;
  }
  var a = order[step]; setNow(a);
  if (a.id === "hero") { waiting = true; document.getElementById("tap").classList.add("wait"); log("Round " + round + " — <b>À toi</b> : le combat attend ton choix."); return; }
  log("Round " + round + " — <b>" + a.name + "</b> " + (a.foe ? "mord" : "agit") + ".");
  if (a.foe) hitFx(); 
  timer = setTimeout(function () { document.getElementById("p-" + a.id).classList.add("is-done"); next(); }, 750);
}
function hitFx() {
  var el = document.createElement("div"); el.className = "hit"; el.textContent = "-" + (6 + Math.floor(Math.random() * 6));
  el.style.left = "60px"; el.style.top = "600px"; document.getElementById("phone").appendChild(el); setTimeout(function () { el.remove(); }, 800);
}
function heroGo() {
  if (!waiting) return;
  waiting = false; document.getElementById("tap").classList.remove("wait");
  document.getElementById("p-hero").classList.add("is-done"); log("Round " + round + " — <b>Aube</b> attaque.");
  timer = setTimeout(next, 600);
}
function setHero(k, btn) {
  heroKind = k;
  Array.prototype.forEach.call(document.querySelectorAll("#seg-hero button"), function (b) { b.setAttribute("aria-pressed", b === btn); });
  newFight();
}
function fit() {
  var w = document.getElementById("box").clientWidth, s = Math.min(1, w / 390);
  var p = document.getElementById("phone"); p.style.transform = "scale(" + s + ")"; document.getElementById("box").style.height = (844 * s) + "px";
}
window.addEventListener("resize", fit); fit(); newFight();
</script>
