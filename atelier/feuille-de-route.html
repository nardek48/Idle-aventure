<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Mise en page : une colonne ; chaque section est une liste de lignes à cocher et à réordonner (▲ ▼). */
:root {
  --fond: #ece6dc; --carte: #f8f4ec; --encre: #2a2118; --sourd: #6e604d; --trait: #d3c6b1; --bronze: #8f5f17;

}

:root[data-theme="dark"] {
  --fond: #15110c; --carte: #211a12; --encre: #f1e6cf; --sourd: #b9a988; --trait: #42352a; --bronze: #e0a347;

* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.5 var(--f-texte); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: grid; gap: 14px; }
h1 { font: 600 26px/1.2 var(--f-titre); letter-spacing: .03em; margin: 0; color: var(--bronze); text-wrap: balance; }
h2 { font: 600 17px var(--f-titre); letter-spacing: .04em; color: var(--bronze); margin: 12px 0 0; text-wrap: balance; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
h2 small { font: 500 14px var(--f-texte); letter-spacing: 0; color: var(--sourd); font-variant-numeric: tabular-nums; }
p, ul { margin: 0; }
ul { padding-left: 20px; display: grid; gap: 3px; }
a { color: var(--bronze); font-weight: 700; }
code { font: 13px var(--f-code); overflow-wrap: anywhere; }
.intro { color: var(--sourd); max-width: 65ch; }
.etat { font-size: 14px; color: var(--sourd); min-height: 1.4em; }
.outils { display: flex; flex-wrap: wrap; gap: 6px; }
.outils button { font: 500 14px var(--f-texte); color: var(--encre); background: var(--carte); border: 1px solid var(--trait); border-radius: 999px; min-height: 40px; padding: 0 14px; cursor: pointer; }
.outils button[aria-pressed="true"] { border-color: var(--bronze); color: var(--bronze); font-weight: 700; }
.section { display: grid; gap: 8px; }
.item { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 10px 10px 10px 12px; display: grid; grid-template-columns: 44px 1fr 40px; gap: 10px; align-items: start; }
.item.is-fait { background: var(--fait-fond); }
.item.is-fait .titre { text-decoration: line-through; text-decoration-color: var(--fait); }
.item.is-fait .detail { display: none; }
.coche { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--bronze); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--fait); font-size: 24px; font-weight: 700; }
.item.is-fait .coche { border-color: var(--fait); background: var(--carte); }
.corps { min-width: 0; display: grid; gap: 5px; }
.tete { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
.rang { font: 600 16px var(--f-titre); color: var(--bronze); font-variant-numeric: tabular-nums; }
.titre { font-weight: 700; font-size: 17px; }

.s-cours { color: var(--s-cours); } .s-cadrer { color: var(--s-cadrer); } .s-tester { color: var(--s-tester); }
.s-signal { color: var(--s-signal); } .s-report { color: var(--s-report); } .s-clos { color: var(--fait); }
.detail { display: grid; gap: 5px; font-size: 15px; }
.detail .sourd { color: var(--sourd); }
.date { font-size: 13px; color: var(--fait); }

.fleches button:disabled { opacity: .35; cursor: default; }
button:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
@media (max-width: 400px) { .item { grid-template-columns: 44px 1fr; } .fleches { grid-column: 2; grid-auto-flow: column; justify-content: start; } }
</style>
<div class="wrap">
  <h1>Feuille de route</h1>
  <p class="intro">Aethervale, tenue depuis le 30/10/2026 (v3.567.0). C'est le fichier de suivi de cette conversation. Coche une ligne quand elle est faite, et change l'ordre avec ▲ ▼ : je lis tes coches et ton ordre avant chaque étape.</p>
  <p class="etat" id="etat">Chargement de ton suivi…</p>
  <div class="outils" role="group" aria-label="Affichage">
    <button type="button" id="b-tout" aria-pressed="true">Tout</button>
    <button type="button" id="b-afaire" aria-pressed="false">Masquer ce qui est fait</button>
  </div>
  <div id="contenu"></div>
</div>

  {"id": "ch-village", "statut": "cadrer", "titre": "Évolution du village",

  {"id": "ch-tour", "statut": "cadrer", "titre": "Chapitre VI, la Tour",
   "html": "<p>Aujourd'hui, l'Histoire s'arrête sur « Fin du chapitre 5 ». Le premier livrable serait le document de conception (<code>mondes/tour/Aethervale_Conception_Tour_v0_1.md</code>), sans code.</p><p class=\"sourd\">Déjà décidé :</p><ul class=\"sourd\"><li>le gabarit des actes, QUE-15 option A : ordre varié, contraintes, 2 quêtes autonomes ;</li><li>le donjon 6, qui donne le Légendaire ;</li><li>les images du bestiaire et le fond paysage.</li></ul><p class=\"sourd\">À trancher :</p><ul class=\"sourd\"><li>le récit §VI et le nom Azhem ;</li><li>le combat de la silhouette, qui touchera peut-être le moteur de combat (fichier protégé) ;</li><li>la Question et ses 4 fins ;</li><li>la Mémoire et le Grimoire ;</li><li>ce qui suit la fin.</li></ul>"},
  {"id": "ch-intro", "statut": "cours", "titre": "Introduction du jeu (l'accroche)",
   "html": "<p>Aujourd'hui, on va de l'écran titre à la création (nom, classe), puis directement au Camp et au tutoriel « Le Campement ». Le seul récit d'ouverture est la phrase de <code>forest_01</code> et le Prologue du Codex, qu'on ne lit pas par défaut.</p><p>Idée : un prologue illustré, fait de planches plein écran avec le texte court du narrateur. On le passe quand on veut, et on peut le revoir.</p><p><b>Option B validée</b> (30/10) : 4 planches avant la création (« Cette nuit-là »), 2 après (« Douze hivers »), puis le Camp. L'option C, la mise en scène animée, viendra peut-être ensuite.</p><p><b>Textes validés</b> (30/10, version fusionnée, phrase 6 de Seb) : <code>systemes/introduction/Aethervale_Prologue_v0_2.md</code>.</p><p><b>Images livrées</b> (30/10) : les 12, converties dans <code>game/images/Prologue/</code> (2,4 Mo).</p><p class=\"sourd\">Étape en cours : <a href=\"https://claude.ai/artifact/NdcvRd8d9r1D8vyM74xFtu\" target=\"_blank\" rel=\"noopener\">l'atelier du prologue</a>, à tester sur iPhone et sur PC. Il reste à choisir le fond sous le texte (A, B ou C) et l'apparition du texte (ligne à ligne ou d'un bloc). Ensuite viendra le code. Le tutoriel n'est pas touché, aucun fichier protégé.</p>"}

<script>
(function () {
  var SECTIONS = JSON.parse(document.getElementById("donnees").textContent);
  var STATUT = { cours: "En cours", cadrer: "À cadrer", tester: "À tester", signal: "Signalé", report: "Reporté", clos: "Clos" };
  // État du suivi : ordre par section (liste d'ids) et lignes faites (id -> date)
  var etat = { ordre: {}, fait: {} }, version = 0, db = null, ref = null, masquer = false;
  var $ = function (id) { return document.getElementById(id); };

  SECTIONS.forEach(function (s) { s.items.forEach(function (it) { if (it.faitDefaut) etat.fait[it.id] = it.faitDefaut; }); });

  // Ordre d'une section : celui du suivi, puis les lignes nouvelles à la fin
  function ordonner(s) {
    var o = (etat.ordre[s.id] || []).filter(function (id) { return s.items.some(function (it) { return it.id === id; }); });
    s.items.forEach(function (it) { if (o.indexOf(it.id) < 0) o.push(it.id); });
    return o.map(function (id) { return s.items.filter(function (it) { return it.id === id; })[0]; });
  }

  function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function dateFr(iso) { var p = String(iso).slice(0, 10).split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : ""; }

  function rendre() {
    var h = "";
    SECTIONS.forEach(function (s) {
      var items = ordonner(s), n = items.filter(function (it) { return etat.fait[it.id]; }).length;
      h += '<h2>' + esc(s.titre) + '<small>' + n + ' / ' + items.length + ' faits</small></h2><div class="section">';
      items.forEach(function (it, i) {
        var on = !!etat.fait[it.id];
        if (masquer && on) return;
        h += '<div class="item' + (on ? ' is-fait' : '') + '">'
          + '<button type="button" class="coche" data-id="' + it.id + '" aria-pressed="' + on + '" aria-label="' + (on ? "Décocher " : "Cocher ") + esc(it.titre) + '">' + (on ? "✓" : "") + '</button>'
          + '<div class="corps"><div class="tete">' + (s.numeros ? '<span class="rang">' + (i + 1) + '.</span>' : '')
          + '<span class="titre">' + esc(it.titre) + '</span><span class="pastille s-' + it.statut + '">' + STATUT[it.statut] + '</span></div>'
          + (on ? '<span class="date">Fait le ' + dateFr(etat.fait[it.id]) + '</span>' : '')
          + (it.html ? '<div class="detail">' + it.html + '</div>' : '') + '</div>'
          + '<div class="fleches"><button type="button" data-s="' + s.id + '" data-i="' + i + '" data-d="-1" aria-label="Monter ' + esc(it.titre) + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>'
          + '<button type="button" data-s="' + s.id + '" data-i="' + i + '" data-d="1" aria-label="Descendre ' + esc(it.titre) + '"' + (i === items.length - 1 ? ' disabled' : '') + '>▼</button></div>'
          + '</div>';
      });
      h += '</div>';
    });
    $("contenu").innerHTML = h;
    $("contenu").querySelectorAll(".coche").forEach(function (b) { b.onclick = function () { basculer(b.dataset.id); }; });
    $("contenu").querySelectorAll(".fleches button").forEach(function (b) { b.onclick = function () { deplacer(b.dataset.s, +b.dataset.i, +b.dataset.d); }; });
  }

  function basculer(id) {
    if (etat.fait[id]) delete etat.fait[id]; else etat.fait[id] = new Date().toISOString().slice(0, 10);
    rendre(); enregistrer();
  }

  function deplacer(sid, i, d) {
    var s = SECTIONS.filter(function (x) { return x.id === sid; })[0], o = ordonner(s).map(function (it) { return it.id; });
    var j = i + d; if (j < 0 || j >= o.length) return;
    var t = o[i]; o[i] = o[j]; o[j] = t; etat.ordre[sid] = o;
    rendre(); enregistrer();
  }

  // Un seul document « suivi/etat » : base de la page, sinon cet appareil
  function enregistrer() {
    var doc = { ordre: etat.ordre, fait: etat.fait, le: new Date().toISOString() };
    if (ref) {
      ref.set(doc).catch(function (e) {
        $("etat").textContent = e && e.code === "invalid_argument" ? "Tu peux consulter cette page, mais pas la modifier." : "Le changement n'a pas été enregistré. Réessaie dans un instant.";
      });
    } else {
      try { localStorage.setItem("feuille-de-route", JSON.stringify(doc)); } catch (e) {}
    }
  }

  // Copie profonde : les données de la base sont figées, on ne peut pas les modifier sur place
  function charger(v) { if (v && typeof v === "object") { v = JSON.parse(JSON.stringify(v)); etat.ordre = v.ordre || {}; etat.fait = v.fait || {}; } }

  function modeLocal() {
    ref = null;
    try { charger(JSON.parse(localStorage.getItem("feuille-de-route") || "null")); } catch (e) {}
    $("etat").textContent = "Suivi enregistré sur cet appareil seulement : je ne pourrai pas le lire.";
    rendre();
  }

  $("b-tout").onclick = function () { masquer = false; this.setAttribute("aria-pressed", "true"); $("b-afaire").setAttribute("aria-pressed", "false"); rendre(); };
  $("b-afaire").onclick = function () { masquer = true; this.setAttribute("aria-pressed", "true"); $("b-tout").setAttribute("aria-pressed", "false"); rendre(); };

  rendre();
  var dispo = window.claude && typeof window.claude.use === "function" ? window.claude.use("db") : Promise.resolve(null);
  dispo.then(function (d) {
    if (!d) return modeLocal();
    db = d; ref = db.collection("suivi").doc("etat");
    ref.onSnapshot(function (snap) {
      if (snap && snap.exists) charger(snap.data());
      $("etat").textContent = "Suivi enregistré : il suit sur tous tes appareils, et je le lis.";
      rendre();
    }, function () { modeLocal(); });
  }, modeLocal);
})();
</script>
