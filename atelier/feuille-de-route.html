:root[data-theme="dark"] {

* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.5 var(--f-texte); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: grid; gap: 14px; }
h1 { font: 600 26px/1.2 var(--f-titre); letter-spacing: .03em; margin: 0; color: var(--bronze); text-wrap: balance; }
h2 { font: 600 17px var(--f-titre); letter-spacing: .04em; color: var(--bronze); margin: 12px 0 0; text-wrap: balance; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }

a { color: var(--bronze); font-weight: 700; }

.s-signal { color: var(--s-signal); } .s-report { color: var(--s-report); } .s-clos { color: var(--fait); }

.detail .sourd { color: var(--sourd); }

<div class="wrap">
  <h1>Feuille de route</h1>
  <p class="intro">Aethervale, tenue depuis le 30/10/2026 (v3.567.0), à jour au 02/11 (v3.624.0). C'est le fichier de suivi de cette conversation. Coche une ligne quand elle est faite, et change l'ordre avec ▲ ▼ : je lis tes coches et ton ordre avant chaque étape.</p>
  <p class="etat" id="etat">Chargement de ton suivi…</p>
  <div class="outils" role="group" aria-label="Affichage">
    <button type="button" id="b-tout" aria-pressed="true">Tout</button>
    <button type="button" id="b-afaire" aria-pressed="false">Masquer ce qui est fait</button>
  </div>
  <div id="contenu"></div>
</div>
<script id="donnees" type="application/json">[{"id": "chantiers", "titre": "Chantiers", "numeros": true, "intro": "<b>Ordre proposé le 30/10.</b> Un chantier à la fois, jusqu'au bout. (1) Les images avancent en parallèle, au rythme de tes lots. (2) Les Petites Aventures d'abord : on corrige ce qui existe avant d'ajouter. (3) L'icône de donjon : petite, vite faite. (4) à (7) La « vie du monde », dans l'ordre où chaque chantier réutilise le précédent : ouvertures de chapitre (le composant du prologue), camp qui évolue (ses paliers suivent les chapitres), conversations au feu de camp (sur le camp habité), jours de jeu (qui animent cartes et camp). (8) L'évolution du village, après les jours, puisque ses événements en dépendent. (9) La Tour en dernier : elle profite de tout le reste (ouvertures, conversations, choix pesants). Change l'ordre avec ▲ ▼ si tu veux.", "items": [{"id": "ch-images", "statut": "cours", "titre": "Images à générer", "html": "<p><b>v3.616.2 (02/11)</b> : 30 icônes de plus intégrées (6 événements du village, 5 sujets au feu, les 14 reliques uniques, les 3 objets de l'artisan, l'entrée de donjon, le palier 6 du Sommet interdit). <b>v3.616.3</b> : fond parchemin des fiches. Reste dans <i>Images à générer</i> : le d20 qui roule. Les bâtiments semi-réalistes se traitent dans une autre conversation.</p><p>Il y a 46 images, avec leur prompt, dans <a href=\"https://claude.ai/artifact/SdtrXba9Wkt6YVLQYVS3Cd\" target=\"_blank\" rel=\"noopener\">Images à générer</a> :</p><ul><li>les deux pastilles des élites, « pièce Rare » et « pièce Épique », à la place de l'icône d'armure empruntée ;</li><li>les 6 élites et boss en 400 px ;</li><li>la silhouette du héros (mesurée trop petite sur Mac) ;</li><li>les icônes des bâtiments, des ateliers et des objets, les cartes vivantes et l'icône de l'application.</li></ul><p class=\"sourd\">Nouvelle règle : les formats tiennent compte du PC. Un nouveau fond de combat se livre en deux fichiers, portrait et paysage <code>-wide</code>.</p><p><b>Premier lot intégré en v3.573.0</b> (30/10) : les deux pastilles (branchées, l'icône d'armure n'est plus empruntée), les 6 élites et boss, les silhouettes et le cadenas. Puis les cartes vivantes (v3.574.0) et toutes les icônes restantes (v3.575.0). <b>Liste terminée : 58 sur 58.</b></p>"}, {"id": "ch-pa", "statut": "clos", "titre": "Petites Aventures : bugs et améliorations", "html": "<p><b>Liste de Seb (30/10), vérifiée dans le code</b>, en 4 lots, un à la fois :</p><ul><li><b>Lot 1 ✓ fait en v3.576.0</b> (30/10) : la carte bouge à chaque fenêtre (la caméra recentre à chaque ouverture ou changement d'étape, <code>pa2-view.js:898</code>) ; un zoom de départ à ×1,4 pour la découverte (atelier).</li><li><b>Lot 2 ✓ fait en v3.577.0</b> (30/10) : les jets au d20. d20 + stat (+1 tous les 35 points au-delà de 30) + classe (±2 : Chevalier Force/Précision, Rôdeur Précision/Endurance, Mage Endurance/Force) + objets (un cran = +3) − blessures (−2), contre un DD de 8 qui monte avec le monde, la profondeur, l'anneau et l'obstacle ; de justesse à 1-3 points ; 20 et 1 naturels. Affichage : d20 dessiné, « Il faut 9+ · 60 % », détail du jet sur chaque choix. Banc : forte ~78 %, moyenne ~55 %, faible ~44 %. <i>Validé par Seb (30/10) : le double dé (avantage) ; sources à choisir. Prompt d'une petite animation du dé demandé.</i></li><li><b>Lot 3 ✓ fait en v3.578.0</b> (30/10) : tout au dé. Insister (relance d'un jet raté ou de justesse pour 20 de Souffle), avantage au prochain jet après le repos, la ration choisie soigne ×1,5 au feu (53 / 90 / 100 %), jets de qualité sans échec aux sources, autels, repos, cuisine et trouvailles. Banc : KO Périple 27 → 20 %. <b>Gourde ✓ v3.579.0</b> (choix A) : chaque gorgée donne +15 Souffle et l'avantage au prochain jet.</li><li><b>Lot 4 ✓ fait en v3.580.0</b> (30/10) : l'objet de la nuit. Les conditions étaient déjà annoncées avant le départ (v3.469.0) ; désormais l'objet conseillé est renforcé s'il est dans la besace (+1 usage ; torche et armure sans leur défaut) et mis en avant sur la préparation. <b>Chantier terminé.</b></li></ul><p class=\"sourd\">Déjà noté dans l'État des chantiers :</p><ul class=\"sourd\"><li>sur le parcours « Vers le Cœur », les murs ne bougent pas ;</li><li>les approches « charger » et « tenir » reprennent les icônes d'état des ennemis ;</li><li>la besace reprend l'icône de la Sacoche du donjon.</li></ul>"}, {"id": "ch-village", "statut": "clos", "titre": "Évolution du village", "html": "<p><b>✓ Clos (02/11), v3.624.0</b> : B1 « Aeswyn se repeuple » (atelier <a href=\"https://claude.ai/artifact/Q9TF2quKBDEqfbmiAV24SF\" target=\"_blank\" rel=\"noopener\">Aeswyn se repeuple</a>, variante A) : habitants en pastille sur le bandeau du Village, phrase du palier (8 paliers). Avec A et D (v3.606.0), les événements du village et le Grand Ouvrage automatique, le chantier est fait. La partie visuelle (bâtiments, village peint) se fait dans une autre conversation. À la Tour : niveaux encore fermés (Atelier 9-10, Enchanteresse 3, Entrepôt 17-20, Palissade 9-10 ; pas de ligne de plafond pour la Tour) et matières de la Tour, avec le chapitre VI.</p><p><b>v3.606.0 (01/11)</b> : A (l'artisan d'Aeswyn : corde tressée, trousse de maître, torche résinée, fabriquées dans les ateliers existants) et D (Sarkel rachète les ressources rares pendant son marché) livrés. B, un village qui grandit et se voit (habitants, image qui change), reste à cadrer avec Seb.</p><p><i>Noté le 30/10 (lot 4 des Petites Aventures, option C) : faire fabriquer au village la corde, la trousse et la torche (bois, fer), pour relier la préparation des Petites Aventures à l'économie du village.</i></p><p>Il faut d'abord fixer ce que tu veux : de nouveaux bâtiments, de nouveaux niveaux, des usages pour le surplus, ou plus de vie au village. Viendra ensuite un document de conception, comme pour les mondes.</p><p class=\"sourd\">Pistes déjà dans le code ou la doc :</p><ul class=\"sourd\"><li>des niveaux qu'aucun monde ouvert ne permet de construire : Atelier 9-10, Enchanteresse 3, Entrepôt 9-10, Palissade 9-10. C'est relevé en v3.501, à revérifier ;</li><li>l'Outre pleine affiche « Rien pour l'instant : elle servira plus tard » (<code>js/ui/warehouse-view.js:485</code>) ;</li><li>le Grand Ouvrage (v3.561), à juger en jeu ;</li><li>les matières de la Tour, à prévoir avec le chapitre VI.</li></ul>", "faitDefaut": "2026-11-02"}, {"id": "ch-ilvl", "statut": "clos", "titre": "Niveau d'objet (ilvl) des équipements", "html": "<p><b>✓ Fait en v3.615.0</b> (01/11) : formule B (monde × 10 + rareté + tirage + Aether, déduit de la pièce), affichage C de l'atelier (coin sur l'icône, pastille et calcul dans la fiche, écart dans la comparaison, ilvl moyen du héros). Affichage seul.</p><p><b>Idée de Seb (01/11)</b> : afficher un niveau d'objet sur chaque équipement.</p><p class=\"sourd\">Aujourd'hui, aucun ilvl dans le code : une pièce se lit par sa rareté, son monde d'origine et ses stats. À cadrer : ce que l'ilvl mesure (monde + rareté + améliorations ?), où il s'affiche (fiche, comparaison, butin), et s'il sert à autre chose qu'à lire (seuil d'équipement, prix, recyclage).</p>"}, {"id": "ch-grande-ration", "statut": "clos", "titre": "Grande ration : jamais utilisée", "html": "<p><b>✓ Fait en v3.608.0</b> (01/11, option A) : recette 1 Ration + 15 Viandes + 10 Eau, sans Sève. À juger en jeu ; si elle reste boudée, option C (elle paie une entrée à 2 Rations).</p><p><b>Retour de Seb (01/11)</b> : il ne fabrique et n'utilise jamais la Grande ration.</p><p class=\"sourd\">Dans le code : au Campement, elle rend 100 % des PV ; en Petite Aventure, 100 % des PV et une blessure, mais elle prend 3 places, la moitié de la besace (la Ration : 60 %, une blessure, 2 places). À cadrer : la rendre utile (moins encombrante, effet en plus, usage propre en donjon) ou la retirer de la fabrication.</p>"}, {"id": "ch-surproduction", "statut": "clos", "titre": "Surproduction en fin de partie", "html": "<p><b>✓ Fait en v3.609.0</b> (01/11, option C) : relevé au banc (tout est plein 100 % du temps, les zones produisent 30 à 50 fois ce qui est récolté ; le village d'un monde se paie en moins d'une demi-journée). B (baisser les zones) abandonné : il faudrait ÷10 à ÷20. Grand Ouvrage automatique au-delà d'un seuil réglable (70-95 %, 80 % par défaut), paliers à +18 %, ouvert au Désert. Reste à tester : simplifier les 9 zones (moins de zones, ou gestion automatique), atelier d'abord.</p><p><b>v3.610.0</b> : la part laissée au village par la caravane se règle (10-75 %), plus de caravane bloquée au Désert. <b>v3.611.0</b> : trajet Long à 2 rares garantis, commande du jour par marché (+25 % d'or, +1 rare par jour). Caravanes manuelles (décision de Seb). <b>Zones : décision prise</b> (01/11), 3 parcelles (rapide, moyenne, lente) qui montent par monde (5/10/12/15/17), achat automatique au-delà de la moitié du plafond, actif dès le Désert ; banc <code>parcelles-bench.js</code> : même débit, 1 020 → 336 achats. Prototype dans l'atelier. (<a href=\"https://claude.ai/artifact/DeM4ckxa57NDi28WL3dEV9\" target=\"_blank\" rel=\"noopener\">Atelier Parcelles</a>). <b>✓ Livré en v3.612.0</b> : disposition B, coûts lissés (même total par monde), migration sans perte de débit, achat automatique dès le Désert (défricher d'abord, puis le moins cher, au-dessus de la moitié du plafond). À juger en jeu.</p><p><b>Retour de Seb (01/11)</b> : la surproduction revient sur la fin. Piste de Seb : ajouter des niveaux aux bâtiments.</p><p class=\"sourd\">À mesurer au banc avant de choisir : quelles ressources débordent, à quel monde. Pistes : de nouveaux niveaux (avec des coûts qui absorbent le surplus), des usages du surplus (lié à « Évolution du village », piste B), des plafonds d'Entrepôt. Le rachat de Sarkel (v3.606.0) ne couvre que les ressources rares.</p>"}, {"id": "ch-stats-heros", "statut": "clos", "titre": "Stats du héros et paliers d'entraînement", "html": "<p><b>✓ Clos (03/11, Seb)</b> : C (v3.613.0) et B (v3.614.0) répondent à l'idée ; l'option A n'apporterait rien (mesure : le niveau du héros suit déjà le plafond du Terrain, A ne mordrait qu'au Désert). Terrain porté à 21 (230) en v3.635.0.</p><p><b>v3.613.0 (01/11), option C</b> : entraînement ×4 à partir du niveau 60 (Désert), Forêt inchangée. Banc de campagne ×1/×3/×4/×5 : ×4 sans mur, la caractéristique de classe et l'Endurance d'abord ; ×5 bloquait aux Ruines (4 pièces Rares). <b>v3.614.0</b> : option B, caractéristiques secondaires à 70 % du plafond du Terrain (classe et Endurance au plafond), mesurée au robot joueur sur les 3 classes (60 % pénalisait le Mage). Reste A (le niveau du héros rythme l'entraînement), si besoin.</p><p><b>Idée de Seb (01/11)</b> : revoir la montée des stats du héros pour qu'on n'ait pas à monter de niveau à chaque palier d'entraînement du Camp ; peut-être limiter le gain par niveau des stats autres que l'Endurance et la stat principale de la classe.</p><p class=\"sourd\">Touche l'équilibrage de tout le jeu (et sans doute <code>stats-system.js</code> ou <code>progression-system.js</code>, fichiers protégés). À faire : relire le vrai calcul (gains par niveau, plafond d'entraînement par niveau), mesurer au banc, puis proposer des options chiffrées.</p>"}, {"id": "ch-tour", "statut": "clos", "titre": "Chapitre VI, la Tour", "html": "<p><b>✓ Clos (03/11)</b> : chapitre VI complet de v3.625.0 à v3.637.0 (20 étapes, Mémoire 21 à 24, hauts faits, voie de talents Varier, rythme 8 à 13,6 h, round intouchable de la silhouette) ; textes relus par Seb. Reste seulement les images, suivies dans « Images à générer ».</p><p><b>02/11, chapitre VI écrit par délégation</b> : conception v0.1 (TW0 à TW15, docs <code>mondes/tour/</code>), 20 étapes en 4 actes (« Le pied de la Tour », « Les étages », « Ce qu'elle a appris », « La Question »), ouverture, vision de cette nuit-là, quatre fins ; 27 textes à relire dans l'atelier des textes (chantier « Tour · chapitre VI ») ; 39 images en tête de « Images à générer ». <b>v3.625.0</b> : lot T-0 (socle) livré : plafonds de la Tour, Givre bleu et Verre de faille, Forge 7, référence du héros de fin de Montagne ; conception validée d'un bloc. v3.625.1 : échelle d'équipement de la Tour ×6 (Seb). <b>v3.626.0 : lot T-1</b>, acte I « Le pied de la Tour » jouable (route du nord, gardiens, dernier camp, étage du sable, choix de la braise) ; <b>v3.627.0 et v3.628.0 : lot T-2</b>, acte II « Les étages » jouable (carte des étages et la redite, l'escalier, Marché de la Tour, gisants debout, Gardien qui répète, palier Légendaire, feuillets au Codex) ; <b>v3.629.0 : lot T-3</b>, acte III « Ce qu'elle a appris » jouable (Sommet interdit, le Reflet et le miroir, 7 Légendaires et Forge 7, choix « Aeswyn d'avant ») ; <b>v3.630.0 : lot T-4a</b>, « Seul », la faille et la silhouette (sans compagnon ; elle prend le trait de ta classe) ; <b>v3.631.0 : lot T-4b</b>, la vision, la Question (prix par axe : Le fil bleu, Brannoc), Azhem, l'épilogue et la fin de l'Histoire ; à relire par Seb : les quatre fins ; <b>v3.632.0 : lot T-5</b>, Mémoire 21 à 24 (jalon 24 ouvert par la Question) et dix hauts faits de la Tour ; campagne complète des trois classes jusqu'à la fin de l'Histoire. <b>Chapitre VI terminé.</b> Constat : la Tour se boucle en 3,3 à 3,9 h simulées (Montagne ≈ 9,5 h), à juger en jeu. <b>v3.633.0</b> : voie de talents « Varier » (commune, ouverte à la Tour), plafond des talents 23 → 28. <b>v3.634.0</b> : équilibre des classes (Chevalier ×1,15 de dégâts, Rôdeur ×0,85, Mage +5 % PV) : campagne 35,3 / 36,8 / 33,4 h. <b>v3.635.0</b> : rythme de la Tour (Terrain 19 à 21, palier Forge 7 + reforge 13, 5 étages et 2 escaliers) : Tour 8 à 13,6 h. Silhouette ×4,25 / ×1,1. <b>v3.637.0</b> : le vrai round intouchable de la silhouette (annoncé à 30 %), sans toucher au moteur. La falaise de difficulté vient d'une course à l'usure, pas de la mécanique. <b>Plus tard</b> : le vrai round intouchable de la silhouette (Seb, 02/11). <b>Tranché par Seb (02/11)</b> : la Question en option A (trois réponses selon le registre, bascules avec prix), Azhem, la Tour au nord (corrigé en v3.624.1). Ensuite : lots T-0 à T-5.</p><p><b>Note (v3.624.0)</b> : fixer la ligne de plafonds de la Tour dans world-caps.js (sans elle, tout s'ouvre d'un coup : Atelier 10, Enchanteresse 3, Entrepôt 20, Palissade 10).</p><p><b>Note (v3.622.0)</b> : la Tour n'a pas de carte vivante, donc pas de nuit ; à prévoir avec le chapitre VI.</p><p><b>Note (v3.621.3)</b> : à l'ouverture de la Tour, prévoir la fiche Codex du sixième Sceau (le Codex parle de « cinq couches » et du « dernier Sceau connu »), et confirmer, nuancer ou démentir la rumeur « la Tour était là avant le royaume » (notée dans la bible).</p><p>Aujourd'hui, l'Histoire s'arrête sur « Fin du chapitre 5 ». Le premier livrable serait le document de conception (<code>mondes/tour/Aethervale_Conception_Tour_v0_1.md</code>), sans code.</p><p class=\"sourd\">Déjà décidé :</p><ul class=\"sourd\"><li>le gabarit des actes, QUE-15 option A : ordre varié, contraintes, 2 quêtes autonomes ;</li><li>le donjon 6, qui donne le Légendaire ;</li><li>les images du bestiaire et le fond paysage.</li></ul><p class=\"sourd\">À trancher :</p><ul class=\"sourd\"><li>le récit §VI et le nom Azhem ;</li><li>le combat de la silhouette, qui touchera peut-être le moteur de combat (fichier protégé) ;</li><li>la Question et ses 4 fins ;</li><li>la Mémoire et le Grimoire ;</li><li>ce qui suit la fin.</li></ul>"}, {"id": "ch-ouvertures", "statut": "clos", "titre": "Ouvertures de chapitre (comme le prologue)", "html": "<p><b>✓ Clos (02/11), v3.624.2</b> : les 24 illustrations de Seb sont en jeu. L'ouverture de la Tour viendra avec le chapitre VI (textes et prompts déjà prêts).</p><p><b>v3.623.0 (02/11)</b>, option A : les 4 ouvertures (Désert, Ruines, Crypte, Montagne) sont en jeu, textes validés par Seb dans l'atelier <a href=\"https://claude.ai/artifact/HZ9u2N2BJTbsPamZntYwhp\" target=\"_blank\" rel=\"noopener\">Ouvertures de chapitre</a>. Jouées à la fin de la première étape du monde, revues depuis Quêtes › Histoire. Reste : les 24 images (prompts en tête de « Images à générer »), fond animé en attendant. La Tour viendra avec le chapitre VI.</p><p><b>Option A validée</b> (30/10) : 2 ou 3 planches illustrées, texte lettre à lettre, à la première arrivée dans chaque monde (Désert, Ruines, Crypte, Montagne ; la Tour plus tard). On peut les revoir depuis Quêtes › Histoire, et les parties en cours les voient en arrivant dans leur prochain monde.</p><p class=\"sourd\">Environ 12 scènes, soit 24 images (PC et téléphone). Le composant du prologue est réutilisé. Méthode : un chapitre à la fois, textes validés avant les images, en commençant par le Désert. À suivre peut-être : l'option C (lettre à lettre dans les fenêtres d'étape), et l'option B (les choix pesants), à voir avec la Tour.</p>", "faitDefaut": "2026-11-02"}, {"id": "ch-icone-donjon", "statut": "clos", "titre": "Icône de donjon sur la carte Aventure", "html": "<p><b>v3.616.2</b> : l'image de l'entrée de donjon est en jeu.</p><p><b>✓ Fait en v3.582.0</b> (30/10, options A et 1) : badge du donjon au bas de chaque monde de la carte (absent, gris au cadenas, doré, éteint), toucher pour entrer. Reste : l'image <code>dungeon/dungeon_entrance.webp</code> à générer (prompt donné), générique en attendant.</p><p>Un repère visible du donjon de chaque monde sur la carte Aventure.</p><p class=\"sourd\">Aujourd'hui, sur téléphone, la carte du monde ne montre que les mondes. Sur PC, le donjon est une carte de la colonne, avec l'icône <code>dungeon/dungeon_guaranteed_loot.webp</code>, empruntée à l'article « Butin garanti » (image en double, signalée). Il existe des icônes de palier (<code>images/Dungeons/Icone_base/palier2-5.webp</code>) à regarder. À cadrer : la place sur la carte, l'image et l'action au toucher.</p>"}, {"id": "ch-jours", "statut": "clos", "titre": "Les jours de jeu (des cartes vivantes qui bougent)", "html": "<p><b>✓ Clos (02/11), v3.622.0</b> (option B) : dans la Crypte et la Montagne, l'écran de la nuit dit ce qui a changé (gisants rendormis, lave et chaleur retombées) ; « Rien n'a bougé » seulement quand c'est vrai. Les 8 phrases sont dans l'atelier des textes. Plus tard, si les événements paraissent répétitifs en jeu : des événements propres à chaque monde (option C).</p><p><b>v3.616.2 (02/11)</b> : les 6 icônes d'événement sont en jeu ; la lame de Brannoc est toujours une arme de la classe (v3.621.0).</p><p><b>Étape 1 livrée en v3.602.0 (31/10)</b> : J2 (une nuit toutes les 3 sorties) et nuit vivante (B), atelier jours-du-monde (jour sur le bandeau du Camp, nuit en plein écran). La carte du monde où tu vis peut reprendre un secteur lointain non tenu (banc : 0,50 secteur par nuit sans Palissade, 0,25 au niveau 7, 0 au niveau 10). Réveil, coulée, chaleur, frein des élites et chantier des Ruines en jours de jeu. À juger en jeu. <b>Étape 2 livrée en v3.604.0</b> : « Ce matin à Aeswyn », 24 événements de village (rumeurs, demandes des anciens, marché de Sarkel, fêtes), 2 jours de jeu chacun, environ une aube sur deux. 4 icônes d'événement à générer (atelier des images). <b>Étape 3 (E3) livrée en v3.607.0</b> (01/11) : 6 suites qui arrivent le lendemain d'une réussite (la lame de Brannoc, les vivres et la fête d'Orwen, le compte d'Aldric qui renforce la Palissade, une deuxième rumeur plus loin, le retour de Sarkel) ; au feu, « Et ce matin ? » (20 lignes) et une phrase du soir par type d'événement. 2 icônes de plus à générer (cadeau, palissade).</p><p>Idée de Seb (30/10) : un compteur de jours qui avance quand on joue, avec les quêtes et les sorties, pas avec l'heure réelle. Les cartes vivantes reprendraient alors des secteurs avec le temps de jeu. Un joueur qui joue peu n'est pas pénalisé : aucun jour ne passe en son absence.</p><p class=\"sourd\">Constat : aujourd'hui, le Recouvrement ne reprend un secteur que sur l'échec d'un rejeu (<code>living-map-system.js:782</code>), et l'Ascension n'existe plus. Une carte libérée ne bouge donc presque plus.</p><p class=\"sourd\"><b>Rouvre une décision close</b> (Cartes vivantes, 13/09, §3.2 : « pas d'horloge »). Les raisons de l'époque, punir l'absence et le rattrapage au retour, ne valent pas pour un jour de jeu. À trancher : ce qui fait passer un jour (étape d'Histoire, retour au camp, ou les deux) ; ce que fait une nuit (reprise d'un secteur lointain non protégé, frein de la Palissade, peut-être des événements) ; ce qui reste en jours réels (Arbre-mère, colporteur, Apothicaire : recommandé) ; l'affichage (« Jour 34 »). Effort moyen à gros : nouvel état sauvegardé, donc <code>save-system.js</code> (protégé, accord de Seb), et une mesure au banc des cartes.</p><p class=\"sourd\"><b>Le village (question de Seb, 30/10).</b> Passer aussi la production en jours de jeu est écarté dans mon avis. Ça casserait l'idle, puisque celui qui joue peu produirait moins. Ça demanderait de réécrire toute l'économie (83 appels à l'horloge dans 27 systèmes, dont des fichiers protégés). Et ça permettrait de recharger à volonté les plafonds quotidiens. <b>Décision de Seb (30/10) : recommandation suivie</b>, en deux étapes : (1) les cartes vivantes et l'affichage du jour ; (2) si ça prend bien, des événements de village rattachés aux jours (rumeur de Taverne, demande d'un ancien, marché de Sarkel, fêtes). La production et les plafonds quotidiens restent en temps réel.</p>", "faitDefaut": "2026-11-02"}, {"id": "ch-camp", "statut": "cadrer", "titre": "Un camp qui évolue", "html": "<p><b>✓ Fait (31/10)</b> : A par les bandeaux illustrés (v3.581.0, un camp par monde) ; onglet « Le feu » et carte du monde dans la barre du bas (v3.594.0, atelier camp-carte, option M3) ; C1 la phrase du soir et C2 le coin du feu (v3.595.0, 88 phrases). Reste : C3, le jour et la nuit, avec « Les jours de jeu ».</p><p><b>Options A et C retenues</b> (30/10). A : une illustration en tête de la page Camp, grande sur PC, qui change à chaque chapitre : cercle de cendres, campement, hameau, village, Aeswyn rebâti (5 scènes, 10 images). C : le camp habité, avec les compagnons restés au camp autour du feu, une phrase du narrateur qui change, et plus tard le jour et la nuit.</p><p class=\"sourd\">Aujourd'hui, le Camp est une page fonctionnelle sans image du camp. À trancher : ce qui fait changer de palier (le chapitre, recommandé, ou le niveau du village). Écartées : B, le camp en calques (risqué avec un générateur), et D, des améliorations à acheter (doublerait le Village). Lié aux ouvertures de chapitre et aux jours de jeu.</p>"}, {"id": "ch-compagnons", "statut": "clos", "titre": "Parler avec les compagnons", "html": "<p><b>✓ Clos (03/11)</b> : textes relus par Seb ; confirmés : le frère de Maddoc vivant (il reste), la lueur bleue des Ruines, le Veilleur bâtisseur.</p><p><b>v3.616.2 (02/11)</b> : les 14 icônes de reliques et les 5 icônes de sujets sont en jeu. <b>Décisions</b> : le frère de Maddoc vivant (qui reste), la lueur bleue des Ruines et le Veilleur bâtisseur sont repris comme acquis dans la mission d'audit de Seb (02/11), à confirmer ; « la Tour était là avant le royaume » (Maddoc) gardé comme rumeur, ni confirmée ni démentie, notée dans la bible (option A, 02/11). Reste : relecture de Seb dans l'atelier des textes.</p><p><b>En cours (31/10)</b> : cadre validé (conversations au feu pour l'histoire et le monde, une quête personnelle par compagnon et par chapitre, débloquée par une conversation). Mise en page B « la scène » (atelier conversations). Moteur et scène livrés en v3.597.0, sans conversation. 14 quêtes personnelles validées (3 par compagnon, 2 pour Sarkel), chacune avec sa relique unique (tableau validé) ; moteur des quêtes et des reliques livré en v3.598.0. <b>v3.599.0 : tout le contenu est en jeu</b>, intégré avant relecture (accord de Seb) : 27 conversations et 14 quêtes. v3.600.0 : « J'y vais » et le lieu de la quête marqué sur la carte vivante. v3.601.0 : toucher un compagnon ouvre la liste des sujets (souvenirs, avis sur le monde, sa quête ; 30 textes). v3.605.0 : T2, « Et les autres ? » (20 avis). Reste : la relecture de Seb dans l'atelier des textes (corrections au fil de l'eau), deux décisions (le frère de Maddoc, trois inventions sur le monde), les 14 icônes de reliques (atelier des images).</p><p>Idée de Seb (30/10) : pouvoir discuter avec les compagnons pour leur donner vie.</p><p class=\"sourd\">Existe déjà : des répliques de combat (arrivée, compétence, K.-O., boss), les dialogues des étapes d'Histoire, les reliques et les Fidélités. Il n'y a aucune conversation à l'initiative du joueur. Le héros ne parle jamais (Bible). Ses réponses seraient donc des gestes dits par le narrateur. Pistes et chiffrage : voir la conversation du 30/10.</p>"}, {"id": "ch-intro", "statut": "cours", "titre": "Introduction du jeu (l'accroche)", "html": "<p>Aujourd'hui, on va de l'écran titre à la création (nom, classe), puis directement au Camp et au tutoriel « Le Campement ». Le seul récit d'ouverture est la phrase de <code>forest_01</code> et le Prologue du Codex, qu'on ne lit pas par défaut.</p><p>Idée : un prologue illustré, fait de planches plein écran avec le texte court du narrateur. On le passe quand on veut, et on peut le revoir.</p><p><b>Option B validée</b> (30/10) : 4 planches avant la création (« Cette nuit-là »), 2 après (« Douze hivers »), puis le Camp. L'option C, la mise en scène animée, viendra peut-être ensuite.</p><p><b>Textes validés</b> (30/10, version fusionnée, phrase 6 de Seb) : <code>systemes/introduction/Aethervale_Prologue_v0_2.md</code>.</p><p><b>Images livrées</b> (30/10) : les 12, converties dans <code>game/images/Prologue/</code> (2,4 Mo).</p><p><b>Codé en v3.570.0</b> (30/10) : fond A, lettre à lettre, vitesse normale, rythme régulier ; « Revoir le prologue » dans Quêtes › Histoire. Contrôles à zéro échec.</p><p><b>Publié</b> (30/10, GitHub Pages, v3.570.0).</p><p class=\"sourd\">Reste : le juger en jeu sur iPhone. L'option C, les animations, viendra plus tard.</p>"}, {"id": "ch-cartes", "statut": "clos", "titre": "Habillage des cartes (parchemin et cadres)", "faitDefaut": "2026-11-02", "html": "<p><b>✓ Fait (02/11)</b>, habillage E de l'atelier <a href=\"https://claude.ai/artifact/JBVKcCa6qydrLmcfFtNRhA\" target=\"_blank\" rel=\"noopener\">Cartes E</a> : texture parchemin crème partout, cadre secondaire pour l'interface et les onglets, parchemin déchiré pour les documents (quêtes, missions, Taverne, objectif de la Chronique). v3.616.3 fond des fiches ; v3.617.0 fondations et encres ; v3.618.0 interface (46 classes) et parcours P14 qui signale toute carte oubliée ; v3.618.1 encres foncées dans les cartes ; v3.619.0 documents ; v3.619.1 mannequin rendu ; v3.620.0 inventaire complet (68 écrans) ; v3.621.2 correctif iPhone (Safari, confirmé). La Chronique reste sombre (décision de Seb).</p>"}, {"id": "ch-audit", "statut": "clos", "titre": "Audit narratif (révélations, promesses, tutoriels)", "faitDefaut": "2026-11-02", "html": "<p><b>✓ Fait (02/11)</b>, mission de Seb. v3.621.0 : le Codex se lit au rythme des feuillets du Veilleur (après desert_07), prologue en deux fiches (« Le Cycle » à la fin de la Montagne), extraits et fiche du Donjon alignés, « hors du Cycle » retiré, lame de Brannoc = arme, dernière phrase du prologue, 7 tutoriels corrigés. v3.621.1 : forest_13 compte des vagues (fichier protégé, accord de Seb). v3.621.3 : l'élite qui garde un secteur dans les tutoriels des cartes. Fiches « Village » et « Donjon » laissées telles quelles (décision de Seb).</p>"}]}, {"id": "tests", "titre": "À tester en jeu", "items": [{"id": "t-ge-d", "statut": "tester", "titre": "Grand écran, option D (v3.567)", "html": "<p>Le Camp, la Production, le combat en paysage, les onglets en pastilles.</p>"}, {"id": "t-android", "statut": "tester", "titre": "Retour Android (v3.536)", "html": "<p>Sur un vrai Android, avec le jeu installé.</p>"}, {"id": "t-texte", "statut": "tester", "titre": "Taille du texte « Grande » (v3.538)", "html": "<p>Sur iPhone (zoom de Safari).</p>"}, {"id": "t-ouvrage", "statut": "tester", "titre": "Grand Ouvrage (v3.561)", "html": "<p>Le rythme des paliers et l'or gagné.</p>"}, {"id": "t-combat", "statut": "tester", "titre": "Combat (v3.438 à v3.447)", "html": "<p>L'initiative, la préparation de sortie, les objets de combat, le coup de grâce, une descente complète du Labyrinthe, le journal de test.</p>"}, {"id": "t-equilibre", "statut": "tester", "titre": "Équilibre", "html": "<p>Le Chevalier sur « Celui qui retient » (98 % au banc, contre 83 % pour les autres) ; Nezzam depuis l'initiative ; l'or des caravanes multiples (non mesuré au banc).</p>"}]}, {"id": "signales", "titre": "Signalé, sans correction d'office", "items": [{"id": "s-doubles", "statut": "signal", "titre": "Images qui servent à deux choses", "html": "<ul><li>Viande et Viande séchée ; Eau et Eau purifiée ;</li><li><code>node_discovery</code>, <code>stat_critical</code> et <code>equipment_shop</code> (tutoriels compris) ;</li><li><code>stat_speed</code>, <code>heal_incoming</code> ;</li><li><code>quests/mission_hunt.webp</code>, qui ne sert plus.</li></ul>"}, {"id": "s-provisoire", "statut": "signal", "titre": "Valeurs et textes provisoires", "html": "<p>Les gains de la carte des Ruines, les récompenses des étapes 11 à 20, Le seuil (25 %) et le titre de chapitre « La ville rangée ».</p>"}, {"id": "s-robot", "statut": "signal", "titre": "Robot : une seule caravane", "html": "<p>Le robot n'envoie qu'une caravane. L'or des caravanes multiples n'est donc pas mesuré.</p>"}, {"id": "s-maquette", "statut": "signal", "titre": "Grand écran : écarts avec la maquette", "html": "<p>La fiche du Village garde les cases du jeu, et le journal de combat n'est pas regroupé par round.</p>"}]}, {"id": "reportes", "titre": "Reporté", "items": [{"id": "r-sons", "statut": "report", "titre": "Sons (PLA-6)", "html": ""}, {"id": "r-gestes", "statut": "report", "titre": "Gestes d'attaque (piste combat B)", "html": ""}, {"id": "r-escorte", "statut": "report", "titre": "Escorte et temps limité (QUE-15 option B)", "html": "<p>Possibles plus tard à la Tour.</p>"}, {"id": "r-csp", "statut": "report", "titre": "Politique de sécurité (CSP)", "html": "<p>À faire s'il y a un jour un serveur de connexion.</p>"}, {"id": "r-typo", "statut": "report", "titre": "Échelle typographique complète (INT-11 A)", "html": "<p>Écran par écran.</p>"}, {"id": "r-menage", "statut": "report", "titre": "Nettoyages", "html": "<p>L'ancien code de combat, l'ancien écran Équipement (pour les vieilles sauvegardes), les noms <code>scene-*</code>.</p>"}]}, {"id": "clos", "titre": "Clos", "items": [{"id": "c-boutique", "statut": "clos", "titre": "Boutique à côté du Sac (v3.615.2)", "faitDefaut": "2026-11-02", "html": "<p>La Boutique d'équipement reste dans Héros › Équipement toute la partie ; la Halle la propose aussi (option A). v3.615.1 : correctif de l'écran Équipé (un seul emplacement se choisissait).</p>"}, {"id": "c-difficulte", "statut": "clos", "titre": "Difficulté de la Crypte et de la Montagne (v3.562)", "faitDefaut": "2026-10-30", "html": "<p>Testée en jeu avec un Mage : c'est nettement plus dur, et il faut des potions de force contre le Dragon. C'est l'effet voulu, rien ne change.</p>"}, {"id": "c-images-192", "statut": "clos", "titre": "Suivi « Images à faire » : 192 sur 192", "faitDefaut": "2026-10-30", "html": "<p>Aucune image n'est absente du jeu. La suite est dans « Images à générer ».</p>"}]}]</script>
<script>
(function () {
  var SECTIONS = JSON.parse(document.getElementById("donnees").textContent);
  var STATUT = { cours: "En cours", cadrer: "À cadrer", tester: "À tester", signal: "Signalé", report: "Reporté", clos: "Clos" };
  // État du suivi : ordre par section (liste d'ids) et lignes faites (id -> date)
  var etat = { ordre: {}, fait: {} }, version = 0, db = null, ref = null, masquer = false;
  var $ = function (id) { return document.getElementById(id); };

  SECTIONS.forEach(function (s) { s.items.forEach(function (it) { if (it.faitDefaut) etat.fait[it.id] = it.faitDefaut; }); });

  // Ordre d'une section : celui du suivi, puis les lignes nouvelles à la fin
  function ordonner(s) {
    var o = (etat.ordre[s.id] || []).filter(function (id) { return s.items.some(function (it) { return it.id === id; }); });
    s.items.forEach(function (it) { if (o.indexOf(it.id) < 0) o.push(it.id); });
    return o.map(function (id) { return s.items.filter(function (it) { return it.id === id; })[0]; });
  }

  function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function dateFr(iso) { var p = String(iso).slice(0, 10).split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : ""; }

  function rendre() {
    var h = "";
    SECTIONS.forEach(function (s) {
      var items = ordonner(s), n = items.filter(function (it) { return etat.fait[it.id]; }).length;
      h += '<h2>' + esc(s.titre) + '<small>' + n + ' / ' + items.length + ' faits</small></h2>' + (s.intro ? '<p class="intro sec-intro">' + s.intro + '</p>' : '') + '<div class="section">';
      items.forEach(function (it, i) {
        var on = !!etat.fait[it.id];
        if (masquer && on) return;
        h += '<div class="item' + (on ? ' is-fait' : '') + '">'
          + '<button type="button" class="coche" data-id="' + it.id + '" aria-pressed="' + on + '" aria-label="' + (on ? "Décocher " : "Cocher ") + esc(it.titre) + '">' + (on ? "✓" : "") + '</button>'
          + '<div class="corps"><div class="tete">' + (s.numeros ? '<span class="rang">' + (i + 1) + '.</span>' : '')
          + '<span class="titre">' + esc(it.titre) + '</span><span class="pastille s-' + it.statut + '">' + STATUT[it.statut] + '</span></div>'
          + (on ? '<span class="date">Fait le ' + dateFr(etat.fait[it.id]) + '</span>' : '')
          + (it.html ? '<div class="detail">' + it.html + '</div>' : '') + '</div>'
          + '<div class="fleches"><button type="button" data-s="' + s.id + '" data-i="' + i + '" data-d="-1" aria-label="Monter ' + esc(it.titre) + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>'
          + '<button type="button" data-s="' + s.id + '" data-i="' + i + '" data-d="1" aria-label="Descendre ' + esc(it.titre) + '"' + (i === items.length - 1 ? ' disabled' : '') + '>▼</button></div>'
          + '</div>';
      });
      h += '</div>';
    });
    $("contenu").innerHTML = h;
    $("contenu").querySelectorAll(".coche").forEach(function (b) { b.onclick = function () { basculer(b.dataset.id); }; });
    $("contenu").querySelectorAll(".fleches button").forEach(function (b) { b.onclick = function () { deplacer(b.dataset.s, +b.dataset.i, +b.dataset.d); }; });
  }

  function basculer(id) {
    if (etat.fait[id]) delete etat.fait[id]; else etat.fait[id] = new Date().toISOString().slice(0, 10);
    rendre(); enregistrer();
  }

  function deplacer(sid, i, d) {
    var s = SECTIONS.filter(function (x) { return x.id === sid; })[0], o = ordonner(s).map(function (it) { return it.id; });
    var j = i + d; if (j < 0 || j >= o.length) return;
    var t = o[i]; o[i] = o[j]; o[j] = t; etat.ordre[sid] = o;
    rendre(); enregistrer();
  }

  // Un seul document « suivi/etat » : base de la page, sinon cet appareil
  function enregistrer() {
    var doc = { ordre: etat.ordre, fait: etat.fait, le: new Date().toISOString() };
    if (ref) {
      ref.set(doc).catch(function (e) {
        $("etat").textContent = e && e.code === "invalid_argument" ? "Tu peux consulter cette page, mais pas la modifier." : "Le changement n'a pas été enregistré. Réessaie dans un instant.";
      });
    } else {
      try { localStorage.setItem("feuille-de-route", JSON.stringify(doc)); } catch (e) {}
    }
  }

  // Copie profonde : les données de la base sont figées, on ne peut pas les modifier sur place
  function charger(v) { if (v && typeof v === "object") { v = JSON.parse(JSON.stringify(v)); etat.ordre = v.ordre || {}; etat.fait = v.fait || {}; } }

  function modeLocal() {
    ref = null;
    try { charger(JSON.parse(localStorage.getItem("feuille-de-route") || "null")); } catch (e) {}
    $("etat").textContent = "Suivi enregistré sur cet appareil seulement : je ne pourrai pas le lire.";
    rendre();
  }

  $("b-tout").onclick = function () { masquer = false; this.setAttribute("aria-pressed", "true"); $("b-afaire").setAttribute("aria-pressed", "false"); rendre(); };
  $("b-afaire").onclick = function () { masquer = true; this.setAttribute("aria-pressed", "true"); $("b-tout").setAttribute("aria-pressed", "false"); rendre(); };

  rendre();
  var dispo = window.claude && typeof window.claude.use === "function" ? window.claude.use("db") : Promise.resolve(null);
  dispo.then(function (d) {
    if (!d) return modeLocal();
    db = d; ref = db.collection("suivi").doc("etat");
    ref.onSnapshot(function (snap) {
      if (snap && snap.exists) charger(snap.data());
      $("etat").textContent = "Suivi enregistré : il suit sur tous tes appareils, et je le lis.";
      rendre();
    }, function () { modeLocal(); });
  }, modeLocal);
})();
</script>
