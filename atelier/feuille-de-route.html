  <h1>Feuille de route</h1>
  <p class="intro">Aethervale, tenue depuis le 30/10/2026 (v3.567.0). C'est le fichier de suivi de cette conversation. Coche une ligne quand elle est faite, et change l'ordre avec ▲ ▼ : je lis tes coches et ton ordre avant chaque étape.</p>

 {"id": "chantiers", "titre": "Chantiers", "numeros": true,
  "intro": "<b>Ordre proposé le 30/10.</b> Un chantier à la fois, jusqu'au bout. (1) Les images avancent en parallèle, au rythme de tes lots. (2) Les Petites Aventures d'abord : on corrige ce qui existe avant d'ajouter. (3) L'icône de donjon : petite, vite faite. (4) à (7) La « vie du monde », dans l'ordre où chaque chantier réutilise le précédent : ouvertures de chapitre (le composant du prologue), camp qui évolue (ses paliers suivent les chapitres), conversations au feu de camp (sur le camp habité), jours de jeu (qui animent cartes et camp). (8) L'évolution du village, après les jours, puisque ses événements en dépendent. (9) La Tour en dernier : elle profite de tout le reste (ouvertures, conversations, choix pesants). Change l'ordre avec ▲ ▼ si tu veux.",
  "items": [
  {"id": "ch-images", "statut": "cours", "titre": "Images à générer",
   "html": "<p>Il y a 46 images, avec leur prompt, dans <a href=\"https://claude.ai/artifact/SdtrXba9Wkt6YVLQYVS3Cd\" target=\"_blank\" rel=\"noopener\">Images à générer</a> :</p><ul><li>les deux pastilles des élites, « pièce Rare » et « pièce Épique », à la place de l'icône d'armure empruntée ;</li><li>les 6 élites et boss en 400 px ;</li><li>la silhouette du héros (mesurée trop petite sur Mac) ;</li><li>les icônes des bâtiments, des ateliers et des objets, les cartes vivantes et l'icône de l'application.</li></ul><p class=\"sourd\">Nouvelle règle : les formats tiennent compte du PC. Un nouveau fond de combat se livre en deux fichiers, portrait et paysage <code>-wide</code>.</p><p><b>Premier lot intégré en v3.573.0</b> (30/10) : les deux pastilles (branchées, l'icône d'armure n'est plus empruntée), les 6 élites et boss, les silhouettes et le cadenas. Puis les cartes vivantes (v3.574.0) et toutes les icônes restantes (v3.575.0). <b>Liste terminée : 58 sur 58.</b></p>"},
  {"id": "ch-pa", "statut": "clos", "titre": "Petites Aventures : bugs et améliorations",
   "html": "<p><b>Liste de Seb (30/10), vérifiée dans le code</b>, en 4 lots, un à la fois :</p><ul><li><b>Lot 1 ✓ fait en v3.576.0</b> (30/10) : la carte bouge à chaque fenêtre (la caméra recentre à chaque ouverture ou changement d'étape, <code>pa2-view.js:898</code>) ; un zoom de départ à ×1,4 pour la découverte (atelier).</li><li><b>Lot 2 ✓ fait en v3.577.0</b> (30/10) : les jets au d20. d20 + stat (+1 tous les 35 points au-delà de 30) + classe (±2 : Chevalier Force/Précision, Rôdeur Précision/Endurance, Mage Endurance/Force) + objets (un cran = +3) − blessures (−2), contre un DD de 8 qui monte avec le monde, la profondeur, l'anneau et l'obstacle ; de justesse à 1-3 points ; 20 et 1 naturels. Affichage : d20 dessiné, « Il faut 9+ · 60 % », détail du jet sur chaque choix. Banc : forte ~78 %, moyenne ~55 %, faible ~44 %. <i>Validé par Seb (30/10) : le double dé (avantage) ; sources à choisir. Prompt d'une petite animation du dé demandé.</i></li><li><b>Lot 3 ✓ fait en v3.578.0</b> (30/10) : tout au dé. Insister (relance d'un jet raté ou de justesse pour 20 de Souffle), avantage au prochain jet après le repos, la ration choisie soigne ×1,5 au feu (53 / 90 / 100 %), jets de qualité sans échec aux sources, autels, repos, cuisine et trouvailles. Banc : KO Périple 27 → 20 %. <b>Gourde ✓ v3.579.0</b> (choix A) : chaque gorgée donne +15 Souffle et l'avantage au prochain jet.</li><li><b>Lot 4 ✓ fait en v3.580.0</b> (30/10) : l'objet de la nuit. Les conditions étaient déjà annoncées avant le départ (v3.469.0) ; désormais l'objet conseillé est renforcé s'il est dans la besace (+1 usage ; torche et armure sans leur défaut) et mis en avant sur la préparation. <b>Chantier terminé.</b></li></ul><p class=\"sourd\">Déjà noté dans l'État des chantiers :</p><ul class=\"sourd\"><li>sur le parcours « Vers le Cœur », les murs ne bougent pas ;</li><li>les approches « charger » et « tenir » reprennent les icônes d'état des ennemis ;</li><li>la besace reprend l'icône de la Sacoche du donjon.</li></ul>"},
  {"id": "ch-village", "statut": "cadrer", "titre": "Évolution du village",
   "html": "<p><i>Noté le 30/10 (lot 4 des Petites Aventures, option C) : faire fabriquer au village la corde, la trousse et la torche (bois, fer), pour relier la préparation des Petites Aventures à l'économie du village.</i></p><p>Il faut d'abord fixer ce que tu veux : de nouveaux bâtiments, de nouveaux niveaux, des usages pour le surplus, ou plus de vie au village. Viendra ensuite un document de conception, comme pour les mondes.</p><p class=\"sourd\">Pistes déjà dans le code ou la doc :</p><ul class=\"sourd\"><li>des niveaux qu'aucun monde ouvert ne permet de construire : Atelier 9-10, Enchanteresse 3, Entrepôt 9-10, Palissade 9-10. C'est relevé en v3.501, à revérifier ;</li><li>l'Outre pleine affiche « Rien pour l'instant : elle servira plus tard » (<code>js/ui/warehouse-view.js:485</code>) ;</li><li>le Grand Ouvrage (v3.561), à juger en jeu ;</li><li>les matières de la Tour, à prévoir avec le chapitre VI.</li></ul>"},
  {"id": "ch-tour", "statut": "cadrer", "titre": "Chapitre VI, la Tour",
   "html": "<p>Aujourd'hui, l'Histoire s'arrête sur « Fin du chapitre 5 ». Le premier livrable serait le document de conception (<code>mondes/tour/Aethervale_Conception_Tour_v0_1.md</code>), sans code.</p><p class=\"sourd\">Déjà décidé :</p><ul class=\"sourd\"><li>le gabarit des actes, QUE-15 option A : ordre varié, contraintes, 2 quêtes autonomes ;</li><li>le donjon 6, qui donne le Légendaire ;</li><li>les images du bestiaire et le fond paysage.</li></ul><p class=\"sourd\">À trancher :</p><ul class=\"sourd\"><li>le récit §VI et le nom Azhem ;</li><li>le combat de la silhouette, qui touchera peut-être le moteur de combat (fichier protégé) ;</li><li>la Question et ses 4 fins ;</li><li>la Mémoire et le Grimoire ;</li><li>ce qui suit la fin.</li></ul>"},
  {"id": "ch-ouvertures", "statut": "cadrer", "titre": "Ouvertures de chapitre (comme le prologue)",
   "html": "<p><b>Option A validée</b> (30/10) : 2 ou 3 planches illustrées, texte lettre à lettre, à la première arrivée dans chaque monde (Désert, Ruines, Crypte, Montagne ; la Tour plus tard). On peut les revoir depuis Quêtes › Histoire, et les parties en cours les voient en arrivant dans leur prochain monde.</p><p class=\"sourd\">Environ 12 scènes, soit 24 images (PC et téléphone). Le composant du prologue est réutilisé. Méthode : un chapitre à la fois, textes validés avant les images, en commençant par le Désert. À suivre peut-être : l'option C (lettre à lettre dans les fenêtres d'étape), et l'option B (les choix pesants), à voir avec la Tour.</p>"},
  {"id": "ch-icone-donjon", "statut": "clos", "titre": "Icône de donjon sur la carte Aventure",
   "html": "<p><b>✓ Fait en v3.582.0</b> (30/10, options A et 1) : badge du donjon au bas de chaque monde de la carte (absent, gris au cadenas, doré, éteint), toucher pour entrer. Reste : l'image <code>dungeon/dungeon_entrance.webp</code> à générer (prompt donné), générique en attendant.</p><p>Un repère visible du donjon de chaque monde sur la carte Aventure.</p><p class=\"sourd\">Aujourd'hui, sur téléphone, la carte du monde ne montre que les mondes. Sur PC, le donjon est une carte de la colonne, avec l'icône <code>dungeon/dungeon_guaranteed_loot.webp</code>, empruntée à l'article « Butin garanti » (image en double, signalée). Il existe des icônes de palier (<code>images/Dungeons/Icone_base/palier2-5.webp</code>) à regarder. À cadrer : la place sur la carte, l'image et l'action au toucher.</p>"},
  {"id": "ch-jours", "statut": "cadrer", "titre": "Les jours de jeu (des cartes vivantes qui bougent)",
   "html": "<p>Idée de Seb (30/10) : un compteur de jours qui avance quand on joue, avec les quêtes et les sorties, pas avec l'heure réelle. Les cartes vivantes reprendraient alors des secteurs avec le temps de jeu. Un joueur qui joue peu n'est pas pénalisé : aucun jour ne passe en son absence.</p><p class=\"sourd\">Constat : aujourd'hui, le Recouvrement ne reprend un secteur que sur l'échec d'un rejeu (<code>living-map-system.js:782</code>), et l'Ascension n'existe plus. Une carte libérée ne bouge donc presque plus.</p><p class=\"sourd\"><b>Rouvre une décision close</b> (Cartes vivantes, 13/09, §3.2 : « pas d'horloge »). Les raisons de l'époque, punir l'absence et le rattrapage au retour, ne valent pas pour un jour de jeu. À trancher : ce qui fait passer un jour (étape d'Histoire, retour au camp, ou les deux) ; ce que fait une nuit (reprise d'un secteur lointain non protégé, frein de la Palissade, peut-être des événements) ; ce qui reste en jours réels (Arbre-mère, colporteur, Apothicaire : recommandé) ; l'affichage (« Jour 34 »). Effort moyen à gros : nouvel état sauvegardé, donc <code>save-system.js</code> (protégé, accord de Seb), et une mesure au banc des cartes.</p><p class=\"sourd\"><b>Le village (question de Seb, 30/10).</b> Passer aussi la production en jours de jeu est écarté dans mon avis. Ça casserait l'idle, puisque celui qui joue peu produirait moins. Ça demanderait de réécrire toute l'économie (83 appels à l'horloge dans 27 systèmes, dont des fichiers protégés). Et ça permettrait de recharger à volonté les plafonds quotidiens. <b>Décision de Seb (30/10) : recommandation suivie</b>, en deux étapes : (1) les cartes vivantes et l'affichage du jour ; (2) si ça prend bien, des événements de village rattachés aux jours (rumeur de Taverne, demande d'un ancien, marché de Sarkel, fêtes). La production et les plafonds quotidiens restent en temps réel.</p>"},
  {"id": "ch-camp", "statut": "cadrer", "titre": "Un camp qui évolue",
   "html": "<p><b>✓ Fait (31/10)</b> : A par les bandeaux illustrés (v3.581.0, un camp par monde) ; onglet « Le feu » et carte du monde dans la barre du bas (v3.594.0, atelier camp-carte, option M3) ; C1 la phrase du soir et C2 le coin du feu (v3.595.0, 88 phrases). Reste : C3, le jour et la nuit, avec « Les jours de jeu ».</p><p><b>Options A et C retenues</b> (30/10). A : une illustration en tête de la page Camp, grande sur PC, qui change à chaque chapitre : cercle de cendres, campement, hameau, village, Aeswyn rebâti (5 scènes, 10 images). C : le camp habité, avec les compagnons restés au camp autour du feu, une phrase du narrateur qui change, et plus tard le jour et la nuit.</p><p class=\"sourd\">Aujourd'hui, le Camp est une page fonctionnelle sans image du camp. À trancher : ce qui fait changer de palier (le chapitre, recommandé, ou le niveau du village). Écartées : B, le camp en calques (risqué avec un générateur), et D, des améliorations à acheter (doublerait le Village). Lié aux ouvertures de chapitre et aux jours de jeu.</p>"},
  {"id": "ch-compagnons", "statut": "cours", "titre": "Parler avec les compagnons",
   "html": "<p><b>En cours (31/10)</b> : cadre validé (conversations au feu pour l'histoire et le monde, une quête personnelle par compagnon et par chapitre, débloquée par une conversation). Mise en page B « la scène » (atelier conversations). Moteur et scène livrés en v3.597.0, sans conversation. 14 quêtes personnelles validées (3 par compagnon, 2 pour Sarkel), chacune avec sa relique unique (tableau validé) ; moteur des quêtes et des reliques livré en v3.598.0. <b>v3.599.0 : tout le contenu est en jeu</b>, intégré avant relecture (accord de Seb) : 27 conversations et 14 quêtes. v3.600.0 : « J'y vais » et le lieu de la quête marqué sur la carte vivante. v3.601.0 : toucher un compagnon ouvre la liste des sujets (souvenirs, avis sur le monde, sa quête ; 30 textes). À venir : T2, ce qu'un compagnon pense d'un autre. Reste : la relecture de Seb dans l'atelier des textes (corrections au fil de l'eau), deux décisions (le frère de Maddoc, trois inventions sur le monde), les 14 icônes de reliques (atelier des images).</p><p>Idée de Seb (30/10) : pouvoir discuter avec les compagnons pour leur donner vie.</p><p class=\"sourd\">Existe déjà : des répliques de combat (arrivée, compétence, K.-O., boss), les dialogues des étapes d'Histoire, les reliques et les Fidélités. Il n'y a aucune conversation à l'initiative du joueur. Le héros ne parle jamais (Bible). Ses réponses seraient donc des gestes dits par le narrateur. Pistes et chiffrage : voir la conversation du 30/10.</p>"},
  {"id": "ch-intro", "statut": "cours", "titre": "Introduction du jeu (l'accroche)",
   "html": "<p>Aujourd'hui, on va de l'écran titre à la création (nom, classe), puis directement au Camp et au tutoriel « Le Campement ». Le seul récit d'ouverture est la phrase de <code>forest_01</code> et le Prologue du Codex, qu'on ne lit pas par défaut.</p><p>Idée : un prologue illustré, fait de planches plein écran avec le texte court du narrateur. On le passe quand on veut, et on peut le revoir.</p><p><b>Option B validée</b> (30/10) : 4 planches avant la création (« Cette nuit-là »), 2 après (« Douze hivers »), puis le Camp. L'option C, la mise en scène animée, viendra peut-être ensuite.</p><p><b>Textes validés</b> (30/10, version fusionnée, phrase 6 de Seb) : <code>systemes/introduction/Aethervale_Prologue_v0_2.md</code>.</p><p><b>Images livrées</b> (30/10) : les 12, converties dans <code>game/images/Prologue/</code> (2,4 Mo).</p><p><b>Codé en v3.570.0</b> (30/10) : fond A, lettre à lettre, vitesse normale, rythme régulier ; « Revoir le prologue » dans Quêtes › Histoire. Contrôles à zéro échec.</p><p><b>Publié</b> (30/10, GitHub Pages, v3.570.0).</p><p class=\"sourd\">Reste : le juger en jeu sur iPhone. L'option C, les animations, viendra plus tard.</p>"}
 ]},

  {"id": "s-doubles", "statut": "signal", "titre": "Images qui servent à deux choses", "html": "<ul><li>Viande et Viande séchée ; Eau et Eau purifiée ;</li><li><code>node_discovery</code>, <code>stat_critical</code> et <code>equipment_shop</code> (tutoriels compris) ;</li><li><code>stat_speed</code>, <code>heal_incoming</code> ;</li><li><code>quests/mission_hunt.webp</code>, qui ne sert plus.</li></ul>"},
  {"id": "s-provisoire", "statut": "signal", "titre": "Valeurs et textes provisoires", "html": "<p>Les gains de la carte des Ruines, les récompenses des étapes 11 à 20, Le seuil (25 %) et le titre de chapitre « La ville rangée ».</p>"},
  {"id": "s-robot", "statut": "signal", "titre": "Robot : une seule caravane", "html": "<p>Le robot n'envoie qu'une caravane. L'or des caravanes multiples n'est donc pas mesuré.</p>"},
  {"id": "s-maquette", "statut": "signal", "titre": "Grand écran : écarts avec la maquette", "html": "<p>La fiche du Village garde les cases du jeu, et le journal de combat n'est pas regroupé par round.</p>"}
 ]},
 {"id": "reportes", "titre": "Reporté", "items": [
  {"id": "r-sons", "statut": "report", "titre": "Sons (PLA-6)", "html": ""},
  {"id": "r-gestes", "statut": "report", "titre": "Gestes d'attaque (piste combat B)", "html": ""},
  {"id": "r-escorte", "statut": "report", "titre": "Escorte et temps limité (QUE-15 option B)", "html": "<p>Possibles plus tard à la Tour.</p>"},
  {"id": "r-csp", "statut": "report", "titre": "Politique de sécurité (CSP)", "html": "<p>À faire s'il y a un jour un serveur de connexion.</p>"},
  {"id": "r-typo", "statut": "report", "titre": "Échelle typographique complète (INT-11 A)", "html": "<p>Écran par écran.</p>"},
  {"id": "r-menage", "statut": "report", "titre": "Nettoyages", "html": "<p>L'ancien code de combat, l'ancien écran Équipement (pour les vieilles sauvegardes), les noms <code>scene-*</code>.</p>"}
 ]},
 {"id": "clos", "titre": "Clos", "items": [
  {"id": "c-difficulte", "statut": "clos", "titre": "Difficulté de la Crypte et de la Montagne (v3.562)", "faitDefaut": "2026-10-30", "html": "<p>Testée en jeu avec un Mage : c'est nettement plus dur, et il faut des potions de force contre le Dragon. C'est l'effet voulu, rien ne change.</p>"},
  {"id": "c-images-192", "statut": "clos", "titre": "Suivi « Images à faire » : 192 sur 192", "faitDefaut": "2026-10-30", "html": "<p>Aucune image n'est absente du jeu. La suite est dans « Images à générer ».</p>"}
 ]}
]
</script>
<script>
(function () {
  var SECTIONS = JSON.parse(document.getElementById("donnees").textContent);
  var STATUT = { cours: "En cours", cadrer: "À cadrer", tester: "À tester", signal: "Signalé", report: "Reporté", clos: "Clos" };
  // État du suivi : ordre par section (liste d'ids) et lignes faites (id -> date)
  var etat = { ordre: {}, fait: {} }, version = 0, db = null, ref = null, masquer = false;
  var $ = function (id) { return document.getElementById(id); };

  SECTIONS.forEach(function (s) { s.items.forEach(function (it) { if (it.faitDefaut) etat.fait[it.id] = it.faitDefaut; }); });

  // Ordre d'une section : celui du suivi, puis les lignes nouvelles à la fin
  function ordonner(s) {
    var o = (etat.ordre[s.id] || []).filter(function (id) { return s.items.some(function (it) { return it.id === id; }); });
    s.items.forEach(function (it) { if (o.indexOf(it.id) < 0) o.push(it.id); });
    return o.map(function (id) { return s.items.filter(function (it) { return it.id === id; })[0]; });
  }

  function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function dateFr(iso) { var p = String(iso).slice(0, 10).split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : ""; }

  function rendre() {
    var h = "";
    SECTIONS.forEach(function (s) {
      var items = ordonner(s), n = items.filter(function (it) { return etat.fait[it.id]; }).length;
      h += '<h2>' + esc(s.titre) + '<small>' + n + ' / ' + items.length + ' faits</small></h2>' + (s.intro ? '<p class="intro sec-intro">' + s.intro + '</p>' : '') + '<div class="section">';
      items.forEach(function (it, i) {
        var on = !!etat.fait[it.id];
        if (masquer && on) return;
        h += '<div class="item' + (on ? ' is-fait' : '') + '">'
          + '<button type="button" class="coche" data-id="' + it.id + '" aria-pressed="' + on + '" aria-label="' + (on ? "Décocher " : "Cocher ") + esc(it.titre) + '">' + (on ? "✓" : "") + '</button>'
          + '<div class="corps"><div class="tete">' + (s.numeros ? '<span class="rang">' + (i + 1) + '.</span>' : '')
          + '<span class="titre">' + esc(it.titre) + '</span><span class="pastille s-' + it.statut + '">' + STATUT[it.statut] + '</span></div>'
          + (on ? '<span class="date">Fait le ' + dateFr(etat.fait[it.id]) + '</span>' : '')
          + (it.html ? '<div class="detail">' + it.html + '</div>' : '') + '</div>'
          + '<div class="fleches"><button type="button" data-s="' + s.id + '" data-i="' + i + '" data-d="-1" aria-label="Monter ' + esc(it.titre) + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>'
          + '<button type="button" data-s="' + s.id + '" data-i="' + i + '" data-d="1" aria-label="Descendre ' + esc(it.titre) + '"' + (i === items.length - 1 ? ' disabled' : '') + '>▼</button></div>'
          + '</div>';
      });
      h += '</div>';
    });
    $("contenu").innerHTML = h;
    $("contenu").querySelectorAll(".coche").forEach(function (b) { b.onclick = function () { basculer(b.dataset.id); }; });
    $("contenu").querySelectorAll(".fleches button").forEach(function (b) { b.onclick = function () { deplacer(b.dataset.s, +b.dataset.i, +b.dataset.d); }; });
  }

  function basculer(id) {
    if (etat.fait[id]) delete etat.fait[id]; else etat.fait[id] = new Date().toISOString().slice(0, 10);
    rendre(); enregistrer();
  }

  function deplacer(sid, i, d) {
    var s = SECTIONS.filter(function (x) { return x.id === sid; })[0], o = ordonner(s).map(function (it) { return it.id; });
    var j = i + d; if (j < 0 || j >= o.length) return;
    var t = o[i]; o[i] = o[j]; o[j] = t; etat.ordre[sid] = o;
    rendre(); enregistrer();
  }

  // Un seul document « suivi/etat » : base de la page, sinon cet appareil
  function enregistrer() {
    var doc = { ordre: etat.ordre, fait: etat.fait, le: new Date().toISOString() };
    if (ref) {
      ref.set(doc).catch(function (e) {
        $("etat").textContent = e && e.code === "invalid_argument" ? "Tu peux consulter cette page, mais pas la modifier." : "Le changement n'a pas été enregistré. Réessaie dans un instant.";
      });
    } else {
      try { localStorage.setItem("feuille-de-route", JSON.stringify(doc)); } catch (e) {}
    }
  }

  // Copie profonde : les données de la base sont figées, on ne peut pas les modifier sur place
  function charger(v) { if (v && typeof v === "object") { v = JSON.parse(JSON.stringify(v)); etat.ordre = v.ordre || {}; etat.fait = v.fait || {}; } }

  function modeLocal() {
    ref = null;
    try { charger(JSON.parse(localStorage.getItem("feuille-de-route") || "null")); } catch (e) {}
    $("etat").textContent = "Suivi enregistré sur cet appareil seulement : je ne pourrai pas le lire.";
    rendre();
  }

  $("b-tout").onclick = function () { masquer = false; this.setAttribute("aria-pressed", "true"); $("b-afaire").setAttribute("aria-pressed", "false"); rendre(); };
  $("b-afaire").onclick = function () { masquer = true; this.setAttribute("aria-pressed", "true"); $("b-tout").setAttribute("aria-pressed", "false"); rendre(); };

  rendre();
  var dispo = window.claude && typeof window.claude.use === "function" ? window.claude.use("db") : Promise.resolve(null);
  dispo.then(function (d) {
    if (!d) return modeLocal();
    db = d; ref = db.collection("suivi").doc("etat");
    ref.onSnapshot(function (snap) {
      if (snap && snap.exists) charger(snap.data());
      $("etat").textContent = "Suivi enregistré : il suit sur tous tes appareils, et je le lis.";
      rendre();
    }, function () { modeLocal(); });
  }, modeLocal);
})();
</script>
