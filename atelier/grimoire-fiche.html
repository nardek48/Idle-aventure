<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche du Grimoire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Atelier « Fiche d'une règle du Grimoire » (demande de Seb du 03/11 : la liste déroulante n'est pas top).
   Données réelles du jeu (v3.653.0) : 17 conditions, 5 actions par classe, contres. Trois variantes à comparer. */
:root {
  --page: #1c140c; --bronze: #b98a4a; --cream-text: #f3e6c4; --gold-a: #f0c64a; --gold-b: #c27f1f;
  --nb-cream: #f6ecd9; --nb-cream-alt: #efe0c2; --nb-cream-deep: #e4cfa0; --nb-frame: #c27f1f; --nb-frame-light: #dcc79c;
  --nb-ink: #3a2c1a; --nb-ink-dim: #6b5d45; --nb-gold-deep: #7c5114; --green: #1e7236; --green-soft: #dcefd8; --blue: #2b5c8a; --blue-soft: #dde9f4;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--nb-ink); font: 15px/1.35 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--page); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; gap: 6px; padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--page); color: var(--cream-text); border-bottom: 1px solid #3a2a18; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > b { font-size: 11px; letter-spacing: .4px; text-transform: uppercase; color: var(--bronze); min-width: 58px; }
.bar button { min-height: 34px; padding: 4px 10px; border-radius: 10px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream-text); font: 600 13px var(--f-ui); }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: var(--nb-ink); border-color: var(--gold-a); }
.note { font-size: 12px; color: #c9b48a; margin: 0; }
main { max-width: 430px; margin: 0 auto; padding: 12px max(12px, env(safe-area-inset-left, 0px)) 120px; }

/* Commun : la fiche */
.back { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 8px 12px; margin-bottom: 10px; border: 2px solid var(--nb-frame); border-radius: 12px;
  background: rgba(246,236,217,.18); color: var(--cream-text); font: 700 15px var(--f-ui); text-align: left; }
.back img { width: 20px; height: 20px; }
.card { padding: 12px; margin-bottom: 10px; border: 2px solid var(--nb-frame); border-radius: 14px; background: var(--nb-cream); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.ttl { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--nb-ink-dim); margin: 0 0 8px; }
.ico { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%; }
.desc { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; color: var(--nb-ink-dim); font-style: italic; font-size: 14px; }
.desc .ico { width: 30px; height: 30px; }
.verdict { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding: 9px 10px; border-radius: 10px; font-size: 14px; border: 1.5px solid var(--nb-frame-light); background: var(--nb-cream-alt); }
.verdict.ok { border-color: #7fb37a; background: var(--green-soft); }
.verdict.fx { border-color: #8fb0d0; background: var(--blue-soft); }
.verdict img { width: 20px; height: 20px; flex: 0 0 auto; }
.aussi { margin: 8px 0 0; font-size: 13px; color: var(--nb-ink-dim); }
.tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.tag.ok { background: var(--green-soft); color: var(--green); border: 1px solid #9cc897; }
.tag.fx { background: var(--blue-soft); color: var(--blue); border: 1px solid #a9c2dc; }
.tag img { width: 13px; height: 13px; }
.empty { color: var(--nb-ink-dim); font-style: italic; }
.clear { width: 100%; min-height: 44px; margin-top: 4px; border: 2px dashed var(--nb-frame); border-radius: 12px; background: transparent; color: var(--cream-text); font: 600 14px var(--f-ui); }

/* Variante A : tuiles sur la fiche */
.grp { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--nb-gold-deep); margin: 10px 0 6px; }
.grp:first-of-type { margin-top: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tile { display: flex; align-items: center; gap: 7px; min-height: 48px; padding: 5px 7px; border: 2px solid var(--nb-frame-light); border-radius: 11px; background: var(--nb-cream-alt);
  color: var(--nb-ink); font: 600 13px/1.2 var(--f-ui); text-align: left; }
.tile .ico { width: 30px; height: 30px; }
.tile[aria-pressed="true"] { border-color: var(--nb-frame); background: #fff6df; box-shadow: 0 0 0 2px var(--gold-a) inset; }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.act { position: relative; display: grid; justify-items: center; gap: 4px; min-height: 84px; padding: 8px 4px 6px; border: 2px solid var(--nb-frame-light); border-radius: 12px; background: var(--nb-cream-alt);
  color: var(--nb-ink); font: 700 12px/1.15 var(--f-ui); text-align: center; }
.act .ico { width: 40px; height: 40px; }
.act[aria-pressed="true"] { border-color: var(--nb-frame); background: #fff6df; box-shadow: 0 0 0 2px var(--gold-a) inset; }
.act .tag { position: absolute; top: -8px; right: 4px; }
.foldbtn { margin-top: 8px; width: 100%; min-height: 36px; border: 1.5px solid var(--nb-frame-light); border-radius: 10px; background: transparent; color: var(--nb-gold-deep); font: 700 13px var(--f-ui); }

/* Variante B : la phrase, et une feuille de choix */
.phrase { display: grid; gap: 8px; }
.pick { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 58px; padding: 8px 10px; border: 2px solid var(--nb-frame); border-radius: 12px; background: var(--nb-cream-alt);
  color: var(--nb-ink); font: 700 15px/1.2 var(--f-ui); text-align: left; }
.pick .lab { flex: 1; min-width: 0; }
.pick small { display: block; font: 600 11px var(--f-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--nb-ink-dim); margin-bottom: 2px; }
.pick .chev { color: var(--nb-gold-deep); font-size: 20px; }
.arrow { text-align: center; color: var(--nb-gold-deep); font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.sheet-bd { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 78vh; overflow: auto; padding: 8px 12px calc(16px + env(safe-area-inset-bottom, 0px)); border-radius: 18px 18px 0 0;
  background: var(--nb-cream); border-top: 3px solid var(--nb-frame); }
.sheet .handle { width: 40px; height: 5px; border-radius: 3px; background: var(--nb-frame-light); margin: 2px auto 8px; }
.sheet h3 { margin: 0 0 8px; font-size: 16px; }
.opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 8px; margin-bottom: 6px; border: 2px solid var(--nb-frame-light); border-radius: 12px; background: var(--nb-cream-alt);
  color: var(--nb-ink); font: 14px/1.3 var(--f-ui); text-align: left; }
.opt b { display: block; font-size: 15px; }
.opt span.d { display: block; color: var(--nb-ink-dim); font-size: 13px; margin-top: 2px; }
.opt[aria-pressed="true"] { border-color: var(--nb-frame); background: #fff6df; box-shadow: 0 0 0 2px var(--gold-a) inset; }
.opt .tag { margin-left: 4px; vertical-align: 1px; }
</style>
</head>

var st = { v: "C", c: "knight", cond: "chargeIncoming", act: "skill2", sheet: null, foldA: false };
function el(h) { var d = document.createElement("div"); d.innerHTML = h; return d; }
function img(p, cls) { return '<img class="' + (cls == null ? "ico" : cls) + '" src="' + (ICONS[p] || "") + '" alt="">'; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function cond(id) { return DATA.conds.filter(function (c) { return c.id === id; })[0] || null; }
function acts() { return DATA.classes[st.c]; }
function act(slot) { return acts().filter(function (a) { return a.slot === slot; })[0] || null; }
function kind(a, cid) { if (!a || !cid) return null; if (a.annule.indexOf(cid) >= 0) return "ok"; if (a.contre.indexOf(cid) >= 0) return "fx"; return null; }
function tag(k) { return k === "ok" ? '<span class="tag ok">' + img("images/Icons/combat_status/counter.webp", "") + 'Contre</span>' : k === "fx" ? '<span class="tag fx">Effet</span>' : ""; }

function verdictHTML() {
  var a = act(st.act), c = cond(st.cond);
  if (!a || !c) return "";
  var k = kind(a, st.cond), h;
  if (k === "ok") h = '<div class="verdict ok">' + img("images/Icons/combat_status/counter.webp", "") + '<span><b>Contre parfait.</b> Cette action annulera complètement l\'attaque adverse si elle est jouée à temps.</span></div>';
  else if (k === "fx") h = '<div class="verdict fx">' + img("images/Icons/system/ascension.webp", "") + '<span><b>Effet spécial.</b> Cette action agit sur cette situation en plus de ses dégâts normaux.</span></div>';
  else h = '<div class="verdict"><span>○</span><span>Cette action ne contre pas cette situation, elle sera simplement jouée en priorité.</span></div>';
  var autres = a.contre.filter(function (x) { return x !== st.cond; }).map(function (x) { return cond(x).label; });
  if (autres.length) h += '<p class="aussi">' + a.label + ' contre aussi : ' + autres.join(", ") + '.</p>';

}
function condDescHTML() { var c = cond(st.cond); return c ? '<div class="desc">' + img(c.icon) + '<span>' + c.desc + '</span></div>' : ""; }
function actDescHTML() { var a = act(st.act); return a ? '<div class="desc">' + img(a.icon) + '<span>' + a.desc + '</span></div>' : ""; }

function condTilesHTML() {
  var h = "";
  GROUPES.forEach(function (g, gi) {
    if (st.v === "A" && st.foldA && gi > 0 && g.ids.indexOf(st.cond) < 0) return;
    h += '<div class="grp">' + g.t + '</div><div class="tiles">';
    g.ids.forEach(function (id) { var c = cond(id); if (!c) return; h += '<button type="button" class="tile" data-cond="' + id + '" aria-pressed="' + (st.cond === id) + '">' + img(c.icon) + '<span>' + cap(c.court) + '</span></button>'; });

}
function actTilesHTML() {

  else if (t.dataset.close) st.sheet = null;
  else if (t.dataset.fold) st.foldA = !st.foldA;
  else if (t.dataset.cond) { st.cond = t.dataset.cond; if (st.sheet) st.sheet = null; }
  else if (t.dataset.act) { st.act = t.dataset.act; if (st.sheet) st.sheet = null; }
  else return;
  render();
});
render();
</script>
