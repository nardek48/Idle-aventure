<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campement du Sanctuaire</title>
<style>
/* Atelier v3.429.23 : feuille du campement du Sanctuaire scellé (RU13, acte III des Ruines). Couleurs = jetons du jeu (css/00-tokens.css). */
:root {
  --bronze: #b98a4a; --cream: #f3e6c4; --ink: #3a2c1a; --ink-dim: #6b5a40; --brown: #8a5c14; --accent: #c27f1f;
  --gold-a: #f0c64a; --gold-b: #c27f1f; --card: rgba(251, 245, 232, .9); --card-bd: #dcc79c; --head-ink: #f4e9d0;
  --hp: #2f8a46; --hp-low: #b4560f; --page: #1c140c; --nav: #2a1f14; --nav-h: 86px; --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
/* Barre de l'atelier (hors jeu) : états à tester */
.bar { position: sticky; top: 0; z-index: 950; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px; background: #000; color: var(--cream); }
.bar b { font-size: 12px; margin-right: auto; }
.bar button { min-height: 32px; padding: 3px 10px; border-radius: 9px; border: 1.5px solid var(--bronze); background: transparent; color: var(--cream); font: inherit; font-size: 12px; font-weight: 700; }
.bar button[aria-pressed="true"] { background: linear-gradient(var(--gold-a), var(--gold-b)); color: #2e2214; }
/* Fond : l'écran de combat du Sanctuaire, figé derrière la feuille */
.scene { position: fixed; inset: 0; background: center / cover no-repeat; }
.scene .hud { position: absolute; left: 16px; right: 16px; top: calc(60px + env(safe-area-inset-top, 0px)); padding: 8px 12px; border-radius: 12px; background: rgba(16, 12, 8, .8); color: var(--head-ink); font-weight: 800; text-align: center; }
.scene .hud small { display: block; font-weight: 600; opacity: .8; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: var(--nav); color: var(--cream); font-size: 12px; font-weight: 700; text-align: center; }
/* Feuille basse (.ksheet du jeu) */
.veil { position: fixed; inset: 0; z-index: 900; background: rgba(12, 8, 5, .62); }
.ksheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 901; max-height: 84vh; display: flex; flex-direction: column; padding-bottom: calc(14px + var(--safe-b)); border-radius: 18px 18px 0 0; background: linear-gradient(rgba(246, 236, 217, .55), rgba(239, 224, 194, .4)), var(--parch) 0 0 / 300px, #efe0c2; box-shadow: 0 -10px 30px rgba(0, 0, 0, .55); }
.khead { position: relative; flex: none; padding: 8px 16px 12px; border-bottom: 2px solid var(--accent); border-radius: 18px 18px 0 0; background: linear-gradient(rgba(16, 12, 8, .78), rgba(16, 12, 8, .9)), var(--stone) 0 0 / 256px, #1b1510; color: var(--head-ink); }
.khead::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg); background: linear-gradient(135deg, #ffe08a, #c27f1f 60%, #8a5c14); border: 1px solid #5a3a0c; }
.handle { width: 44px; height: 5px; margin: 0 auto 8px; border-radius: 99px; background: currentColor; opacity: .28; }
.ktitle { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; }
.ktitle img { width: 32px; height: 32px; }
.ksub { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 600; opacity: .8; }
.kbody { flex: 1 1 auto; overflow-y: auto; padding: 16px 16px 6px; }
.kfoot { flex: none; padding: 8px 16px 0; }
.quote { margin: 0 0 12px; font-style: italic; color: var(--ink-dim); line-height: 1.35; }
.lbl { margin: 14px 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--brown); }
.card { padding: 10px 12px; border: 1.5px solid var(--card-bd); border-radius: 14px; background: var(--card); }
/* Le groupe et ses PV */
.who { display: grid; grid-template-columns: 40px 1fr auto; gap: 4px 10px; align-items: center; }
.who + .who { margin-top: 8px; }
.ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: top; border: 2px solid var(--bronze); background: #2a1f14; }
.ava.hero { display: grid; place-items: center; color: var(--cream); font-weight: 800; font-size: 12px; }
.who b { font-size: 14px; }
.pv { grid-column: 2 / 4; height: 9px; border-radius: 6px; background: rgba(107, 74, 34, .2); overflow: hidden; }
.pv i { display: block; height: 100%; border-radius: 6px; background: var(--hp); transition: width .35s; }
.pv i.low { background: var(--hp-low); }
.pv i.gain { background: linear-gradient(90deg, var(--hp) var(--from), #8fd19e var(--from)); }
.num { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; color: var(--ink-dim); }
.num em { font-style: normal; color: var(--hp); }
/* Butin de l'étape 1 */
.loot { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; }
.loot span { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 700; }
.loot img { width: 22px; height: 22px; flex: none; }
.loot .full { grid-column: 1 / 3; }
.rare { color: #2563c9; }
/* Les trois actions : une seule */
.opt { cursor: pointer; display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px; width: 100%; margin-bottom: 8px; padding: 10px 12px; border: 2px solid var(--card-bd); border-radius: 14px; background: var(--card); color: var(--ink); font: inherit; text-align: left; }
.opt img { grid-row: 1 / 3; width: 34px; height: 34px; align-self: center; }
.opt b { font-size: 15px; }
.opt span { font-size: 13px; color: var(--ink-dim); line-height: 1.3; }
.opt[aria-checked="true"] { border-color: var(--accent); background: linear-gradient(#fff6dc, #f7e6b8); box-shadow: 0 0 0 2px rgba(240, 198, 74, .45); }
.opt .eff { grid-column: 2; margin-top: 4px; font-size: 13px; font-weight: 800; color: var(--brown); }
/* Choix des compagnons (dans l'option « Changer ») */
.swap { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.swap button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 76px; padding: 6px 2px; border: 1.5px solid var(--card-bd); border-radius: 12px; background: #fbf3e4; font: inherit; font-size: 12px; font-weight: 800; color: var(--ink); }
.swap button img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: top; border: 2px solid var(--card-bd); }
.swap button[aria-pressed="true"] { border-color: var(--accent); background: linear-gradient(#fff6dc, #f7e6b8); }
.swap button[aria-pressed="true"] img { border-color: var(--accent); }
.swap small { font-weight: 600; color: var(--ink-dim); }
.next { margin-top: 4px; font-size: 13px; color: var(--ink-dim); line-height: 1.35; }
.go { width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: linear-gradient(var(--gold-a), var(--gold-b)); color: #2e2214; font: inherit; font-size: 16px; font-weight: 800; box-shadow: 0 3px 0 #8a5c14; }
.go:disabled { opacity: .45; box-shadow: none; }
.go.out { background: linear-gradient(#e2d1ae, #b98a4a); }
/* Résultat (simulation) */
.done { position: fixed; inset: 0; z-index: 960; display: none; place-items: center; padding: 16px; background: rgba(12, 8, 5, .75); }
.done.on { display: grid; }
.done .card { max-width: 380px; text-align: center; }
.done p { margin: 6px 0 12px; line-height: 1.4; }
</style>
</head>

// Héros et compagnons : PV courants / max (deux profils de test via la barre de l'atelier)
var C = { wenna: { n: "Wenna", r: "soigne" }, maddoc: { n: "Maddoc", r: "tient, frappe de loin" }, edda: { n: "Edda", r: "achève ceux qui se relèvent" } };
var HEAL = 0.4; // Souffler : part des PV max rendue (provisoire, au banc)
var S;
function reset() {
  var low = document.getElementById("b-pv").getAttribute("aria-pressed") !== "true";
  var edda = document.getElementById("b-eng").getAttribute("aria-pressed") === "true";
  S = {
    pick: null,
    hero: { hp: low ? 142 : 318, max: 380 },
    hp: { wenna: low ? 60 : 150, maddoc: low ? 95 : 210, edda: low ? 70 : 170 },
    max: { wenna: 180, maddoc: 240, edda: 200 },
    party: edda ? ["edda", "maddoc"] : ["wenna", "maddoc"],
    newParty: null
  };
  S.newParty = S.party.slice();
  render();
}
function pct(a, b) { return Math.round(a / b * 100); }
function bar(hp, max, gain) {
  // Avec un soin prévu : la barre va jusqu'aux PV d'après, la part regagnée en vert clair
  var p = pct(hp, max);
  if (!gain) return '<div class="pv"><i class="' + (p < 35 ? "low" : "") + '" style="width:' + p + '%"></i></div>';
  var a = Math.min(100, pct(Math.min(max, hp + gain), max));
  return '<div class="pv"><i class="gain" style="width:' + a + '%;--from:' + Math.round(p / a * 100) + '%"></i></div>';
}
function row(img, name, hp, max, gain, hero) {
  var after = gain ? Math.min(max, hp + gain) : hp;
  return '<div class="who">' + (hero ? '<span class="ava hero">Toi</span>' : '<img class="ava" src="' + img + '" alt="">')
    + '<b>' + name + '</b><span class="num">' + (gain ? pct(hp, max) + ' % → <em>' + pct(after, max) + ' %</em>' : pct(hp, max) + ' %') + '</span>'
    + bar(hp, max, gain) + '</div>';
}
function render() {
  var heal = S.pick === "souffler";
  var h = '<p class="quote">Des lits de pierre, trop courts pour Maddoc. Tu fais du feu. La fumée monte droit, par un trou percé exprès pour elle.</p>';
  h += '<div class="lbl">Le groupe</div><div class="card">';
  h += row(null, "Toi", S.hero.hp, S.hero.max, heal ? Math.round(S.hero.max * HEAL) : 0, true);
  var shown = S.pick === "changer" ? S.newParty : S.party;
  shown.forEach(function (id) {
    var fresh = S.party.indexOf(id) === -1;
    var hp = fresh ? S.max[id] : S.hp[id];
    h += row(I[id], C[id].n + (fresh ? ' <small class="num">· frais</small>' : ''), hp, S.max[id], heal ? Math.round(S.max[id] * HEAL) : 0);
  });
  h += '</div>';
  h += '<div class="lbl">Butin de l’étape 1</div><div class="card loot">'
    + '<span><img src="' + I.gold + '" alt="">+1 240 or</span><span><img src="' + I.shard + '" alt="">+12 Éclats</span>'
    + '<span><img src="' + I.stone + '" alt="">+2 Pierres errantes</span><span><img src="' + I.loot + '" alt=""><span class="rare">Jambières de garde</span></span>'
    + '</div>';
  h += '<div class="lbl">Une seule action</div>';
  h += opt("souffler", I.heart, "Souffler", "Le groupe reprend " + Math.round(HEAL * 100) + " % de ses PV.", heal ? "Puis la descente reprend." : "");
  var sw = '';
  if (S.pick === "changer") {
    sw = '<div class="swap">' + ["wenna", "maddoc", "edda"].map(function (id) {
      var on = S.newParty.indexOf(id) !== -1;
      return '<button type="button" data-c="' + id + '" aria-pressed="' + on + '"><img src="' + I[id] + '" alt="">' + C[id].n + '<small>' + C[id].r + '</small></button>';
    }).join("") + '</div>';
  }
  h += opt("changer", I[otherOf()], "Changer de compagnon", "Deux sur trois, selon ce qui attend en bas. Celui qui arrive est frais.", swapText(), sw);
  h += opt("sortir", I.fire, "Sortir", "Tu remontes avec le butin de l’étape 1. Il est à toi.", S.pick === "sortir" ? "La sortie s’arrête là : Varrek attendra." : "");
  h += '<p class="next">En bas : vagues 9 à 15, le Golem, puis Varrek. Tomber en bas ne coûte que le butin d’en bas.</p>';
  document.getElementById("body").innerHTML = h;
  var go = document.getElementById("go");
  var changed = S.newParty.join() !== S.party.join();
  go.disabled = !S.pick || (S.pick === "changer" && (!changed || S.newParty.length !== 2));
  go.className = "go" + (S.pick === "sortir" ? " out" : "");
  go.textContent = !S.pick ? "Choisis une action"
    : S.pick === "souffler" ? "Souffler, puis descendre"
    : S.pick === "changer" ? (S.newParty.length !== 2 ? "Choisis deux compagnons" : changed ? "Changer, puis descendre" : "Choisis qui vient")
    : "Remonter avec le butin";
}
function otherOf() { return ["wenna", "maddoc", "edda"].filter(function (id) { return S.party.indexOf(id) === -1; })[0]; }
function swapText() {
  if (S.pick !== "changer") return "";
  var inn = S.newParty.filter(function (id) { return S.party.indexOf(id) === -1; });
  var out = S.party.filter(function (id) { return S.newParty.indexOf(id) === -1; });
  if (S.newParty.length !== 2) return "Touche deux compagnons.";
  if (!inn.length) return "Touche celui qui reste au feu, puis celui qui vient.";
  return C[inn[0]].n + " descend, " + C[out[0]].n + " garde le feu.";
}
function opt(id, img, t, d, eff, extra) {
  // div et non button : la grille des compagnons contient ses propres boutons
  return '<div class="opt" role="radio" tabindex="0" data-o="' + id + '" aria-checked="' + (S.pick === id) + '"><img src="' + img + '" alt=""><b>' + t + '</b><span>' + d + '</span>'
    + (eff ? '<span class="eff">' + eff + '</span>' : '') + (extra || '') + '</div>';
}
document.getElementById("body").addEventListener("click", function (e) {
  var c = e.target.closest("[data-c]");
  if (c) {
    e.stopPropagation();
    var id = c.getAttribute("data-c"), i = S.newParty.indexOf(id);
    if (i !== -1) S.newParty.splice(i, 1); else if (S.newParty.length < 2) S.newParty.push(id);
    render(); return;
  }
  var o = e.target.closest("[data-o]");
  if (!o) return;
  S.pick = o.getAttribute("data-o");
  if (S.pick !== "changer") S.newParty = S.party.slice();
  render();
});
document.getElementById("go").addEventListener("click", function () {
  var t = { souffler: ["La descente reprend", "Le groupe a soufflé. Vague 9."],
    changer: ["La descente reprend", swapText() + " Vague 9."],
    sortir: ["Tu remontes", "Le butin de l’étape 1 est à toi. La sortie du jour est comptée."] }[S.pick];
  document.getElementById("d-t").textContent = t[0];
  document.getElementById("d-p").textContent = t[1];
  document.getElementById("done").classList.add("on");
});
document.getElementById("d-ok").addEventListener("click", function () { document.getElementById("done").classList.remove("on"); reset(); });
["b-pv", "b-eng"].forEach(function (id) {
  document.getElementById(id).addEventListener("click", function () {
    this.setAttribute("aria-pressed", this.getAttribute("aria-pressed") === "true" ? "false" : "true"); reset();
  });
});
document.getElementById("b-reset").addEventListener("click", reset);
document.getElementById("scene").style.backgroundImage = "linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)), url(" + I.bg + ")";
document.getElementById("i-fire").src = I.fire;
document.documentElement.style.setProperty("--parch", "url(" + I.parch + ")");
document.documentElement.style.setProperty("--stone", "url(" + I.stoneTile + ")");
reset();
</script>
