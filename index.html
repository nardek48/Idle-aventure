<div id="tab-bar">
  <button class="tab-btn active" data-tab="campement" onclick="switchTab('campement')">
    <img src="./images/Icons/menu_icons/camp_menu.png" alt="" class="tab-icon-img">
    <span>Campement</span>
  </button>

  <button class="tab-btn" data-tab="combat" onclick="switchTab('combat')">
    <img src="./images/Icons/menu_icons/combat_menu.png" alt="" class="tab-icon-img">

  </button>

  <button class="tab-btn" data-tab="village" onclick="switchTab('village')">
    <img src="./images/Icons/menu_icons/village_menu.png" alt="" class="tab-icon-img">
    <span>Village</span>
  </button>

  <button class="tab-btn" data-tab="more" onclick="switchTab('more')">
    <img src="./images/Icons/menu_icons/heroes_menu.png" alt="" class="tab-icon-img">
    <span>Héros</span>
  </button>

  <button class="tab-btn" data-tab="menu" onclick="openFullMenu()">
    <img src="./images/Icons/menu_icons/menu_menu.png" alt="" class="tab-icon-img">
    <span>Menu</span>
    <span class="tab-badge" id="quest-badge" style="display:none"></span>
  </button>
</div>

<div id="offline-modal">
  <div class="offline-card">
    <div class="offline-icon">😴</div>
    <div class="offline-title">Bienvenue !</div>
    <div class="offline-time" id="offline-time">Absent depuis 0m</div>
    <div class="offline-rewards" id="offline-rewards"></div>
    <button class="offline-btn" onclick="closeOfflineModal()">Récupérer les récompenses</button>
  </div>
</div>

<div id="confirm-modal">
  <div class="confirm-card">
    <div class="confirm-icon" id="confirm-icon">🌀</div>
    <div class="confirm-title" id="confirm-title">Confirmer</div>
    <div class="confirm-text" id="confirm-text"></div>
    <div class="confirm-buttons">
      <button class="confirm-btn cancel" onclick="closeConfirmModal(false)">Annuler</button>
      <button class="confirm-btn ok" onclick="closeConfirmModal(true)">Confirmer</button>
    </div>
  </div>
</div>

<div id="pwa-boot-gate">
  <div class="pwa-boot-gate-inner">
    <div class="pwa-boot-spinner"></div>
    <div class="pwa-boot-gate-text">Préparation du jeu…</div>
  </div>
</div>
<script>
  // Affichage synchrone IMMÉDIAT (avant même que le reste du body ne
  // finisse de se parser/afficher) si ce chargement n'a pas encore de
  // service worker actif — évite tout flash visuel du jeu "brut" avant
  // que js/main/pwa.js (chargé beaucoup plus bas) ne prenne le relais
  // pour la fermeture du voile. Volontairement minimal et autonome,
  // sans dépendance au reste du jeu.
  if (window.navigator && "serviceWorker" in navigator && !navigator.serviceWorker.controller) {
    document.getElementById("pwa-boot-gate").classList.add("show");
  }
</script>

<div id="toast"></div>
<div id="pwa-update-banner">
  <span>Nouvelle version disponible.</span>
  <button type="button" onclick="reloadForPwaUpdate()">Recharger</button>
</div>
