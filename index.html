        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<body>
<div id="hud">
  <div class="hud-resources">
    <span class="resource-badge gold"><span class="icon">💰</span><span id="hud-gold">0</span></span>
    <span class="resource-badge essence"><span class="icon">🔮</span><span id="hud-essence">0</span></span>
    <span class="resource-badge aether"><span class="icon">🌀</span><span id="hud-aether">0</span></span>
  </div>

  <div class="hud-zone">
    <div class="zone-name" id="hud-zone-name">Forêt</div>
    <div id="hud-adventure-name">Lisière</div>
  </div>

  <div class="hud-hero-xp">
    <div class="hud-hero-xp-top">
      <span id="hud-hero-level">Niv. 1</span>
      <span id="hud-hero-xp-text">0 / 10 XP</span>
    </div>
    <div class="hud-hero-xp-bar">
      <div id="hud-hero-xp-fill" class="hud-hero-xp-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="hud-hero-hp">
    <div class="hud-hero-hp-top">
      <span>❤️ PV</span>
      <span id="hud-hero-hp-text">10 / 10</span>
    </div>
    <div class="hud-hero-hp-bar">
      <div id="hud-hero-hp-fill" class="hud-hero-hp-fill" style="width:100%"></div>
    </div>
  </div>
</div>

<div id="game-area">
  <div id="zone-banner">⚔️ Tappe l'ennemi pour attaquer !</div>
  <div id="enemy-display">
    <div id="enemy-emoji" onclick="playerAttack()">🟢</div>
    <div id="enemy-name">Slime</div>
    <div id="enemy-affinity"></div>
    <div id="enemy-hp-bar-wrapper">
      <div id="enemy-hp-bar" style="width:100%"></div>
      <div id="enemy-hp-text">10 / 10</div>
    </div>
    <div class="enemy-counter" id="enemy-counter">Kills: 0</div>
  </div>
</div>

<div id="stats-bar">
  <div class="stat-item"><span class="stat-label">⚡ Dégâts/Tap</span><span class="stat-value" id="stat-tap-dmg">1</span></div>
  <div class="stat-item"><span class="stat-label">🔁 Auto DPS</span><span class="stat-value" id="stat-auto-dps">0</span></div>
  <div class="stat-item"><span class="stat-label">🎯 Critique</span><span class="stat-value" id="stat-crit">5%</span></div>
  <div class="stat-item"><span class="stat-label">🎯 Dégâts crit.</span><span class="stat-value" id="stat-crit-percent">x2.00</span></div>
  <div class="stat-item"><span class="stat-label">🌀 Aether</span><span class="stat-value" id="stat-aether-mult">x1.00</span></div>
  <div class="stat-item"><span class="stat-label">💰 Or</span><span class="stat-value" id="stat-gold-mult">x1.00</span></div>
</div>

<div id="panel-container"></div>

<div id="tab-bar">
  <button class="tab-btn active" data-tab="combat" onclick="switchTab('combat')">
    <img src="./images/Icons/combat_menu.png" alt="" class="tab-icon-img">
    <span>Combat</span>
  </button>

  <!-- Emplacement réservé : futurs boutons d'attaque spéciale -->
  <div id="tab-bar-special-slot"></div>

  <button class="tab-btn" data-tab="menu" onclick="openFullMenu()">
    <span class="tab-icon">☰</span>
    <span>Menu</span>
    <span class="tab-badge" id="quest-badge" style="display:none"></span>
  </button>
</div>

<div id="full-menu-root"></div>


<div id="offline-modal">
  <div class="offline-card">
    <div class="offline-icon">😴</div>
    <div class="offline-title">Bienvenue !</div>
    <div class="offline-time" id="offline-time">Absent depuis 0m</div>
    <div class="offline-rewards" id="offline-rewards"></div>
    <button class="offline-btn" onclick="closeOfflineModal()">Récupérer les récompenses</button>
  </div>
</div>

<div id="confirm-modal">
  <div class="confirm-card">
    <div class="confirm-icon" id="confirm-icon">🌀</div>
    <div class="confirm-title" id="confirm-title">Confirmer</div>
    <div class="confirm-text" id="confirm-text"></div>
    <div class="confirm-buttons">
      <button class="confirm-btn cancel" onclick="closeConfirmModal(false)">Annuler</button>
      <button class="confirm-btn ok" onclick="closeConfirmModal(true)">Confirmer</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="hero-selection-root"></div>
