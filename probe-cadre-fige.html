<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonde — cadre à haut figé (proposition Seb)</title>
<link rel="stylesheet" href="./css/00-tokens.css">
<link rel="stylesheet" href="./css/00-components.css">
<link rel="stylesheet" href="./css/00-rframe.css">
<link rel="stylesheet" href="./css/00-kbtn.css">
<link rel="stylesheet" href="./css/00-kgauge.css">
<link rel="stylesheet" href="./css/00-kframe-scope.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 12px 8px 30px; background: #241a10; font-family: system-ui, sans-serif; }
.lbl { color: #d9c49a; font-size: 11px; margin: 10px auto 4px; max-width: 400px; }

/* ============================================================
   SONDE .pcf (page cadre figé) — proposition Seb 08/09/2026 :
   - CAP HAUT FIGÉ hors scroll, TITRE dans sa zone vide (60 % bas,
     centre libre à ~90 %) -> toujours visible, zone morte devenue utile.
   - SEUL LE RESTE SCROLLE : corps avec remplissage + rails continus.
   - CAP BAS FLOTTANT en fin de contenu : sa barre (20 % inf.) en
     surcouche, le contenu descend dans ses 80 % vides -> ~54 px rendus.
   Raccord haut = statique (cap et corps portent chacun leur fill,
   même couleur/texture) — pas de couture mobile.
   ============================================================ */
.pcf {
  max-width: 400px;
  margin: 0 auto;
  height: 560px;              /* simule la hauteur de page dispo */
  display: flex;
  flex-direction: column;
  position: relative;
  isolation: isolate;
  color: #f4e9d0;
  --kf-fill: #1c2318;
}

/* --- cap haut figé --- */
.pcf-top {
  flex: 0 0 auto;
  position: relative;
  aspect-ratio: 1604 / 269;
  isolation: isolate;
}
.pcf-top::before {
  content: "";
  position: absolute; z-index: -1;
  left: 3.45%; right: 3.45%;
  top: 28%; bottom: 0;
  background-color: var(--kf-fill);
  background-image: url('images/UI/textures/bg-moss-stone.png');
  background-size: 256px 256px; background-repeat: repeat;
}
.pcf-top::after {
  content: "";
  position: absolute; inset: 0; z-index: 1;
  background: url('images/UI/frames/page/Cadre_Haut.png') center / 100% 100% no-repeat;
  pointer-events: none;
}
.pcf-title {
  position: absolute;
  left: 12%; right: 12%;
  top: 36%; bottom: 6%;
  z-index: 2;
  display: flex; align-items: center; justify-content: center;
  font-size: 14.5px; font-weight: 800; letter-spacing: 0.6px;
  color: #ffe9b0;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* --- zone scrollable : remplissage + rails continus, cap bas flottant --- */
.pcf-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}
.pcf-body {
  position: relative;
  isolation: isolate;
  padding: 6px 6.5% 5.2%;     /* bas : barre (3,43 %) + air */
}
.pcf-body::before {
  content: "";
  position: absolute; z-index: -1;
  left: 3.45%; right: 3.45%;
  top: -1px; bottom: 6px;      /* la barre basse opaque couvre le raccord */
  background-color: var(--kf-fill);
  background-image: url('images/UI/textures/bg-moss-stone.png');
  background-size: 256px 256px; background-repeat: repeat;
}
.pcf-body::after {
  content: "";
  position: absolute; inset: 0; z-index: 1;
  background: url('images/UI/frames/page/Cadre_Milieux.png') center / 100% 100% no-repeat;
  pointer-events: none;
}
.pcf-bot {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 2;
  aspect-ratio: 1604 / 275;
  background: url('images/UI/frames/page/Cadre_Bas.png') center / 100% 100% no-repeat;
  pointer-events: none;
}
.pcf-content { position: relative; z-index: 0; }

/* contenu de démo */
.demo-row {
  border: 1px solid #b98a4a; border-radius: 9px;
  background: #f6ecd9; color: #3a2c1a;
  font-size: 12px; font-weight: 700;
  padding: 9px 10px; margin-bottom: 7px;
}
</style>
</head>
<body>

<p class="lbl">Cap haut FIGÉ + titre · seul le corps scrolle · cap bas flottant en fin de contenu (scroller pour voir)</p>
<div class="pcf">
  <div class="pcf-top"><span class="pcf-title">📜 Quêtes</span></div>
  <div class="pcf-scroll">
    <div class="pcf-body">
      <div class="pcf-content" id="rows"></div>
      <span class="pcf-bot"></span>
    </div>
  </div>
</div>

<script>
var h = '';
for (var i = 1; i <= 18; i++) h += '<div class="demo-row">Ligne de contenu ' + i + ' — elle passe SOUS la barre du titre en scrollant</div>';
document.getElementById('rows').innerHTML = h;
</script>
</body>
</html>
