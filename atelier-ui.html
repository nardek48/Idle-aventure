<title>Aethervale — Atelier UI</title>

<!-- =====================================================================
     ATELIER UI (v3.163.0) — galerie de contrôle des composants.

     PRINCIPE : cette page charge les MÊMES feuilles CSS que le jeu, dans
     le MÊME ordre (copie de index.html), et affiche chaque composant du
     chantier or/bronze dans TOUS ses états, avec le markup EXACT généré
     par le JS du jeu (référence du builder source en commentaire au-dessus
     de chaque spécimen). Ce que tu vois ici est donc le rendu réel de ton
     navigateur — le filet de contrôle qui manquait au chantier.

     RÈGLE DE MAINTENANCE : si un builder JS change la structure HTML d'un
     composant listé ici, le spécimen correspondant doit être mis à jour
     dans la même livraison (sinon l'atelier ment).

     Les seuls styles propres à cette page sont préfixés "atl-" (chrome de
     la galerie : titres, sélecteur de largeur...) et une neutralisation
     documentée du layout plein-écran de body — AUCUN style de composant
     du jeu n'est redéfini ici.
     ===================================================================== -->

<style>
/* ===== Chrome de l'atelier (préfixe atl-, ne touche pas aux composants) ===== */

/* Neutralisation DOCUMENTÉE du layout plein-écran du jeu : body est en
   flex column + overflow:hidden (01-base.css) pour l'app ; l'atelier est
   une page qui scrolle. On ne touche qu'au layout de page, pas au fond
   ni à la typo (qui restent ceux du jeu). */
body.atl-body {
  display: block;
  overflow: auto;
  height: auto;
  padding: 16px 12px 60px;
  -webkit-user-select: text;
  user-select: text; /* pouvoir copier les libellés/notes de l'atelier */
}

.atl-header {
  max-width: 700px;
  margin: 0 auto 14px;
  color: #f4e9d0;
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}
.atl-header h1 { font-size: 20px; margin: 0 0 4px; }
.atl-header p { font-size: 12px; margin: 0; opacity: 0.85; line-height: 1.5; }

/* Sélecteur de largeur simulée */
.atl-widths {
  max-width: 700px;
  margin: 0 auto 18px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.atl-widths button {
  padding: 6px 12px;
  border: 1px solid rgba(244,233,208,0.4);
  border-radius: 999px;
  background: rgba(0,0,0,0.35);
  color: #f4e9d0;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.atl-widths button.is-active {
  background: #c27f1f;
  border-color: #f0c85a;
  color: #241a00;
}

/* Le "téléphone" : simule #panel-container du jeu (max-width 390px,
   padding 12px, voir css/02-layout.css) — la largeur est pilotée par le
   sélecteur ci-dessus via --atl-w. */
.atl-stage {
  width: var(--atl-w, 390px);
  max-width: 100%;
  margin: 0 auto;
}
.atl-panel-sim {
  width: 100%;
  padding: 0 12px; /* même padding horizontal que #panel-container */
}

.atl-section {
  margin: 0 0 26px;
}
.atl-section > h2 {
  font-size: 14px;
  margin: 0 0 2px;
  color: #f0c85a;
  text-shadow: 0 1px 3px rgba(0,0,0,0.7);
}
.atl-section > .atl-src {
  font-size: 10px;
  margin: 0 0 8px;
  color: #f4e9d0;
  opacity: 0.7;
  font-family: monospace;
}
.atl-note {
  font-size: 11px;
  margin: 6px 0 0;
  color: #f4e9d0;
  opacity: 0.8;
  line-height: 1.5;
}
.atl-label {
  font-size: 10px;
  text-align: center;
  margin-top: 2px;
  color: #f4e9d0;
  opacity: 0.75;
}

/* État pressé forcé des boutons ronds (contrôle statique) */
.atl-round-pressed {
  background-image: url('./images/UI/buttons/btn-round-close-pressed.png') !important;
  transform: scale(0.92);
}

/* État pressé forcé (contrôle statique — dans le jeu c'est :active) */
.atl-pressed {
  background-image: url('./images/UI/buttons/btn-rect-pressed.png') !important;
  transform: translateY(1px);
}

/* Fond parchemin derrière les composants qui vivent sur .nb-page-frame
   dans le jeu (le cadre complet est montré dans sa propre section ; ici
   un simple fond crème suffit pour juger les composants). */
.atl-on-parchment {
  background: var(--nb-cream, #f3e6c8);
  border-radius: 10px;
  padding: 10px;
}
</style>

<body class="atl-body">

<div class="atl-header">
  <h1>🛠️ Atelier UI — Aethervale</h1>
  <p>Rendu réel des composants du chantier or/bronze, avec le vrai CSS et les vrais
  assets. Clique sur un emplacement ou une tuile pour basculer son état
  <code>.is-selected</code>. Change la largeur simulée pour vérifier le comportement
  aux tailles d'écran réelles.</p>
</div>

<div class="atl-widths" id="atl-widths">
  <button data-w="320px">320</button>
  <button data-w="360px">360</button>
  <button data-w="390px" class="is-active">390 (jeu)</button>
  <button data-w="480px">480</button>
  <button data-w="100%">Pleine largeur</button>
</div>

<div class="atl-widths" style="align-items:center">
  <label style="color:#f4e9d0;font-size:12px;font-weight:700">Taille icône dans le cadre :
    <input type="range" id="atl-icon-size" min="50" max="70" value="64" style="vertical-align:middle">
    <span id="atl-icon-size-val">64%</span>
  </label>
</div>

<div class="atl-stage" id="atl-stage">
  <div class="atl-panel-sim" id="atl-root"><!-- rempli par le script --></div>
</div>

<script>
"use strict";
/* =====================================================================
   Génération des spécimens. Chaque bloc reproduit le markup EXACT du
   builder du jeu indiqué en commentaire — si le builder change, mettre
   à jour ici dans la même livraison.
   ===================================================================== */

var RARITIES = ["common", "green", "rare", "epic", "legendary"];
var RARITY_LABELS = { common: "Commun", green: "Vert", rare: "Rare", epic: "Épique", legendary: "Légendaire" };

/* Miroir de buildEquipmentIconHTML (js/ui/ui-root.js:37) — cas "image
   chargée" : div .has-icon-img + <img> + fallback emoji. */
function iconHTML(cssClass, rarity, imgPath, emoji) {
  /* v3.164.0 : tous les points d'appel passent maintenant "... rframe"
     (cadre unifié, css/00-rframe.css) — cssClass doit l'inclure. */
  return '<div class="' + cssClass + ' rarity-' + rarity + ' has-icon-img">'
    + '<img src="' + imgPath + '" alt="">'
    + '<span class="icon-img-fallback">' + emoji + '</span>'
    + '</div>';
}

function swordPath(r) { return "images/Icons/equipment_icon/sword_" + r + ".png"; }
function armorPath(r) { return "images/Icons/equipment_icon/armor_" + r + ".png"; }

function section(title, src, innerHTML, note) {
  return '<div class="atl-section">'
    + '<h2>' + title + '</h2>'
    + '<p class="atl-src">' + src + '</p>'
    + innerHTML
    + (note ? '<p class="atl-note">' + note + '</p>' : '')
    + '</div>';
}

/* --- 1. Emplacements équipés (.eq-orbit-slot) ------------------------
   Structure réelle : .eq-layout > .nb-page-frame.eq-hero-card >
   .eq-hero-main > .eq-hero-right > .eq-slot-col × 2 (equipment-view.js).
   Le spécimen garde TOUTE cette imbrication : les largeurs de colonnes
   (flex 25% du panel) et les règles ".eq-hero-right .eq-orbit-slot"
   n'existent que dans ce contexte. */
function buildOrbitSection() {
  function slot(state, inner, extra) {
    /* miroir de buildEquipSlotHTML (js/ui/equipment-view.js:71) */
    return '<button class="eq-orbit-slot ' + state + (extra || "") + '" aria-label="spécimen" onclick="atlToggleSelect(this)">' + inner + '</button>';
  }
  var col1 = "", col2 = "";
  RARITIES.forEach(function (r, i) {
    var s = slot("filled", iconHTML("eq-orbit-slot-icon rframe", r, armorPath(r), "🛡️"));
    if (i < 3) col1 += s; else col2 += s;
  });
  /* sélectionné + vide + verrouillé */
  col2 += slot("filled", iconHTML("eq-orbit-slot-icon rframe", "epic", swordPath("epic"), "⚔️"), " is-selected");
  col1 += slot("empty", '<div class="eq-orbit-slot-icon eq-orbit-slot-placeholder">⚔️</div>');
  col2 += '<button class="eq-orbit-slot locked" aria-label="verrouillé"><div class="eq-orbit-slot-icon eq-orbit-slot-placeholder">🔒</div></button>';

  var html =
    '<div class="atl-on-parchment"><div class="eq-hero-main">'
    + '<div style="flex:1 1 auto"><p class="atl-label" style="color:#5a4a2a;opacity:1;text-align:left">← moitié gauche de l\'écran (détail), vide ici</p></div>'
    + '<div class="eq-hero-right">'
    + '<div class="eq-slot-col">' + col1 + '</div>'
    + '<div class="eq-slot-col">' + col2 + '</div>'
    + '</div></div></div>';

  return section(
    "1. Emplacements équipés — 5 raretés + sélectionné + vide + verrouillé",
    "css/04-panel-equipment.css (.eq-orbit-slot*) · js/ui/equipment-view.js (buildEquipSlotHTML)",
    html,
    "Largeur de colonne identique au jeu (25&nbsp;% du panel). Vérifier ici : ratio des cadres, halo de sélection, doubles cadrages."
  );
}

/* --- 2. Tuiles du sac (.eq-bag-tile) ---------------------------------
   Structure réelle : .eq-bag-flex > .eq-bag-inv-grid (50% de largeur,
   3 colonnes) — js/ui/equipment-view.js:207 (objet) et :214 (potion). */
function buildBagSection() {
  var tiles = "";
  RARITIES.forEach(function (r) {
    tiles += '<button class="eq-bag-tile rframe rarity-' + r + '" aria-label="' + RARITY_LABELS[r] + '" onclick="atlToggleSelect(this)">'
      + iconHTML("eq-bag-tile-icon", r, swordPath(r), "⚔️")
      + '</button>';
  });
  /* tuile sélectionnée */
  tiles += '<button class="eq-bag-tile rframe rarity-rare is-selected" aria-label="sélectionnée" onclick="atlToggleSelect(this)">'
    + iconHTML("eq-bag-tile-icon", "rare", armorPath("rare"), "🛡️")
    + '</button>';
  /* v3.180 : tuile RESSOURCE (cadre neutre, Entrepôt) */
  tiles += '<button class="eq-bag-tile rframe rframe-neutral" aria-label="ressource" onclick="atlToggleSelect(this)">'
    + '<img class="eq-bag-tile-icon" src="images/Icons/resources/meat_icon.png" alt="">'
    + '<span class="eq-bag-tile-stock">5.13K</span>'
    + '</button>';
  /* tuile potion avec badge de stock (renderIconOrEmojiHTML ne pose pas rarity-* sur l'icône) */
  tiles += '<button class="eq-bag-tile rframe rarity-common" aria-label="potion" onclick="atlToggleSelect(this)">'
    + '<div class="eq-bag-tile-icon">🧪</div>'
    + '<span class="eq-bag-tile-stock">12</span>'
    + '</button>';

  var html = '<div class="atl-on-parchment"><div class="eq-bag-flex">'
    + '<div class="eq-bag-inv-grid">' + tiles + '</div>'
    + '<div style="flex:1"><p class="atl-label" style="color:#5a4a2a;opacity:1;text-align:left">← panneau de détail, vide ici</p></div>'
    + '</div></div>';

  return section(
    "2. Sac / Inventaire — 5 raretés + sélectionnée + potion",
    "css/04-panel-equipment.css (.eq-bag-tile*) · js/ui/equipment-view.js:207",
    html,
    "Grille réelle : 3 colonnes sur 50&nbsp;% de la largeur du panel."
  );
}

/* --- 3. Icône du panneau de détail (.eq-detail-icon) ----------------- */
function buildDetailSection() {
  var html = '<div class="atl-on-parchment" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">';
  RARITIES.forEach(function (r) {
    html += '<div><div class="eq-detail-icon">' + iconHTML("eq-detail-icon-img rframe", r, swordPath(r), "⚔️") + '</div>'
      + '<p class="atl-label" style="color:#5a4a2a;opacity:1">' + RARITY_LABELS[r] + '</p></div>';
  });
  html += '</div>';
  return section(
    "3. Icône du panneau de détail (84×84)",
    "css/04-panel-equipment.css (.eq-detail-icon*)",
    html
  );
}

/* --- 4. Lignes compat/compare (40×40) -------------------------------- */
function buildCompatSection() {
  var rows = "";
  ["green", "epic"].forEach(function (r) {
    rows += '<div class="eq-compat-row">'
      + '<div class="eq-compat-icon">' + iconHTML("eq-compat-icon-img rframe", r, swordPath(r), "⚔️") + '</div>'
      + '<div class="eq-compat-info"><div class="eq-compat-name rarity-' + r + '">Épée ' + RARITY_LABELS[r].toLowerCase() + '</div>'
      + '<div class="eq-compat-stat">Attaque +12 <span class="eq-compat-delta is-up">(+4)</span></div></div>'
      + '<button class="nb-btn eq-compat-equip-btn">Équiper</button>'
      + '</div>';
  });
  var html = '<div class="atl-on-parchment"><div class="eq-compat-list" style="margin-top:0;padding-top:0;border-top:none">'
    + '<div class="eq-compat-title">DANS LE SAC</div>' + rows + '</div></div>';
  return section(
    "4. Mini-liste « Dans le sac » (icônes 40×40)",
    "css/04-panel-equipment.css (.eq-compat-*)",
    html
  );
}

/* --- 5. Boutique — carte d'achat (.nb-purchase-card) -----------------
   Miroir de js/ui/equip-shop-view.js (buildEquipShopItemCardHTML). */
function buildShopSection() {
  function card(r, name) {
    return '<div class="nb-purchase-card rarity-' + r + '">'
      + '<div class="nb-purchase-icon-col"><div class="nb-purchase-icon-slot">'
      + iconHTML("nb-purchase-icon rframe", r, swordPath(r), "⚔️")
      + '</div></div>'
      + '<div class="nb-purchase-info-col">'
      + '<div class="nb-purchase-name rarity-' + r + '">' + name + '</div>'
      + '<div class="nb-purchase-meta">' + RARITY_LABELS[r] + '</div>'
      + '<div class="nb-purchase-desc">Attaque +12</div>'
      + '</div>'
      + '<div class="nb-purchase-buy-col">'
      + '<button class="btn-buy" type="button"><img class="btn-buy-icon" src="images/Icons/gold_icon.png" alt="">1 250</button>'
      + '</div></div>';
  }
  var html = '<div class="atl-on-parchment">' + card("rare", "Lame d'acier") + card("legendary", "Croc du dragon") + '</div>';
  return section(
    "5. Boutique d'équipement — carte d'achat",
    "css/00-components.css (.nb-purchase-*) · js/ui/equip-shop-view.js",
    html,
    "Composant partagé par 5 écrans (Ascension, Donjon, Équipement, Potions, boutique générale)."
  );
}

/* --- 6. Sous-onglets (.pc-subtab-btn) --------------------------------
   Miroir du pattern commun (ex. js/ui/ascension-view.js:14). */
function buildSubtabSection() {
  var html = '<div class="pc-subtab-bar">'
    + '<button type="button" class="pc-subtab-btn is-active" onclick="atlOnlyActive(this)">⚔️<span>Équipement</span></button>'
    + '<button type="button" class="pc-subtab-btn" onclick="atlOnlyActive(this)">🎒<span>Inventaire</span></button>'
    + '<button type="button" class="pc-subtab-btn" onclick="atlOnlyActive(this)">🏪<span>Boutique</span></button>'
    + '</div>';
  return section(
    "6. Sous-onglets (pc-subtab + qb-tab Quêtes + filtres inv./Entrepôt depuis v3.182)",
    "css/00-components.css (.pc-subtab-btn) · assets btn-subtab-normal/selected.png",
    html,
    "Cliquer pour changer l'onglet actif."
  );
}

/* --- 7. Nav du bas (#tab-bar) ----------------------------------------
   Markup copié de index.html:84 (statique, pas généré par JS). */
function buildTabBarSection() {
  function tab(icon, label, active) {
    return '<button class="tab-btn' + (active ? " active" : "") + '" onclick="atlTabActive(this)">'
      + '<div class="tab-icon-frame">'
      + '<img src="./images/Icons/menu_icons/' + icon + '" alt="" class="tab-icon-img">'
      + '<span class="tab-label">' + label + '</span>'
      + '</div></button>';
  }
  var html = '<div id="tab-bar"><div id="tab-bar-row">'
    + tab("camp_menu.png", "Camp", true)
    + tab("quests_menu.png", "Quêtes")
    + tab("village_menu.png", "Village")
    + tab("heroes_menu.png", "Héros")
    + tab("menu_menu.png", "Menu")
    + '</div></div>';
  return section(
    "7. Navigation du bas",
    "css/02-layout.css (#tab-bar) · index.html:84",
    html,
    "Cliquer pour changer l'onglet actif. Ici la barre est dans le flux de la page (dans le jeu elle est en bas de la colonne flex de body) — même rendu, seule la position verticale diffère."
  );
}

/* --- 8. Cadre de page (.nb-page-frame, état actuel = parchemin) ------ */
function buildFrameSection() {
  var html = '<div class="nb-page-frame" style="min-height:180px">'
    + '<h3 style="color:var(--nb-ink)">Titre d\'exemple</h3>'
    + '<p style="color:var(--nb-ink-dim);font-size:12px">Contenu d\'exemple dans le cadre de page actuel (ecrantext2.png, thème parchemin — état d\'avant le chantier, suite à l\'annulation v3.157.0).</p>'
    + '</div>';
  return section(
    "8. Cadre de page (état actuel)",
    "css/00-components.css (.nb-page-frame)",
    html,
    "La future version « kit or/bronze » (annulée en v3.157.0) sera d'abord reconstruite ICI avant toute bascule dans le jeu."
  );
}

/* --- 9. Boutons rectangulaires du kit (.kbtn, css/00-kbtn.css) -------
   PAS ENCORE UTILISÉ PAR LE JEU : variantes à trancher par Seb ici,
   la bascule des 102 usages de .settings-btn viendra après. */
function buildKbtnSection() {
  /* v3.168.0 : choix figés (blanc / 260px / filtre / texte rouge) et
     BASCULE FAITE — .settings-btn du jeu utilise maintenant le kit
     (css/00-kbtn.css). Cette section montre les états FINAUX avec la
     vraie classe du jeu. */
  var html = '<div class="atl-on-parchment">'
    + '<button class="settings-btn">Normal</button>'
    + '<button class="settings-btn atl-pressed">Pressé (statique — maintenir un autre bouton pour le vrai :active)</button>'
    + '<button class="settings-btn" disabled>Verrouillé</button>'
    + '<button class="settings-btn danger">Réinitialiser tout (danger)</button>'
    + '<button class="settings-btn primary">Descendre dans la faille (primary — À CONFIRMER)</button>'
    + '<hr style="border:none;border-top:1px dashed #b09a6a;margin:12px 0">'
    + '<p class="atl-label" style="text-align:left;color:#5a4a2a;opacity:1">Achat / vente (v3.169 : .btn-buy sur le kit, taille réelle des cartes)</p>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    + '<button class="btn-buy" style="width:92px"><img class="btn-buy-icon" src="images/Icons/gold_icon.png" alt="">1 250</button>'
    + '<button class="btn-buy cant-afford" style="width:92px"><img class="btn-buy-icon" src="images/Icons/gold_icon.png" alt="">9 999</button>'
    + '<button class="btn-buy is-bought" style="width:92px" disabled>Acheté</button>'
    + '<button class="btn-buy">Équiper</button>'
    + '</div>'
    + '<button class="inv-sell-all-btn">🗑️ Tout vendre</button>'
    + '<hr style="border:none;border-top:1px dashed #b09a6a;margin:12px 0">'
    + '<p class="atl-label" style="text-align:left;color:#5a4a2a;opacity:1">Boutons ronds (v3.175 : fermer EN JEU — .full-menu-close/.hc-close-btn ; retour/plus en réserve)</p>'
    + '<div style="display:flex;gap:10px;align-items:center">'
    + '<button class="full-menu-close">✕</button>'
    + '<button class="krbtn krbtn-close atl-round-pressed">✕</button>'
    + '<button class="krbtn krbtn-back">Retour</button>'
    + '<button class="krbtn krbtn-plus">+</button>'
    + '</div>'
    + '<p class="atl-label" style="text-align:left;color:#5a4a2a;opacity:1">(2e = état pressé forcé ; maintenir les autres pour le vrai :active)</p>'
    + '<hr style="border:none;border-top:1px dashed #b09a6a;margin:12px 0">'
    + '<p class="atl-label" style="text-align:left;color:#5a4a2a;opacity:1">Contextes redimensionnés (surcharges d\'écran conservées)</p>'
    + '<div class="equip-toolbar"><button class="settings-btn">⇅ Trier</button><button class="settings-btn">Filtrer</button><button class="settings-btn">⚙ Réglages</button></div>'

  return section(

}

/* --- 10. Jauges du kit (.kgauge, css/00-kgauge.css) ------------------

      + '<div class="kgauge ' + variant + ' ' + fillClass + '">'
      + '<div class="kgauge-track"><div class="kgauge-fill atl-gfill" style="width:' + pct + '%"></div></div>'
      + '<span class="kgauge-text">' + text + '</span>'
      + '</div>';
  }
  var html = '<div class="atl-on-parchment">'
    + '<label style="display:block;font-size:11px;color:#5a4a2a;font-weight:700;margin-bottom:6px">Remplissage : <input type="range" id="atl-gauge-pct" min="0" max="100" value="72" style="vertical-align:middle;width:160px"> <span id="atl-gauge-pct-val">72%</span></label>'
    + g('kgauge-dragon', 'kgauge-hp', 'dragon — proposition : PV du HÉROS (la plus ornée, tête à gauche côté portrait)', 72, 'PV 720/1000')
    + g('kgauge-dragon-claw', 'kgauge-hp-enemy', 'dragon-claw — PV ennemi NORMAL (décision v3.171 : cohérent avec élite/boss)', 72, '720/1000')
    + g('kgauge-elite', 'kgauge-hp-enemy', 'elite — proposition : PV ennemi ÉLITE', 72, '720/1000')
    + g('kgauge-boss', 'kgauge-hp-enemy', 'boss (œil) — proposition : PV de BOSS', 72, '720/1000')
    + g('kgauge-thin', 'kgauge-rage', 'thin — proposition : ressources de classe (ici Rage)...', 72, '72/100')
    + g('kgauge-thin', 'kgauge-mana', '...Mana...', 72, '72/100')
    + g('kgauge-thin', 'kgauge-focus', '...Concentration...', 72, '72/100')
    + g('kgauge-thin', '', '...et célérité (jauge ⚡ du combat)', 72, '⚡ 72%')
    + g('kgauge-thin', 'kgauge-xp', 'thin — aussi proposé pour l\'XP et les progressions hors combat', 72, 'Niv. 12 — 72%')
    + '</div>';
  return section(
    "10. Jauges du kit — EN JEU depuis v3.172.0 (combat)",
    "css/00-kgauge.css · images/UI/gauges/*.png (fenêtres mesurées au pixel)",
    html,
    "v3.172 : bascul\u00e9 en jeu (PV ennemi = dragon-claw/boss selon le type, PV h\u00e9ros = dragon, ressource de classe + c\u00e9l\u00e9rit\u00e9 = thin) ; flat retir\u00e9e (d\u00e9cision). Les hauteurs suivent maintenant le RATIO des cadres : barres plus hautes qu\u2019avant, \u00e0 v\u00e9rifier dans le layout combat r\u00e9el."
  );
}

/* --- Interactions de la galerie -------------------------------------- */
function atlToggleSelect(el) { el.classList.toggle("is-selected"); }

function atlOnlyActive(el) {
  var siblings = el.parentElement.querySelectorAll(".pc-subtab-btn");
  siblings.forEach(function (b) { b.classList.remove("is-active"); });
  el.classList.add("is-active");
}

function atlTabActive(el) {
  var siblings = el.parentElement.querySelectorAll(".tab-btn");
  siblings.forEach(function (b) { b.classList.remove("active"); });
  el.classList.add("active");
}

/* Curseur --rframe-icon : règle en direct la taille des icônes dans les
   cadres (la valeur retenue par Seb sera ensuite reportée dans
   css/00-rframe.css, seule source de vérité). Valeur figée : 64 %
   (choix Seb, v3.165). Au-delà de ~65 %, l'icône touche le nouveau
   cadre légendaire (cavité mesurée la plus serrée des 5) — le curseur
   monte à 70 % exprès pour pouvoir VOIR cette limite. */
/* Curseur des jauges (section 10) */
document.getElementById("atl-gauge-pct").addEventListener("input", function () {
  var v = this.value;
  document.getElementById("atl-gauge-pct-val").textContent = v + "%";
  document.querySelectorAll(".atl-gfill").forEach(function (f) { f.style.width = v + "%"; });
});

document.getElementById("atl-icon-size").addEventListener("input", function () {
  document.documentElement.style.setProperty("--rframe-icon", this.value + "%");
  document.getElementById("atl-icon-size-val").textContent = this.value + "%";
});

/* Sélecteur de largeur simulée */
document.getElementById("atl-widths").addEventListener("click", function (e) {
  var btn = e.target.closest("button[data-w]");
  if (!btn) return;
  document.getElementById("atl-stage").style.setProperty("--atl-w", btn.dataset.w);
  this.querySelectorAll("button").forEach(function (b) { b.classList.remove("is-active"); });
  btn.classList.add("is-active");
});
</script>
